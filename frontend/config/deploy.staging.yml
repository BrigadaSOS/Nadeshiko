service: nadeshiko-frontend-stg
image: brigadasos/nadeshiko-frontend-stg

servers:
  web:
    options:
      # 768MiB RAM plus 256MiB swap.
      memory: 768m
      memory-swap: 1g
      # Staging shares the four-core host; reserve CPU for production services.
      cpus: "0.5"
      # Repeat init because Kamal replaces deploy.yml's options block.
      init: true
      # Repeat host.docker.internal because Kamal replaces, not merges, add-host.
      add-host:
        - host.docker.internal:host-gateway
        # Route through the host gateway, not kamal-proxy's ephemeral IP; retain TLS/SNI.
        - api-stg.nadeshiko.co:host-gateway

# Persist old /_nuxt/* assets so deploys do not break open tabs (assetArchive.ts).
# Staging exercises the same archive path on every main push. Before first deploy:
#   ssh nadeshiko "sudo mkdir -p /var/lib/nadeshiko/frontend-stg/asset-archive \
#     && sudo chown 1000:1000 /var/lib/nadeshiko/frontend-stg/asset-archive"
volumes:
  - "/var/lib/nadeshiko/frontend-stg/asset-archive:/app/asset-archive"

builder:
  args:
    NUXT_PUBLIC_ENVIRONMENT: development

proxy:
  # Bind on loopback and the Docker bridge for the private Caddy proxy.
  run:
    bind_ips: [127.0.0.1, 172.17.0.1]
  ssl: true
  host: stg.nadeshiko.co
  app_port: 3000
  forward_headers: true
  # Nitro liveness only; backend availability does not gate /up.
  healthcheck:
    path: /up
    interval: 2
    timeout: 5

env:
  secret:
    - NUXT_NADESHIKO_API_KEY
    - NUXT_INTERNAL_PROXY_SECRET
    - NUXT_SHIRABE_API_KEY
    # E2E bypasses the HTML and /v1 IP limits and SSR admission; never set in prod.
    - NUXT_RATE_LIMIT_BYPASS_SECRET

  clear:
    NUXT_RELEASE_SHA: <%= ENV.fetch("VERSION", "unknown") %>
    NUXT_PUBLIC_ENVIRONMENT: development
    # The key is absent during build, so explicitly enable the public runtime flag.
    # Enable only where NUXT_SHIRABE_API_KEY is configured; never put it in the image.
    NUXT_PUBLIC_SHIRABE_LOOKUPS: "true"
    # Staging uses public production Shirabe. Use the apex: www redirects across
    # origins, stripping Authorization (measured www -> 401, apex -> 200).
    NUXT_SHIRABE_API_BASE: https://shirabe.org
    NODE_ENV: production
    NUXT_BACKEND_INTERNAL_URL: https://api-stg.nadeshiko.co
    PORT: 3000
    LOG_LEVEL: info

    # Keep this path and the persistent archive mount together.
    NUXT_ASSET_ARCHIVE_DIR: /app/asset-archive
    # Seven days covers review sessions; main deploys more often than prod releases.
    NUXT_ASSET_ARCHIVE_DAYS: "7"

    OTEL_EXPORTER_OTLP_ENDPOINT: "http://host.docker.internal:4328"
    OTEL_SERVICE_NAME: nadeshiko-frontend-stg
    OTEL_SEMCONV_STABILITY_OPT_IN: http
    # Bare node does not set npm_package_version; render the version at deploy time.
    OTEL_SERVICE_VERSION: <%= File.read("package.json")[/"version":\s*"([^"]+)"/, 1] %>

    # Web vitals use PostHog, not a public Alloy collector.
