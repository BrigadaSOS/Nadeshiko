service: nadeshiko-frontend-stg
image: brigadasos/nadeshiko-frontend-stg

servers:
  web:
    options:
      # Memory limit: 768MB RAM + 256MB swap for stg
      memory: 768m
      memory-swap: 1g
      # Resolve Shirabe's own hostname to inari's Tailscale address, so a word
      # lookup goes straight over the tailnet instead of out to Cloudflare and
      # back for two boxes in the same city (~175ms against ~33ms of real work).
      #
      # Same trick this container already uses for the backend, where
      # api-stg.nadeshiko.co resolves to kamal-proxy on this host: because the
      # name is genuine, SNI, Host and the certificate all still line up, and it
      # reaches Shirabe through its normal proxy rather than a second door.
      #
      # A published port on inari was the first attempt and was wrong: a fixed
      # host port cannot be held by two containers at once, so it broke Kamal's
      # zero-downtime deploy on the very next Shirabe release.
      #
      # It is `www` that gets mapped and NOT the apex, which is the reverse of how
      # this was first written. The apex has to stay public because it is the
      # fallback; www is the one that can leave the public internet, because
      # Cloudflare 301s www to the apex and a bearer token does not survive a
      # cross-origin redirect (see NUXT_SHIRABE_API_BASE below). Measured
      # 2026-08-11: the ORIGIN serves both names 200, so the redirect is
      # Cloudflare's alone and skipping Cloudflare skips it.
      add-host:
        - host.docker.internal:host-gateway
        - www.shirabe.org:100.73.93.89

builder:
  args:
    NUXT_PUBLIC_ENVIRONMENT: development

proxy:
  ssl: true
  host: stg.nadeshiko.co
  app_port: 3000
  forward_headers: true
  # Liveness of the Nitro server only; it deliberately does not probe the
  # backend -- see frontend/server/routes/up.ts.
  healthcheck:
    path: /up
    interval: 2
    timeout: 5

env:
  secret:
    - NUXT_NADESHIKO_API_KEY
    - NUXT_INTERNAL_PROXY_SECRET
    - NUXT_SHIRABE_API_KEY
    # Staging only, and deliberately absent from deploy.prod.yml: it lets the
    # end-to-end suite past the per-IP HTML limiter, which a single CI runner
    # cannot otherwise stay inside. On production the limiter has no bypass.
    - NUXT_RATE_LIMIT_BYPASS_SECRET

  clear:
    NUXT_PUBLIC_ENVIRONMENT: development
    # `shirabeLookups` is derived from NUXT_SHIRABE_API_KEY in nuxt.config, which
    # is evaluated during `nuxt build` -- inside the image, where the key is not
    # present and must not be. The boolean therefore bakes in as false however the
    # key is set at runtime, so the public flag is set here instead. Only valid
    # where the key IS configured: turning it on without one is exactly the doomed
    # per-hover request the flag exists to prevent.
    NUXT_PUBLIC_SHIRABE_LOOKUPS: "true"
    # The word card itself, which is still being built. Staging is where it is
    # being built, so it is on here and set nowhere in deploy.prod.yml -- unset
    # means off, which is the whole point of the default. Prod is otherwise fully
    # wired now (its own key, its own hosts), so turning it on there is adding this
    # one line and nothing else. Delete this line and the flag once the card ships,
    # rather than adding the opposite line to prod: a flag that has to be turned OFF
    # somewhere is one that ships by accident from the next environment nobody
    # remembered to edit.
    NUXT_PUBLIC_SHIRABE_WORD_CARD: "true"
    # The fast path and the fallback are the same service under two of its own
    # hostnames, which is what lets one skip Cloudflare while the other keeps
    # working if the tailnet does not.
    #
    # www.shirabe.org is mapped to inari's Tailscale IP by add-host above, so this
    # goes over the tailnet with a genuine hostname and certificate. Prod Shirabe
    # deliberately: staging has no Shirabe of its own, and the public URL reached
    # the same service anyway.
    NUXT_SHIRABE_API_DIRECT: https://www.shirabe.org
    # The APEX is the fallback, and it must not be www. Cloudflare 301s www to the
    # apex, and a 301 is cross-origin, so undici (Nitro's fetch) strips the
    # Authorization header when it follows -- the request arrives unauthenticated
    # and Shirabe answers 401 "API key required". Measured in node 2026-08-11:
    #
    #   https://www.shirabe.org/api/v1/words/... -> 401, redirected=true
    #   https://shirabe.org/api/v1/words/...     -> 200
    #
    # This is a FIX, not a copy: staging ran a www fallback that could never have
    # answered, and nothing noticed because the tailnet almost never fails.
    NUXT_SHIRABE_API_BASE: https://shirabe.org
    NODE_ENV: production
    NUXT_BACKEND_INTERNAL_URL: https://api-stg.nadeshiko.co
    PORT: 3000
    LOG_LEVEL: info

    OTEL_EXPORTER_OTLP_ENDPOINT: "http://host.docker.internal:4328"
    OTEL_SERVICE_NAME: nadeshiko-frontend-stg
    OTEL_SEMCONV_STABILITY_OPT_IN: http
    # See the note in deploy.prod.yml -- staging reported 0.0.0 for the same
    # reason, and a staging build you cannot identify is the one you are most
    # likely to be comparing against.
    OTEL_SERVICE_VERSION: <%= File.read("package.json")[/"version":\s*"([^"]+)"/, 1] %>

    # Grafana Faro browser RUM → host Alloy Faro receiver (:4329, /collect) via
    # kamal-proxy; CORS allows dev.nadeshiko.co. Re-enabled (was commented out).
    NUXT_PUBLIC_FARO_URL: "https://o.nadeshiko.co/collect"
