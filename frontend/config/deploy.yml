servers:
  web:
    hosts:
      - nadeshiko
    options:
      add-host: host.docker.internal:host-gateway
      # An init as PID 1, so orphans get reaped. Node is PID 1 without it and
      # Node does not reap: the container's own healthcheck (`node -e fetch(/up)`,
      # 5s timeout) leaves its child re-parented to Node whenever a check times
      # out under load, and it stays a zombie until the container dies. Counted
      # 2026-08-31: 49 across the four frontend and backend containers, every one
      # dated to a minute the box was overloaded. Harmless to the app, but the
      # process table is not infinite and a host full of defunct entries reads
      # like a crash that never happened. NOTE: Kamal REPLACES this block from the
      # per-destination file rather than merging it, so `init` is repeated there.
      init: true

registry:
  server: ghcr.io
  username: kamal
  password:
    - KAMAL_REGISTRY_PASSWORD

aliases:
  console: app exec --interactive --reuse "bash"
  logs: app logs -f

builder:
  arch: amd64
  # The image installs from the workspace lockfile, so the build context is the
  # repository root rather than this app's directory. CI builds separately and
  # deploys with --skip-push, so without this a plain `kamal deploy` fails on a
  # missing /package-lock.json while CI stays green.
  context: ..
  dockerfile: Dockerfile

ssh:
  user: docker

# Kamal defaults to a single 10m json-file with no rotation history, which
# truncates away the context around an incident.
logging:
  driver: json-file
  options:
    max-size: 20m
    max-file: 5
