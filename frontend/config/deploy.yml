servers:
  web:
    hosts:
      - nadeshiko
    options:
      add-host: host.docker.internal:host-gateway
      # init=true reaps healthcheck orphans. Kamal replaces this options block in
      # destination files rather than merging it, so repeat init there.
      init: true

registry:
  server: ghcr.io
  username: kamal
  password:
    - KAMAL_REGISTRY_PASSWORD

aliases:
  console: app exec --interactive --reuse "bash"
  logs: app logs -f

builder:
  arch: amd64
  # Use the repository root for the workspace lockfile; CI uses --skip-push,
  # but a local kamal deploy must build from the same context.
  context: ..
  dockerfile: Dockerfile

ssh:
  user: docker

# Keep rotated logs so incidents retain more than Kamal's default 10m file.
logging:
  driver: json-file
  options:
    max-size: 20m
    max-file: 5
