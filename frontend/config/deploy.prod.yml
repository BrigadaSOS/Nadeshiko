service: nadeshiko-frontend-prod
image: brigadasos/nadeshiko-frontend-prod

servers:
  web:
    options:
      # 2GiB RAM plus 256MiB swap for two workers. Keep the container budget,
      # per-worker NODE_OPTIONS heap cap, and SSR admission limit coordinated.
      memory: 2g
      memory-swap: 2.25g
      # Reap healthcheck orphans; repeat init because this block replaces deploy.yml.
      init: true
      # Fence two workers to 2.5 of four cores, leaving capacity for the backend,
      # Elasticsearch and Postgres that renders depend on.
      cpus: "2.5"
      # Docker defaults core limits to zero. Also configure the host's core_pattern
      # for systemd-coredump via brigadasos-infra/hetzner/setup-coredumps.sh.
      ulimit: core=-1
      # Kamal replaces add-host rather than merging; repeat host.docker.internal.
      add-host:
        - host.docker.internal:host-gateway
        # Host gateway survives kamal-proxy replacement while retaining API TLS/SNI.
        - api.nadeshiko.co:host-gateway

# Host bind mounts preserve diagnostics after container loss and old /_nuxt/*
# chunks across deploys for open tabs. See assetArchive.ts and DEPLOYMENT.md.
# Prepare diagnostics and archive directories writable by uid 1000 before deploy:
#   ssh nadeshiko "sudo mkdir -p /var/lib/nadeshiko/frontend-prod/diagnostics \
#     /var/lib/nadeshiko/frontend-prod/asset-archive \
#     && sudo chown 1000:1000 /var/lib/nadeshiko/frontend-prod/diagnostics \
#     /var/lib/nadeshiko/frontend-prod/asset-archive"
# docker-entrypoint.sh creates/chowns the sitemap snapshot directory.
volumes:
  - "/var/lib/nadeshiko/frontend-prod/diagnostics:/app/diagnostics"
  - "/var/lib/nadeshiko/frontend-prod/asset-archive:/app/asset-archive"
  - "/var/lib/nadeshiko/frontend-prod/sitemap-snapshots:/app/sitemap-snapshots"

builder:
  args:
    NUXT_PUBLIC_ENVIRONMENT: production
    NITRO_PRESET: node_cluster

proxy:
  # Bind on loopback and the Docker bridge for the private Caddy proxy.
  run:
    bind_ips: [127.0.0.1, 172.17.0.1]
  ssl: true
  host: nadeshiko.co
  app_port: 3000
  forward_headers: true
  # Nitro liveness only; backend availability does not gate /up.
  healthcheck:
    path: /up
    interval: 2
    timeout: 5
  # Limit slow-backend slot holds to 10s. Baseline p95 was 431ms; the 2026-08-30
  # flood held 2,037 renders for the former 30s timeout. SSR admission bounds the
  # queue; this timeout bounds admitted requests waiting on a slow backend.
  response_timeout: 10

env:
  secret:
    - NUXT_NADESHIKO_API_KEY
    - NUXT_INTERNAL_PROXY_SECRET
    # Separate lookup key from staging and backend corpus parsing for independent revocation.
    - NUXT_SHIRABE_API_KEY

  clear:
    NUXT_RELEASE_SHA: <%= ENV.fetch("VERSION", "unknown") %>
    NUXT_PUBLIC_ENVIRONMENT: production
    NODE_ENV: production

    # The key is absent during build, so explicitly enable the public runtime flag.
    # Enable only where NUXT_SHIRABE_API_KEY is configured; never put it in the image.
    NUXT_PUBLIC_SHIRABE_LOOKUPS: "true"
    # Use the public apex, not www: cross-origin redirects strip Authorization.
    # Measured in Node: www -> 401 after redirect, apex -> 200. No tailnet mapping.
    NUXT_SHIRABE_API_BASE: https://shirabe.org

    NUXT_BACKEND_INTERNAL_URL: https://api.nadeshiko.co
    PORT: 3000
    LOG_LEVEL: info

    # Keep the archive path and persistent mount together; empty disables it.
    # The plugin refuses to create a missing directory to avoid ephemeral storage.
    NUXT_ASSET_ARCHIVE_DIR: /app/asset-archive
    NUXT_SITEMAP_SNAPSHOT_DIR: /app/sitemap-snapshots

    # The builder arg selects node-cluster at build time via nuxt.config.ts;
    # runtime NITRO_PRESET alone cannot change the bundle. Workers have separate
    # caches and rate-limit buckets; perWorkerMax divides limits only in workers.
    #
    # Two workers use spare CPU: during the 2026-08-30 flood, one event loop capped
    # search renders at ~6.4/s while host CPU was 61-74%. Two provide ~12/s capacity
    # against a measured human peak of 0.67/s in the week to 2026-08-31.
    # With eight renders admitted per worker, one container peaked at 577MiB
    # through the flood; manual copies held 400-475MiB each. Budget ~1.1GiB for
    # two workers plus the primary inside 2GiB, with 640MiB old-space caps per process.
    # Leave off-heap headroom and budget old/new containers together during deploy.
    # Three workers compete with downstream services on this four-core host;
    # the 2.5-core fence leaves those services capacity.
    NITRO_PRESET: node_cluster
    NITRO_CLUSTER_WORKERS: 2

    # Eight renders per worker (sixteen total); excess gets immediate 503, not
    # queued SSR work. See server/middleware/99-ssr-admission.ts for sizing.
    NUXT_SSR_MAX_INFLIGHT: 8

    # Service-wide per-IP requests/minute; perWorkerMax uses ceil(max/workers).
    # Buckets are process-local, so a client pinned to one worker gets its share,
    # not the full service budget. Staging runs one process and uses env.ts defaults.
    # Measured over a normal 3.5h window: busiest browser HTML 27/min, others <=11,
    # crawler without a user-agent 133/min; busiest browser /v1 traffic 34/min.
    # HTML 60/min leaves real-reader headroom below crawler volume; auth is tighter.
    NUXT_RATE_LIMIT_HTML_MAX: 60
    NUXT_RATE_LIMIT_V1_API_MAX: 120
    NUXT_RATE_LIMIT_V1_AUTH_MAX: 30
    # Six divides evenly across two workers (three each); ceil(5/2) also gives
    # three, but six accurately states the combined feedback budget.
    NUXT_RATE_LIMIT_V1_FEEDBACK_MAX: 6

    # Runtime NODE_OPTIONS replaces the Dockerfile default, not appends to it;
    # forks inherit these flags. 640MiB caps old space per process, not total RSS:
    # leave headroom under 2GiB for the primary, young heaps and native buffers.
    # Adjust diagnostics with kamal env push plus a restart, without rebuilding.
    # Fatal V8 errors (including heap OOM) and uncaught JS exceptions write reports;
    # SIGSEGV/GPF needs the host core-dump setup above, not these report flags.
    # On-demand report from a live process: docker kill -s SIGUSR2 <container>.
    # Keep /app/diagnostics mounted and writable to retain reports after restart.
    NODE_OPTIONS: "--max-old-space-size=640 --report-on-fatalerror --report-uncaught-exception --report-on-signal --report-directory=/app/diagnostics"

    OTEL_EXPORTER_OTLP_ENDPOINT: "http://host.docker.internal:4328"
    OTEL_SERVICE_NAME: nadeshiko-frontend-prod
    OTEL_SEMCONV_STABILITY_OPT_IN: http
    # Bare node does not set npm_package_version; read package.json at deploy time.
    # String scanning avoids relying on JSON constants in Kamal's ERB binding.
    OTEL_SERVICE_VERSION: <%= File.read("package.json")[/"version":\s*"([^"]+)"/, 1] %>

    # Browser web vitals use PostHog; the old public collector is retired.
    # SSR telemetry still reaches Alloy privately via host.docker.internal:4328.
