service: nadeshiko-frontend-prod
image: brigadasos/nadeshiko-frontend-prod

servers:
  web:
    options:
      # Memory limit: 1.5GB RAM + 256MB swap.
      #
      # Was 1g, on the arithmetic that three Nitro workers want 200-300MB each. They
      # want more than that now: measured 2026-08-12, the container's working set ran
      # 600-900MB for a day straight and peaked at 906MB. That is 84% of a 1g cap --
      # under NadeshikoContainerMemoryNearLimit's 90%, so the alert would have stayed
      # quiet right up until V8 started failing mark-compacts, which is how #484 went.
      # At 1.5g the same peak is 60% and the alert is an early warning again.
      #
      # Note that the ceiling here is the real one: Node sizes its default heap from
      # the cgroup limit, so raising --max-old-space-size without raising this would
      # only trade V8's FATAL ERROR (which writes a report, see NODE_OPTIONS below)
      # for a silent kernel kill.
      memory: 1.5g
      memory-swap: 1.75g
      # Docker hands the container a core-dump limit of 0, so a segfaulting
      # worker dies leaving nothing but a one-line kernel trap. Raising it is
      # only half the job: the kernel writes the dump through the *host's*
      # kernel.core_pattern, which has to be pointed at systemd-coredump --
      # see brigadasos-infra/hetzner/setup-coredumps.sh. Without that script
      # this flag is inert rather than wrong.
      ulimit: core=-1
      # Overrides the single-entry `add-host` in deploy.yml, which Kamal replaces
      # rather than merges, so `host.docker.internal` has to be repeated here.
      #
      # Resolving one of Shirabe's own hostnames to inari's Tailscale address sends
      # a word lookup straight over the tailnet instead of out to Cloudflare and
      # back for two boxes in the same city (~175ms against ~33ms of real work).
      # The name is genuine, so SNI, Host and the certificate still line up and it
      # arrives through Shirabe's normal proxy rather than a second door.
      #
      # It is `www` that gets mapped, and NOT the apex, which is the opposite of
      # how staging had it. The apex is the name that has to stay public, because
      # it is the fallback -- and www is the one that can afford to leave the
      # public internet, because Cloudflare 301s www to the apex and a redirect is
      # exactly what a bearer token cannot survive (see NUXT_SHIRABE_API_BASE).
      # Measured 2026-08-11: the ORIGIN serves both names 200, so that redirect is
      # Cloudflare's alone and skipping Cloudflare skips it.
      add-host:
        - host.docker.internal:host-gateway
        - www.shirabe.org:100.73.93.89

# Diagnostic reports written by the Node flags in NODE_OPTIONS below. A bind
# mount and not a named volume on purpose: the whole value is being able to read
# the files from the host *after* the container that produced them is gone, and
# a crash-looping container is exactly when `docker volume inspect` is the least
# convenient way in.
#
# The directory has to exist and be writable by uid 1000 (`node`, which
# docker-entrypoint.sh drops to) before the first deploy, or Node silently
# writes nothing:
#   ssh nadeshiko "sudo mkdir -p /var/lib/nadeshiko/frontend-prod/diagnostics \
#     && sudo chown 1000:1000 /var/lib/nadeshiko/frontend-prod/diagnostics"
volumes:
  - "/var/lib/nadeshiko/frontend-prod/diagnostics:/app/diagnostics"

builder:
  args:
    NUXT_PUBLIC_ENVIRONMENT: production
    NITRO_PRESET: node_cluster

proxy:
  ssl: true
  host: nadeshiko.co
  app_port: 3000
  forward_headers: true
  # Liveness of the Nitro server only; it deliberately does not probe the
  # backend -- see frontend/server/routes/up.ts.
  healthcheck:
    path: /up
    interval: 2
    timeout: 5

env:
  secret:
    - NUXT_NADESHIKO_API_KEY
    - NUXT_INTERNAL_PROXY_SECRET
    # Word lookups. Its own key, not staging's and not the backend's: the backend's
    # SHIRABE_API_KEY parses the corpus, this one reads definitions for a reader, and
    # sharing one credential would mean neither could be revoked on its own.
    - NUXT_SHIRABE_API_KEY

  clear:
    NUXT_PUBLIC_ENVIRONMENT: production
    NODE_ENV: production

    # `shirabeLookups` is derived from NUXT_SHIRABE_API_KEY in nuxt.config, which is
    # evaluated during `nuxt build` -- inside the image, where the key is not present
    # and must not be. The boolean therefore bakes in as false however the key is set
    # at runtime, so the public flag is set here instead. Only valid where the key IS
    # configured: turning it on without one is exactly the doomed per-hover request
    # the flag exists to prevent.
    NUXT_PUBLIC_SHIRABE_LOOKUPS: "true"
    #
    # NUXT_PUBLIC_SHIRABE_WORD_CARD is deliberately ABSENT, so the card is still off
    # for readers. Everything underneath it is wired and proven -- the key resolves,
    # both hosts answer 200 -- and this one line is all that is left to turn it on:
    #
    #   NUXT_PUBLIC_SHIRABE_WORD_CARD: "true"
    #
    # Absent rather than `"false"` on purpose. Unset already means off (the default in
    # config/env.ts), and a flag written as false somewhere is one that ships by
    # accident from the next environment nobody remembered to edit. Nothing above
    # renders while this is missing: `lookupsEnabled` is ANDed with the card, so the
    # lookups flag and the key sit inert rather than firing per-hover requests.
    # The fast path and the fallback are the same service under two of its own
    # hostnames, which is what lets one skip Cloudflare while the other keeps working
    # if the tailnet does not. The lookup route falls back per request and parks the
    # direct path on a doubling cooldown, so losing the tailnet costs latency, never
    # answers.
    #
    # www is the one mapped onto the tailnet by add-host above, so this never leaves
    # the host and never meets Cloudflare's redirect.
    NUXT_SHIRABE_API_DIRECT: https://www.shirabe.org
    # The APEX is the fallback, and it must not be www. Cloudflare 301s www to the
    # apex, and a 301 is cross-origin, so undici (Nitro's fetch) strips the
    # Authorization header when it follows -- the request arrives unauthenticated and
    # Shirabe answers 401 "API key required". Measured in node 2026-08-11:
    #
    #   https://www.shirabe.org/api/v1/words/... -> 401, redirected=true
    #   https://shirabe.org/api/v1/words/...     -> 200
    #
    # So a www fallback is not a slow path, it is a broken one, and it only ever
    # looked fine because the tailnet almost never fails. The apex is proxied by
    # Cloudflare and 200s directly.
    NUXT_SHIRABE_API_BASE: https://shirabe.org

    NUXT_BACKEND_INTERNAL_URL: https://api.nadeshiko.co
    PORT: 3000
    LOG_LEVEL: info

    NITRO_PRESET: node_cluster
    NITRO_CLUSTER_WORKERS: 3

    # Per-IP rate limits, set here rather than left to the defaults in
    # config/env.ts because the default is not the number that gets enforced.
    #
    # The buckets are an in-process Map (server/utils/ipRateLimit.ts) and there
    # are NITRO_CLUSTER_WORKERS of them, each keeping its own count. A visitor
    # is spread across workers, so the ceiling they actually meet is up to three
    # times whatever is written here. These are therefore PER WORKER, set to one
    # third of the intended limit:
    #
    #   HTML     20 x 3 =  60/min
    #   /v1/*    40 x 3 = 120/min   search, media, the browser-facing proxy.
    #   /v1/auth 10 x 3 =  30/min   tighter: the credential-stuffing door.
    #
    # Chosen against measured traffic rather than picked, from kamal-proxy logs
    # over a normal 3.5h window (per client IP per minute, busiest first):
    #
    #   HTML    133/min  an IP sending NO user-agent at all -- the bot
    #            27/min  busiest real browser
    #            <=11/min  everyone else
    #   /v1/*    34/min  busiest real browser
    #
    # So 60/min leaves the heaviest genuine reader ~2x headroom while sitting
    # well under the crawler, which is the gap these want to land in. Note this
    # is a deliberate TIGHTENING: the old defaults worked out to 180/360/90
    # effective, above even the bot, so nothing was ever going to trip them.
    #
    # If NITRO_CLUSTER_WORKERS changes, these have to change with it or the
    # effective limit moves silently. A shared store would remove the coupling;
    # until then the arithmetic lives here, next to the worker count.
    #
    # Staging is deliberately not given these: it runs a single process, so the
    # config/env.ts defaults are already its true limits.
    NUXT_RATE_LIMIT_HTML_MAX: 20
    NUXT_RATE_LIMIT_V1_API_MAX: 40
    NUXT_RATE_LIMIT_V1_AUTH_MAX: 10

    # Diagnostics for the recurring crash where a Nitro process dies on a
    # general protection fault at the same libc offset every time (+0x50f),
    # taking the container with it and turning every in-flight request into a
    # kamal-proxy 502. Set here rather than in the Dockerfile CMD so it can be
    # changed with `kamal env push` + a restart instead of a rebuild, and so the
    # cluster workers inherit it -- they are forked from the primary and get its
    # environment, which is the half of the process tree actually serving.
    #
    # Read what each flag does buy, because it is less than it looks:
    #   --report-on-fatalerror     V8/runtime fatal errors (heap OOM, failed C++
    #                              assertions). Verified NOT to fire on SIGSEGV.
    #   --report-uncaught-exception an uncaught JS throw, with the stack.
    #   --report-on-signal          a report on demand from a live process:
    #                                 docker kill -s SIGUSR2 <container>
    #                              which is the one to reach for during an
    #                              escalation, while the process is still up.
    #
    # None of these catch the GPF itself -- that is what the core dump is for.
    # They are here to rule in or out the failure modes that could be happening
    # *alongside* it, at the cost of a ~100KB JSON file when they fire.
    NODE_OPTIONS: "--report-on-fatalerror --report-uncaught-exception --report-on-signal --report-directory=/app/diagnostics"

    OTEL_EXPORTER_OTLP_ENDPOINT: "http://host.docker.internal:4328"
    OTEL_SERVICE_NAME: nadeshiko-frontend-prod
    OTEL_SEMCONV_STABILITY_OPT_IN: http
    # `service.version` read 0.0.0 on every deployed build, because
    # instrumentation.mjs took it from npm_package_version and the container's
    # CMD is a bare `node`, which npm never sets it for. Read package.json here
    # instead -- kamal runs from `frontend/`, so this is the same file the image
    # was built from. String scan rather than JSON.parse: the ERB binding is
    # Kamal's, and a missing constant here would abort the deploy at config
    # load. Kamal renders this at deploy time, so it cannot drift from the tag.
    OTEL_SERVICE_VERSION: <%= File.read("package.json")[/"version":\s*"([^"]+)"/, 1] %>

    # Grafana Faro browser RUM. o.nadeshiko.co is routed by kamal-proxy to the
    # host Alloy's Faro receiver (:4329, /collect); its CORS already allows
    # nadeshiko.co + dev.nadeshiko.co. Replaces the old otelcol-browser sidecar.
    NUXT_PUBLIC_FARO_URL: "https://o.nadeshiko.co/collect"

# The otelcol-browser accessory was removed: browser RUM now goes straight to
# the host Alloy Faro receiver. Server-side (SSR) telemetry still uses
# OTEL_EXPORTER_OTLP_ENDPOINT → host.docker.internal:4328 (also Alloy).
#
# After the first deploy, point kamal-proxy at the Faro receiver:
#   ssh nadeshiko "docker exec kamal-proxy kamal-proxy deploy \
#     nadeshiko-frontend-prod-faro \
#     --target 172.18.0.1:4329 --host o.nadeshiko.co --tls \
#     --health-check-port 12345 --health-check-path /-/ready"
