version: 2
updates:
  # One npm workspace rooted at the repository root: a single entry covers every
  # workspace, because they share the root package-lock.json.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
