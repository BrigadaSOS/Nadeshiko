name: "Kamal deploy setup"
description: "Join the Tailscale network, configure SSH to the deploy host, and install Ruby + Kamal."

inputs:
  tailscale-oauth-client-id:
    description: "Tailscale OAuth client id"
    required: true
  tailscale-oauth-secret:
    description: "Tailscale OAuth client secret"
    required: true
  host:
    description: "SSH host alias reachable over Tailscale"
    required: false
    default: nadeshiko
  ssh-user:
    description: "Remote user for raw ssh invocations (Kamal itself uses ssh.user from deploy.yml)"
    required: false
    default: docker
  ruby-version:
    description: "Ruby version used to run Kamal"
    required: false
    default: '3.4'
  kamal-version:
    description: "Exact Kamal gem version to install"
    required: false
    default: '2.12.0'
  known-hosts-file:
    description: "Repo-relative file holding the deploy host's pinned SSH public keys"
    required: false
    default: .github/known_hosts

runs:
  using: composite
  steps:
    # `ping:` is deliberately NOT set. It is a readiness probe, not the thing we
    # need, and as a gate it is strictly worse than the SSH check below: it
    # retries for three minutes and then reports "❌ Ping host <h> did not
    # respond", which is the same message whether the host is down, the grant is
    # missing, the node never got its tag, or ICMP simply is not the right probe.
    # It cost this repo eight days of red deploys saying nothing more than that.
    #
    # SSH is what Kamal actually uses, it is pinned by .github/known_hosts, and
    # it fails in seconds with a real error. So connectivity is verified below,
    # against the protocol that has to work, rather than one that only correlates.
    - name: Connect to Tailscale
      uses: tailscale/github-action@v4
      with:
        oauth-client-id: ${{ inputs.tailscale-oauth-client-id }}
        oauth-secret: ${{ inputs.tailscale-oauth-secret }}
        tags: tag:ci

    - name: Configure SSH over Tailscale
      shell: bash
      env:
        SSH_HOST: ${{ inputs.host }}
        SSH_USER: ${{ inputs.ssh-user }}
        KNOWN_HOSTS_FILE: ${{ inputs.known-hosts-file }}
      run: |
        set -euo pipefail
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        touch ~/.ssh/known_hosts

        # Pinned keys live in the repo so a hijacked Tailscale name cannot hand
        # a runner its own host key. Only fall back to trust-on-first-use when
        # the pin file has no entry for this host, and say so loudly: a silent
        # fallback would look identical to real pinning in the logs. Entries must
        # be unhashed (plain `ssh-keyscan`, not `-H`) for this check to see them.
        strict=no
        pin_file="${GITHUB_WORKSPACE}/${KNOWN_HOSTS_FILE}"
        if [ -f "$pin_file" ] && grep -Eq "^${SSH_HOST}[ ,]" "$pin_file"; then
          grep -Ev '^[[:space:]]*(#|$)' "$pin_file" >> ~/.ssh/known_hosts
          strict=yes
          echo "Pinned SSH host keys for ${SSH_HOST} from ${KNOWN_HOSTS_FILE}."
        else
          echo "::warning title=Unpinned SSH host key::${KNOWN_HOSTS_FILE} has no entry for ${SSH_HOST}; falling back to trust-on-first-use. Run 'ssh-keyscan ${SSH_HOST}' from a trusted machine and commit the output."
          ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
        fi

        cat >> ~/.ssh/config <<EOF
        Host ${SSH_HOST}
          User ${SSH_USER}
          StrictHostKeyChecking ${strict}
          ProxyCommand tailscale nc %h %p
        EOF
        chmod 600 ~/.ssh/config ~/.ssh/known_hosts

    # Readiness gate. Gates on SSH rather than the Tailscale action's `ping:`
    # because SSH is what Kamal actually uses, so a pass here means the deploy
    # can proceed rather than merely correlating with it.
    #
    # Quiet on success; the diagnostics run only if all attempts fail. They are
    # there because the failure that cost this repo eight days of red deploys
    # was invisible without them: the runner was authenticating into a different
    # tailnet than the host, so it was tagged correctly and reported a healthy
    # `tailscale up` while resolving the host to a stale, offline node record.
    # The runner's own tailnet name and whether the host is in its netmap are
    # what separate that from a genuinely down host.
    - name: Verify SSH reachability
      shell: bash
      env:
        SSH_HOST: ${{ inputs.host }}
      run: |
        set -uo pipefail
        for attempt in 1 2 3; do
          if ssh -o ConnectTimeout=15 -o BatchMode=yes "${SSH_HOST}" true 2>/dev/null; then
            exit 0
          fi
          sleep 10
        done

        echo "::group::Tailnet diagnostics"
        echo "--- this runner's tailnet identity (check the tailnet name, not just the tags) ---"
        tailscale status --peers=false --json \
          | python3 -c 'import json,sys; s=json.load(sys.stdin)["Self"]; print("self:", s.get("DNSName"), "tags:", s.get("Tags"))' \
          || echo "could not read local tailscale status"
        echo "--- ${SSH_HOST} as this runner sees it ---"
        tailscale status | grep -E "(^|\s)${SSH_HOST}(\s|$|\.)" \
          || echo "${SSH_HOST} is absent from this runner's netmap."
        echo "::endgroup::"
        echo "::error title=SSH unreachable::Could not SSH to ${SSH_HOST} over Tailscale. If the host shows as offline or on a different tailnet above, the TS_OAUTH_* secrets point at the wrong tailnet."
        exit 1

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ inputs.ruby-version }}

    - name: Install Kamal
      shell: bash
      env:
        KAMAL_VERSION: ${{ inputs.kamal-version }}
      run: gem install kamal -v "${KAMAL_VERSION}"
