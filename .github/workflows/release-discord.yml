name: "[Prod] Release Discord"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      backend: false
      frontend: false
      seed_worker: false

  deploy-discord:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The bot container is independent of the app services, so it gets its own
    # group. Sharing the host group would let a burst of pushes to main cancel a
    # queued discord deploy that nothing would re-trigger.
    concurrency:
      group: nadeshiko-discord-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-nadeshiko-prod
          aws-region: eu-north-1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push discord image
        uses: docker/build-push-action@v7
        with:
          # Root context: every image installs from the workspace lockfile, so the
          # build needs the root package.json/package-lock.json and the sibling
          # workspace manifests. See .dockerignore.
          context: .
          file: discord/Dockerfile
          push: true
          tags: |
            ghcr.io/brigadasos/nadeshiko-discord-prod:${{ github.sha }}
            ghcr.io/brigadasos/nadeshiko-discord-prod:latest
          labels: |
            service=nadeshiko-discord-prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Tailscale, SSH and Kamal
        uses: ./.github/actions/kamal-deploy-setup
        with:
          tailscale-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Deploy discord to prod
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd discord
          kamal deploy -d prod --skip-push

  # No-ops when DISCORD_DEPLOY_WEBHOOK is unset.
  notify-failure:
    needs: [checks, deploy-discord]
    if: failure()
    uses: ./.github/workflows/notify-deploy-failure.yml
    secrets: inherit
    with:
      environment: prod
      failed-jobs: ${{ toJSON(needs) }}
