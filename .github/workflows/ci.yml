name: CI

on:
  pull_request:
    # `production` carries hotfixes straight to a prod tag without ever passing
    # through main, so it needs the same gate main gets.
    branches: [main, production]

permissions:
  contents: read
  packages: read

env:
  NODE_VERSION: '24'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      discord: ${{ steps.filter.outputs.discord }}
      openapi: ${{ steps.filter.outputs.openapi }}
      seed_worker: ${{ steps.filter.outputs.seed_worker }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            discord:
              - 'discord/**'
            openapi:
              - 'backend/docs/openapi/**'
              - 'backend/redocly.yaml'
              # The job's own definition. Two separate bugs in it went unnoticed
              # for months because nothing exercised it until a PR happened to
              # touch the spec; editing the workflow now runs it.
              - '.github/workflows/ci.yml'
            seed_worker:
              - 'infra/seed-worker/**'

  checks:
    needs: changes
    uses: ./.github/workflows/checks.yml
    with:
      backend: ${{ needs.changes.outputs.backend == 'true' }}
      frontend: ${{ needs.changes.outputs.frontend == 'true' }}
      discord: ${{ needs.changes.outputs.discord == 'true' }}
      seed_worker: ${{ needs.changes.outputs.seed_worker == 'true' }}

  openapi:
    needs: changes
    if: needs.changes.outputs.openapi == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          path: head

      - name: Checkout PR base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          # This job checks out into head/ and base/, so the workspace root holds
          # no package-lock.json and setup-node's npm cache fails the whole job
          # with "Dependencies lock file is not found". Every other job in this
          # file checks out to the root, which is why only this one breaks -- and
          # it only runs when a PR touches the spec, so it stayed hidden until
          # one did.
          cache-dependency-path: head/package-lock.json

      # Installed once in the head checkout; the base checkout only needs its
      # spec bundled, which the head's redocly can do.
      - name: Install dependencies
        run: npm ci
        working-directory: head

      - name: Bundle base OpenAPI specs
        run: |
          set -euo pipefail
          # @redocly/cli is a devDependency of the backend workspace, and npm
          # DOES hoist it to the checkout root -- `node_modules/.bin/redocly`,
          # with the package at `node_modules/@redocly/cli`. Nothing is installed
          # under `backend/node_modules` at all.
          #
          # This is the second wrong guess at this path. The previous comment
          # asserted the opposite, confidently, and the step went on failing with
          # exit 127 -- because the job only runs when a PR touches the spec, so
          # nothing exercised the "fix". Verified against an actual install this
          # time rather than reasoned about: `ls node_modules/.bin/redocly`.
          REDOCLY="${GITHUB_WORKSPACE}/head/node_modules/.bin/redocly"
          cd "${GITHUB_WORKSPACE}/base/backend"
          "$REDOCLY" bundle public -o docs/generated/openapi-public.yaml --remove-unused-components
          "$REDOCLY" bundle main -o docs/generated/openapi.yaml --remove-unused-components

      - name: Bundle head OpenAPI specs
        run: |
          set -euo pipefail
          REDOCLY="${GITHUB_WORKSPACE}/head/node_modules/.bin/redocly"
          cd "${GITHUB_WORKSPACE}/head/backend"
          "$REDOCLY" bundle public -o docs/generated/openapi-public.yaml --remove-unused-components
          "$REDOCLY" bundle main -o docs/generated/openapi.yaml --remove-unused-components

      # `review: false` on every oasdiff step below. It is a v0.1 addition that
      # DEFAULTS TO TRUE, so taking the upgrade without it silently turns these
      # three steps into PR commenters -- the job would start posting reviews it
      # has never posted before. The step summary and the job status are how this
      # repo surfaces spec changes; keep it that way, and drop these lines only
      # deliberately.
      - name: Check public API breaking changes
        uses: oasdiff/oasdiff-action/breaking@v0.1.12
        with:
          base: base/backend/docs/generated/openapi-public.yaml
          revision: head/backend/docs/generated/openapi-public.yaml
          fail-on: ERR
          review: false

      # Warn-only: the internal spec is consumed by first-party clients (frontend,
      # discord, SDKs) that ship alongside the backend, so breaking it is allowed
      # but should be visible in review.
      - name: Check internal API breaking changes
        continue-on-error: true
        uses: oasdiff/oasdiff-action/breaking@v0.1.12
        with:
          base: base/backend/docs/generated/openapi.yaml
          revision: head/backend/docs/generated/openapi.yaml
          fail-on: ERR
          review: false

      - name: Generate public API changelog
        uses: oasdiff/oasdiff-action/changelog@v0.1.12
        with:
          base: base/backend/docs/generated/openapi-public.yaml
          revision: head/backend/docs/generated/openapi-public.yaml
          format: markdown
          output-to-file: head/backend/docs/generated/openapi-changelog.md
          review: false

      - name: Publish OpenAPI changelog summary
        run: cat head/backend/docs/generated/openapi-changelog.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload OpenAPI changelog artifact
        uses: actions/upload-artifact@v7
        with:
          name: openapi-changelog
          path: head/backend/docs/generated/openapi-changelog.md
          if-no-files-found: error
