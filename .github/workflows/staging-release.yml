name: "[Stg] Release"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_backend:
        description: 'Force backend deployment'
        required: false
        default: 'false'
        type: boolean
      force_frontend:
        description: 'Force frontend deployment'
        required: false
        default: 'false'
        type: boolean
permissions:
  actions: read
  contents: read
  packages: write
  id-token: write

env:
  NODE_VERSION: '24'

# Keep the deployed staging revision stable until its E2E suite finishes. Job-
# level deploy locks alone release as soon as Kamal finishes, which allowed the
# next workflow to replace staging while the previous commit was still under
# test. A queued run may wait; it must not invalidate the evidence prod trusts.
concurrency:
  group: nadeshiko-staging-release
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      openapi: ${{ steps.filter.outputs.openapi }}
      elasticsearch: ${{ steps.filter.outputs.elasticsearch }}
    steps:
      - uses: actions/checkout@v7

      # A normal push diff only covers the immediately preceding commit. If
      # that commit's release failed before deploy, its component changes would
      # otherwise be forgotten by the next push. Diff from the last commit that
      # actually passed staging E2E so every undeployed change is carried
      # forward until staging has verified it.
      - name: Find last verified staging revision
        if: github.event_name == 'push'
        id: verified-base
        uses: actions/github-script@v9
        with:
          script: |
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'staging-release.yml',
                branch: context.ref.replace('refs/heads/', ''),
                status: 'completed',
                per_page: 100,
              },
            );

            for (const run of runs) {
              if (run.id === context.runId || run.conclusion !== 'success') continue;

              const jobs = await github.paginate(
                github.rest.actions.listJobsForWorkflowRun,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                  per_page: 100,
                },
              );

              if (jobs.some((job) => job.name === 'e2e' && job.conclusion === 'success')) {
                core.setOutput('sha', run.head_sha);
                return;
              }
            }

            // This is only expected for the first gated release. Keeping the
            // push's normal base is safer than blocking that initial deploy.
            core.setOutput('sha', context.payload.before);

      - uses: dorny/paths-filter@v4
        if: github.event_name == 'push'
        id: filter
        with:
          base: ${{ steps.verified-base.outputs.sha }}
          filters: |
            # The Docker builds consume the root workspace lockfile, shared
            # packages, setup action, and root build tooling. Include those in
            # both deploy filters so a shared-only change is actually deployed.
            backend:
              - 'backend/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'biome.shared.jsonc'
              - 'tsconfig*.json'
              - '.npmrc'
              - '.dockerignore'
              - 'scripts/**'
              - '.github/actions/setup-workspace/**'
              - '.github/workflows/checks.yml'
              - '.github/workflows/staging-release.yml'
            frontend:
              - 'frontend/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'biome.shared.jsonc'
              - 'tsconfig*.json'
              - '.npmrc'
              - '.dockerignore'
              - 'scripts/**'
              - '.github/actions/setup-workspace/**'
              - '.github/workflows/checks.yml'
              - '.github/workflows/staging-release.yml'
            openapi:
              - 'backend/docs/openapi/**'
              - 'backend/docs/generated/openapi-sdk.yaml'

  checks:
    uses: ./.github/workflows/checks.yml

  # An Elasticsearch-gated push skips deploy-backend, which on its own reads as a
  # green run. Fail the workflow instead so the skipped deploy is not missed.

  deploy-backend:
    needs: [changes, checks]
    if: >-
      always() &&
      needs.checks.result == 'success' &&
      ((github.event_name == 'push' &&
        (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')) ||
       inputs.force_backend == true)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Serialized against every other backend mutation on the host. Staging and
    # production now share one Elasticsearch server, so a staging deploy and a
    # production release must not reindex across each other.
    concurrency:
      group: nadeshiko-host-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-nadeshiko-staging
          aws-region: eu-north-1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          # Root context: every image installs from the workspace lockfile, so the
          # build needs the root package.json/package-lock.json and the sibling
          # workspace manifests. See .dockerignore.
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/brigadasos/nadeshiko-backend-stg:${{ github.sha }}
            ghcr.io/brigadasos/nadeshiko-backend-stg:latest
          labels: |
            service=nadeshiko-backend-stg
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Tailscale, SSH and Kamal
        uses: ./.github/actions/kamal-deploy-setup
        with:
          tailscale-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}

      # Checks the PRODUCTION container: staging shares it and keeps only its own
      # index (`nadedb_dev`). Still worth running before a staging deploy -- a
      # client-9 backend pointed at an absent or wrong-version server fails in
      # ways that read as application bugs.
      - name: Verify Elasticsearch 9 prerequisite
        run: |
          set -euo pipefail
          health=$(ssh nadeshiko "docker exec nadeshiko-backend-prod-elasticsearch bash -c 'curl --fail --silent --user \"elastic:\$ELASTICSEARCH_ADMIN_PASSWORD\" http://localhost:9200/_cluster/health'")
          grep -q '"timed_out":false' <<<"$health"
          grep -Eq '"status":"(yellow|green)"' <<<"$health"
          version=$(ssh nadeshiko 'docker exec nadeshiko-backend-prod-elasticsearch /usr/share/elasticsearch/bin/elasticsearch --version')
          grep -q 'Version: 9.4.1' <<<"$version"
          plugins=$(ssh nadeshiko 'docker exec nadeshiko-backend-prod-elasticsearch /usr/share/elasticsearch/bin/elasticsearch-plugin list')
          grep -qx analysis-icu <<<"$plugins"
          grep -qx analysis-sudachi <<<"$plugins"

      - name: Deploy backend to stg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd backend
          VERSION="$GITHUB_SHA" kamal deploy -d staging --skip-push

      # Boot applies migrations, but deliberately does not run deployment
      # seeds. Prepare the idempotent worker-account pool before the browser
      # suite tries to authenticate; this also rotates its shared SSM password.
      - name: Prepare staging E2E accounts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd backend
          kamal app exec -d staging --reuse 'npm run db:prepare'

      - name: Verify backend revision and dependencies
        run: |
          set -euo pipefail
          health=$(curl --fail --silent --show-error https://api-stg.nadeshiko.co/up)
          test "$(jq -r '.releaseSha' <<<"$health")" = "$GITHUB_SHA"
          test "$(jq -r '.database' <<<"$health")" = up
          test "$(jq -r '.elasticsearch' <<<"$health")" = up

          cd backend
          kamal app exec -d staging --reuse 'npm run db:verify'


  deploy-frontend:
    # Deliberately not ordered after deploy-backend: staging is for feedback, so
    # the frontend ships as soon as it is ready rather than queueing behind (or
    # being blocked by) a backend deploy. Production does enforce that ordering.
    needs: [changes, checks]
    if: >-
      (github.event_name == 'push' &&
       (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')) ||
      inputs.force_frontend == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Frontend deploys are Nuxt container swaps that touch neither Elasticsearch
    # nor Postgres, so they get their own group rather than queueing behind (and
    # competing for a pending slot with) the backend/ES group.
    concurrency:
      group: nadeshiko-frontend-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Capture assets from the currently deployed revision
        id: old-assets
        run: |
          set -euo pipefail
          html=$(curl --fail --silent --show-error --location https://stg.nadeshiko.co/en)
          assets=$(grep -oE '/_nuxt/[^" ]+\.(js|css)' <<<"$html" | sort -u | head -20)
          test -n "$assets" || { echo "::error::No deployed Nuxt assets found before release"; exit 1; }
          {
            echo 'assets<<NUXT_ASSETS'
            echo "$assets"
            echo 'NUXT_ASSETS'
          } >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-nadeshiko-staging
          aws-region: eu-north-1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          # Root context: every image installs from the workspace lockfile, so the
          # build needs the root package.json/package-lock.json and the sibling
          # workspace manifests. See .dockerignore.
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/brigadasos/nadeshiko-frontend-stg:${{ github.sha }}
            ghcr.io/brigadasos/nadeshiko-frontend-stg:latest
          labels: |
            service=nadeshiko-frontend-stg
          build-args: |
            NUXT_PUBLIC_ENVIRONMENT=development
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Tailscale, SSH and Kamal
        uses: ./.github/actions/kamal-deploy-setup
        with:
          tailscale-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Deploy frontend to stg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd frontend
          VERSION="$GITHUB_SHA" kamal deploy -d staging --skip-push

      - name: Verify frontend revision
        run: |
          set -euo pipefail
          health=$(curl --fail --silent --show-error https://stg.nadeshiko.co/up)
          test "$(jq -r '.releaseSha' <<<"$health")" = "$GITHUB_SHA"

      # A tab loaded just before the swap still references the previous build's
      # hashed chunks. Keep those URLs alive across the deploy so readers do not
      # get a blank page when they navigate or lazy-load after a release.
      - name: Verify previous revision assets remain available
        env:
          OLD_ASSETS: ${{ steps.old-assets.outputs.assets }}
        run: |
          set -euo pipefail
          while IFS= read -r asset; do
            test -z "$asset" || curl --fail --silent --show-error --output /dev/null "https://stg.nadeshiko.co${asset}"
          done <<<"$OLD_ASSETS"

  e2e:
    needs: [deploy-backend, deploy-frontend]
    if: always() && (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') && (needs.deploy-frontend.result == 'success' || needs.deploy-frontend.result == 'skipped') && (needs.deploy-backend.result == 'success' || needs.deploy-frontend.result == 'success')
    runs-on: ubuntu-latest
    # A cold npm install can consume five minutes by itself. The full Chromium,
    # mobile and cross-browser smoke suite has more than 300 tests, so leave
    # enough room for dependency setup and useful retries. The tests themselves
    # run four-way in parallel against isolated seeded accounts.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-nadeshiko-staging
          aws-region: eu-north-1

      - name: Fetch E2E secrets from AWS SSM
        run: |
          E2E_USER_PASSWORD=$(aws ssm get-parameter --name "/nadeshiko/staging/E2E_USER_PASSWORD" --with-decryption --query 'Parameter.Value' --output text)
          echo "::add-mask::${E2E_USER_PASSWORD}"
          echo "E2E_USER_PASSWORD=${E2E_USER_PASSWORD}" >> "$GITHUB_ENV"

          # Lets the suite past the per-IP HTML limiter. The whole run comes from
          # one runner address against a limiter that allows 60 renders a minute,
          # and ~140 tests do not fit -- so it 429d at whatever assertion was next
          # and the run reported a different unrelated failure each time. It was
          # masking the anonymous-access check in collections.spec.ts, which
          # expects a 302 and was being handed a 429.
          #
          E2E_RATE_LIMIT_BYPASS_SECRET=$(aws ssm get-parameter --name "/nadeshiko/staging/RATE_LIMIT_BYPASS_SECRET" --with-decryption --query 'Parameter.Value' --output text 2>/dev/null || echo "")
          test -n "${E2E_RATE_LIMIT_BYPASS_SECRET}" || { echo "::error::RATE_LIMIT_BYPASS_SECRET is required for staging E2E"; exit 1; }
          echo "::add-mask::${E2E_RATE_LIMIT_BYPASS_SECRET}"
          echo "E2E_RATE_LIMIT_BYPASS_SECRET=${E2E_RATE_LIMIT_BYPASS_SECRET}" >> "$GITHUB_ENV"

      # ONE setup-node, not two. There were two, and the second -- pinning
      # node-version to a literal '22' with no `cache` -- silently won, so the
      # suite ran on whatever '22' resolved to rather than on NODE_VERSION, and
      # the npm cache configured by the first was set up for a Node that was then
      # replaced. Deleting the second is what makes the pin above true.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # Split out from the install, and cached, because it was the larger half of
      # a 59s step and none of it changes between runs: Chromium is ~130MB
      # downloaded fresh every time for a browser pinned by the lockfile. Keyed on
      # the version Playwright itself reports, so a dependency bump invalidates it
      # automatically and a stale browser can never be paired with a new client.
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | sed 's/Version //')" >> "$GITHUB_OUTPUT"
        working-directory: frontend

      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-all-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install the Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: frontend

      # The cache holds the browser, not the apt packages it links against, and
      # those live outside any path a cache can carry. Cheap on a hit -- the
      # runner image already ships most of them -- but not free, and skipping it
      # would fail at launch rather than at install.
      - name: Install the Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit
        working-directory: frontend

      - name: Run E2E tests
        run: npx playwright test --config=e2e/playwright.config.ts
        working-directory: frontend
        env:
          E2E_BASE_URL: https://stg.nadeshiko.co
          E2E_EXPECTED_SHA: ${{ github.sha }}

      - name: Enforce E2E skip budget
        run: node e2e/check-junit-budget.mjs test-results/e2e-results.xml 11
        working-directory: frontend

      # Shirabe is an external dependency, so an outage there should be loud in
      # the release report without preventing an otherwise healthy Nadeshiko
      # revision from reaching staging.
      - name: Probe live Shirabe lookup (advisory)
        continue-on-error: true
        run: |
          set -euo pipefail
          result=$(curl --fail --silent --show-error 'https://stg.nadeshiko.co/api/shirabe/words/candidates/%E5%AD%A6%E6%A0%A1')
          test "$(jq '.candidates | length' <<<"$result")" -gt 0

      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-stg
          path: |
            frontend/playwright-report/
            frontend/test-results/e2e-results.xml
          retention-days: 14

  dispatch-sdk-python:
    needs: [changes, checks]
    if: needs.changes.outputs.openapi == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Generate OpenAPI spec
        run: |
          cd backend
          npm run docs:bundle
          test -f docs/generated/openapi.yaml

      - name: Dispatch Python SDK internal release
        env:
          GH_TOKEN: ${{ secrets.SDK_REPO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          gh api repos/BrigadaSOS/nadeshiko-sdk-python/dispatches \
            -f event_type='backend_release' \
            -f 'client_payload[release_channel]=internal' \
            -f "client_payload[backend_sha]=${GITHUB_SHA}"

  # No-ops when DISCORD_DEPLOY_WEBHOOK is unset.
  notify-failure:
    needs: [checks, deploy-backend, deploy-frontend, e2e, dispatch-sdk-python]
    if: failure()
    uses: ./.github/workflows/notify-deploy-failure.yml
    secrets: inherit
    with:
      environment: stg
      failed-jobs: ${{ toJSON(needs) }}
