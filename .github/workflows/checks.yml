name: Checks

# Reusable lint/typecheck/test suite. Called by CI for pull requests and by the
# release workflows so no deploy can run against code that has not been checked.
on:
  workflow_call:
    inputs:
      backend:
        description: "Run the backend checks"
        required: false
        default: true
        type: boolean
      frontend:
        description: "Run the frontend checks"
        required: false
        default: true
        type: boolean
      discord:
        description: "Run the discord bot checks"
        required: false
        default: true
        type: boolean
      seed_worker:
        description: "Run the seed worker checks"
        required: false
        default: true
        type: boolean
      sdk:
        description: "Run the SDK package checks"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: read

env:
  NODE_VERSION: '24'
  # Published by .github/workflows/elasticsearch-image.yml; keep both in sync.
  ELASTICSEARCH_IMAGE: ghcr.io/brigadasos/nadeshiko-elasticsearch:9.4.1-sudachi-3.6.0-dict-20260116

jobs:
  # Deliberately ungated. Every other job keys off a paths filter, but generated
  # code goes stale from editing a *generator* (backend/bin, the SDK's
  # generate.ts) as readily as from editing the spec, and the filter that covers
  # every input is the empty one. This job needs no database, no Elasticsearch
  # and no image build, so running it on every call is cheaper than the class of
  # bug it catches.
  codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Mirrors frontend/Dockerfile. Two problems compound here:
      #
      # `--ignore-scripts` because the frontend's postinstall is `nuxt prepare`,
      # which npm runs before the tree is complete -- and which needs the very
      # binding the next step installs, so a plain `npm ci` fails inside itself.
      #
      # Then the bindings: npm records a package's optional deps only for the
      # platform that resolved them (npm/cli#4828), so a lockfile generated on
      # macOS carries no Linux entry for the napi packages (oxc-parser,
      # rolldown, ...) and `npm ci` on this runner cannot produce one.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Linux native bindings
        run: node scripts/install-linux-native-bindings.mjs

      # Both generators are named. This step used to run only `sdk:codegen` and
      # inherit the backend half from a preceding `npm run typecheck --workspace
      # backend`, which happens to be `generate:api && typecheck:app` -- so
      # narrowing that script to `typecheck:app` would have silently reduced the
      # check to the SDK while it kept reporting a pass.
      - name: Regenerate
        run: |
          set -euo pipefail
          npm run generate:api --workspace backend
          npm run sdk:codegen

      - name: Check generated code is up to date
        run: |
          set -euo pipefail
          paths="backend/docs/generated backend/generated frontend/server/utils/generated packages/nadeshiko-sdk/generated"
          # shellcheck disable=SC2086
          git add --intent-to-add -- $paths
          # shellcheck disable=SC2086
          if ! git diff --exit-code -- $paths; then
            echo "::error::Generated code is stale. Run 'npm run generate:api --workspace backend' and 'npm run sdk:codegen', then commit the result."
            exit 1
          fi

  backend:
    if: inputs.backend
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nadeshiko_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      # CI-only bootstrap password for the built-in `elastic` superuser. The
      # application user is provisioned from it by `npm run test:setup`.
      ELASTICSEARCH_ADMIN_USER: elastic
      ELASTICSEARCH_ADMIN_PASSWORD: nadeshiko-ci-elastic

    steps:
      - uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start test Elasticsearch
        run: |
          set -euo pipefail
          docker pull "$ELASTICSEARCH_IMAGE"
          docker run --detach \
            --name nadeshiko-ci-elasticsearch \
            --publish 9200:9200 \
            --env discovery.type=single-node \
            --env xpack.security.enabled=true \
            --env xpack.security.enrollment.enabled=false \
            --env xpack.security.http.ssl.enabled=false \
            --env ELASTIC_PASSWORD="$ELASTICSEARCH_ADMIN_PASSWORD" \
            --env ES_JAVA_OPTS="-Xms512m -Xmx512m" \
            "$ELASTICSEARCH_IMAGE"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # One install at the repository root covers every workspace.
      # Mirrors frontend/Dockerfile. Two problems compound here:
      #
      # `--ignore-scripts` because the frontend's postinstall is `nuxt prepare`,
      # which npm runs before the tree is complete -- and which needs the very
      # binding the next step installs, so a plain `npm ci` fails inside itself.
      #
      # Then the bindings: npm records a package's optional deps only for the
      # platform that resolved them (npm/cli#4828), so a lockfile generated on
      # macOS carries no Linux entry for the napi packages (oxc-parser,
      # rolldown, ...) and `npm ci` on this runner cannot produce one.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Linux native bindings
        run: node scripts/install-linux-native-bindings.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          # The image installs the whole workspace, so the build context is the
          # repository root rather than backend/.
          context: .
          file: ./backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Lint
        run: npm run lint:code --workspace backend

      - name: Typecheck
        run: npm run typecheck --workspace backend

      - name: Wait for test Elasticsearch
        run: |
          set -euo pipefail
          # A secured node answers unauthenticated requests with 401 once the
          # HTTP security layer is up; 200 covers a security-off diagnostic run.
          # 90 attempts x 2s matches the 180s budget used by the deploy workflows.
          for attempt in $(seq 1 90); do
            http_status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:9200/_cluster/health || true)
            if [ "$http_status" = 401 ] || [ "$http_status" = 200 ]; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              docker logs --tail 200 nadeshiko-ci-elasticsearch
              exit 1
            fi
            sleep 2
          done

          for attempt in $(seq 1 90); do
            health=$(curl --fail --silent --user "elastic:${ELASTICSEARCH_ADMIN_PASSWORD}" http://localhost:9200/_cluster/health || true)
            if grep -q '"timed_out":false' <<<"$health" && grep -Eq '"status":"(yellow|green)"' <<<"$health"; then
              exit 0
            fi
            sleep 2
          done

          docker logs --tail 200 nadeshiko-ci-elasticsearch
          exit 1

      - name: Setup test database
        env:
          LOG_LEVEL: info
        run: npm run test:setup --workspace backend

      - name: Test
        run: npm run test --workspace backend

      - name: Stop test Elasticsearch
        if: always()
        run: docker rm --force nadeshiko-ci-elasticsearch || true

  frontend:
    if: inputs.frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Mirrors frontend/Dockerfile. Two problems compound here:
      #
      # `--ignore-scripts` because the frontend's postinstall is `nuxt prepare`,
      # which npm runs before the tree is complete -- and which needs the very
      # binding the next step installs, so a plain `npm ci` fails inside itself.
      #
      # Then the bindings: npm records a package's optional deps only for the
      # platform that resolved them (npm/cli#4828), so a lockfile generated on
      # macOS carries no Linux entry for the napi packages (oxc-parser,
      # rolldown, ...) and `npm ci` on this runner cannot produce one.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Linux native bindings
        run: node scripts/install-linux-native-bindings.mjs

      # `--ignore-scripts` above skipped the postinstall that normally does this.
      # vue-tsc reads Nuxt's generated types (auto-imports, components.d.ts, the
      # generated tsconfig), so without it the typecheck fails on every
      # auto-imported symbol rather than on anything real.
      - name: Prepare Nuxt types
        run: npx nuxi prepare
        working-directory: frontend

      - name: Lint
        run: npm run lint --workspace frontend

      - name: Typecheck
        run: npm run typecheck --workspace frontend

      - name: Test
        run: npm run test --workspace frontend

  discord:
    if: inputs.discord
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Mirrors frontend/Dockerfile. Two problems compound here:
      #
      # `--ignore-scripts` because the frontend's postinstall is `nuxt prepare`,
      # which npm runs before the tree is complete -- and which needs the very
      # binding the next step installs, so a plain `npm ci` fails inside itself.
      #
      # Then the bindings: npm records a package's optional deps only for the
      # platform that resolved them (npm/cli#4828), so a lockfile generated on
      # macOS carries no Linux entry for the napi packages (oxc-parser,
      # rolldown, ...) and `npm ci` on this runner cannot produce one.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Linux native bindings
        run: node scripts/install-linux-native-bindings.mjs

      - name: Lint
        run: npm run lint --workspace discord

      - name: Typecheck
        run: npm run typecheck --workspace discord

      - name: Test
        run: npm run test --workspace discord

  sdk:
    if: inputs.sdk
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Mirrors frontend/Dockerfile. Two problems compound here:
      #
      # `--ignore-scripts` because the frontend's postinstall is `nuxt prepare`,
      # which npm runs before the tree is complete -- and which needs the very
      # binding the next step installs, so a plain `npm ci` fails inside itself.
      #
      # Then the bindings: npm records a package's optional deps only for the
      # platform that resolved them (npm/cli#4828), so a lockfile generated on
      # macOS carries no Linux entry for the napi packages (oxc-parser,
      # rolldown, ...) and `npm ci` on this runner cannot produce one.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Linux native bindings
        run: node scripts/install-linux-native-bindings.mjs

      - name: Typecheck
        run: npm run typecheck --workspace @brigadasos/nadeshiko-sdk

      - name: Test
        run: npm run test --workspace @brigadasos/nadeshiko-sdk


  seed-worker:
    if: inputs.seed_worker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Mirrors frontend/Dockerfile. Two problems compound here:
      #
      # `--ignore-scripts` because the frontend's postinstall is `nuxt prepare`,
      # which npm runs before the tree is complete -- and which needs the very
      # binding the next step installs, so a plain `npm ci` fails inside itself.
      #
      # Then the bindings: npm records a package's optional deps only for the
      # platform that resolved them (npm/cli#4828), so a lockfile generated on
      # macOS carries no Linux entry for the napi packages (oxc-parser,
      # rolldown, ...) and `npm ci` on this runner cannot produce one.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Linux native bindings
        run: node scripts/install-linux-native-bindings.mjs

      - name: Typecheck
        run: npm run typecheck --workspace nadeshiko-seed-worker

      - name: Build Worker bundle
        run: npx wrangler deploy --dry-run
        working-directory: infra/seed-worker
