name: Checks

# Reusable lint/typecheck/test suite. Called by CI for pull requests and by the
# release workflows so no deploy can run against code that has not been checked.
on:
  workflow_call:
    inputs:
      ref:
        description: "Commit to check"
        required: false
        default: ''
        type: string
      backend:
        description: "Run the backend checks"
        required: false
        default: true
        type: boolean
      backend_image:
        description: "Build the backend Docker image as part of backend checks"
        required: false
        default: true
        type: boolean
      frontend:
        description: "Run the frontend checks"
        required: false
        default: true
        type: boolean
      discord:
        description: "Run the discord bot checks"
        required: false
        default: true
        type: boolean
      sdk:
        description: "Run the workspace package checks (packages/*)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: read

env:
  NODE_VERSION: '24'
  # Published by .github/workflows/elasticsearch-image.yml; keep both in sync.
  ELASTICSEARCH_IMAGE: ghcr.io/brigadasos/nadeshiko-elasticsearch:9.4.1-sudachi-3.6.0-dict-20260116

jobs:
  # Deliberately ungated. Every other job keys off a paths filter, but generated
  # code goes stale from editing a *generator* (backend/bin, the SDK's
  # generate.ts) as readily as from editing the spec, and the filter that covers
  # every input is the empty one. This job needs no database, no Elasticsearch
  # and no image build, so running it on every call is cheaper than the class of
  # bug it catches.
  codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Verify deploy configuration
        run: scripts/verify-deploy-config

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The SDK spec augments the bundled API spec with better-auth endpoints.
      # Regenerate that intermediate bundle too: otherwise `sdk:codegen` can
      # faithfully generate types from a stale committed SDK spec and pass.
      - name: Regenerate
        run: |
          set -euo pipefail
          npm run generate:api --workspace backend
          npm run generate:auth-spec --workspace backend
          npm run sdk:codegen

      - name: Check generated code is up to date
        run: |
          set -euo pipefail
          paths="backend/docs/generated backend/generated frontend/server/utils/generated packages/nadeshiko-sdk/generated"
          # shellcheck disable=SC2086
          git add --intent-to-add -- $paths
          # shellcheck disable=SC2086
          if ! git diff --exit-code -- $paths; then
            echo "::error::Generated code is stale. Run 'npm run generate:api --workspace backend', 'npm run generate:auth-spec --workspace backend', and 'npm run sdk:codegen', then commit the result."
            exit 1
          fi

  backend:
    if: inputs.backend
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nadeshiko_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      # CI-only bootstrap password for the built-in `elastic` superuser. The
      # application user is provisioned from it by `npm run test:setup`.
      ELASTICSEARCH_ADMIN_USER: elastic
      ELASTICSEARCH_ADMIN_PASSWORD: nadeshiko-ci-elastic

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start test Elasticsearch
        run: |
          set -euo pipefail
          docker pull "$ELASTICSEARCH_IMAGE"
          docker run --detach \
            --name nadeshiko-ci-elasticsearch \
            --publish 9200:9200 \
            --env discovery.type=single-node \
            --env xpack.security.enabled=true \
            --env xpack.security.enrollment.enabled=false \
            --env xpack.security.http.ssl.enabled=false \
            --env ELASTIC_PASSWORD="$ELASTICSEARCH_ADMIN_PASSWORD" \
            --env ES_JAVA_OPTS="-Xms512m -Xmx512m" \
            "$ELASTICSEARCH_IMAGE"

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The full `lint`, not `lint:code`: it is Biome plus `redocly lint` over
      # docs/openapi/openapi.yaml. Running only the Biome half here left the
      # spec linted on contributors' machines and nowhere else.
      - name: Lint
        run: npm run lint --workspace backend

      - name: Typecheck
        run: npm run typecheck --workspace backend

      - name: Wait for test Elasticsearch
        run: |
          set -euo pipefail
          # A secured node answers unauthenticated requests with 401 once the
          # HTTP security layer is up; 200 covers a security-off diagnostic run.
          # 90 attempts x 2s matches the 180s budget used by the deploy workflows.
          for attempt in $(seq 1 90); do
            http_status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:9200/_cluster/health || true)
            if [ "$http_status" = 401 ] || [ "$http_status" = 200 ]; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              docker logs --tail 200 nadeshiko-ci-elasticsearch
              exit 1
            fi
            sleep 2
          done

          for attempt in $(seq 1 90); do
            health=$(curl --fail --silent --user "elastic:${ELASTICSEARCH_ADMIN_PASSWORD}" http://localhost:9200/_cluster/health || true)
            if grep -q '"timed_out":false' <<<"$health" && grep -Eq '"status":"(yellow|green)"' <<<"$health"; then
              exit 0
            fi
            sleep 2
          done

          docker logs --tail 200 nadeshiko-ci-elasticsearch
          exit 1

      - name: Setup test database
        env:
          LOG_LEVEL: info
        run: npm run test:setup --workspace backend

      - name: Verify latest migration rollback and reapply
        env:
          LOG_LEVEL: info
        run: npm run test:migrations --workspace backend

      - name: Test
        run: npm run test:coverage --workspace backend

      - name: Stop test Elasticsearch
        if: always()
        run: docker rm --force nadeshiko-ci-elasticsearch || true

  # Building the deployable container validates a different boundary than the
  # Node test suite, but it does not depend on Postgres or Elasticsearch. Keep
  # it as a parallel job so a healthy Dockerfile does not add its full build
  # time to every backend PR's critical path.
  backend-image:
    if: inputs.backend && inputs.backend_image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  frontend:
    if: inputs.frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      # `--ignore-scripts` above skipped the postinstall that normally does this.
      # vue-tsc reads Nuxt's generated types (auto-imports, components.d.ts, the
      # generated tsconfig), so without it the typecheck fails on every
      # auto-imported symbol rather than on anything real.
      - name: Prepare Nuxt types
        run: npx nuxi prepare
        working-directory: frontend

      # Biome plus `lint:i18n`, the locale-parity check -- cheap, and the only
      # thing standing between three locales and silent drift: a key added to
      # en.json alone renders as its own dotted path on /es and /ja. It used to
      # be a step of its own here, which meant it ran in CI and nowhere else;
      # folding it into the workspace's own `lint` is what makes a contributor
      # running `npm run lint` see the same failure.
      - name: Lint
        run: npm run lint --workspace frontend

      - name: Typecheck
        run: npm run typecheck --workspace frontend

      - name: Test
        run: npm run test:coverage --workspace frontend

  discord:
    if: inputs.discord
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint
        run: npm run lint --workspace discord

      - name: Typecheck
        run: npm run typecheck --workspace discord

      - name: Test
        run: npm run test:coverage --workspace discord

  # Both workspace packages. Ungated in practice (the input defaults to true),
  # which is right: @brigadasos/nadeshiko-shared is imported by the backend and
  # the frontend at runtime, so it is never only a package's own problem.
  sdk:
    if: inputs.sdk
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Typecheck
        run: |
          set -euo pipefail
          npm run typecheck --workspace @brigadasos/nadeshiko-sdk
          npm run typecheck --workspace @brigadasos/nadeshiko-shared

      - name: Test
        run: |
          set -euo pipefail
          npm run test --workspace @brigadasos/nadeshiko-sdk
          npm run test --workspace @brigadasos/nadeshiko-shared

