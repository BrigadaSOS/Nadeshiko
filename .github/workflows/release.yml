name: "[Prod] Release"

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write

env:
  NODE_VERSION: '24'

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  # Gates the deploys rather than living beside them. The purge at the end of
  # `release-frontend` is not optional (see it for why), and a missing or
  # wrong-scoped token discovered there would strand prod on a new build behind
  # an hour of stale HTML -- or, if it only gated the frontend, leave the backend
  # deployed and the frontend not. Failing before anything ships costs a re-run.
  #
  # This proves the token is live and can see the zone. It cannot prove the Cache
  # Purge permission without purging, so if the purge ever fails on a token that
  # passed here, widen the token rather than this check.
  verify-purge-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Cloudflare purge credentials
        env:
          CLOUDFLARE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_PURGE_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ZONE_ID:-}" ]; then
            echo "::error::CLOUDFLARE_PURGE_TOKEN and CLOUDFLARE_ZONE_ID must be set," \
                 "with Zone -> Cache Purge on nadeshiko.co. See DEPLOYMENT.md," \
                 "'Purging HTML on deploy'."
            exit 1
          fi

          zone=$(curl -sS \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}" \
            -H "Authorization: Bearer ${CLOUDFLARE_PURGE_TOKEN}")

          if [ "$(echo "$zone" | jq -r '.success')" != "true" ]; then
            echo "::error::Cloudflare rejected the token or the zone id. Nothing" \
                 "has been deployed."
            echo "$zone" | jq -r '.errors // .' >&2
            exit 1
          fi

          echo "Cloudflare credentials OK for zone $(echo "$zone" | jq -r '.result.name')."

  release-backend:
    needs: [checks, verify-purge-credentials]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Runs the Elasticsearch migration write freeze, so it must not overlap the
    # staging backend deploy or the staging Elasticsearch canary boot.
    concurrency:
      group: nadeshiko-host-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-nadeshiko-prod
          aws-region: eu-north-1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Read triggering release tag
        id: get-tag
        run: |
          set -euo pipefail
          RELEASE_TAG=${GITHUB_REF_NAME:?tag ref is required}
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          VERSION="${RELEASE_TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ steps.get-tag.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semver tag: ${RELEASE_TAG}"
            exit 1
          fi
          # A release tag has to sit on a commit someone reviewed, not on an
          # arbitrary SHA. `main` is staging, so anything tagged there has run
          # the staging deploy and E2E. `production` is the hotfix lane: it
          # branches off the last prod tag precisely so a fix can ship without
          # dragging main's unreleased work with it, which means a hotfix commit
          # is NOT an ancestor of main at tag time -- it only merges back after.
          # Accepting just main would make that lane untaggable.
          #
          # Checked out at fetch-depth 0, so both remote-tracking refs are
          # already here; the fetch just guards against a stale one. `production`
          # is fetched separately and allowed to fail, so a repo that has not
          # cut the branch yet still releases off main.
          git fetch origin main
          git fetch origin production || true
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            && ! { git rev-parse --verify -q origin/production >/dev/null \
                   && git merge-base --is-ancestor "$GITHUB_SHA" origin/production; }; then
            echo "::error::${RELEASE_TAG} is not on main or production. Tag a" \
                 "commit that is on one of them; see DEPLOYMENT.md."
            exit 1
          fi
          npm run release:check-version "${VERSION}"

      - name: Generate OpenAPI specs
        run: |
          cd backend
          npm run docs:bundle
          test -f docs/generated/openapi.yaml
          npm run docs:bundle:public
          test -f docs/generated/openapi-public.yaml

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get-tag.outputs.tag }}
          name: ${{ steps.get-tag.outputs.tag }}
          prerelease: false
          generate_release_notes: true
          files: backend/docs/generated/openapi-public.yaml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          # Root context: every image installs from the workspace lockfile, so the
          # build needs the root package.json/package-lock.json and the sibling
          # workspace manifests. See .dockerignore.
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/brigadasos/nadeshiko-backend-prod:${{ github.sha }}
            ghcr.io/brigadasos/nadeshiko-backend-prod:latest
          labels: |
            service=nadeshiko-backend-prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Tailscale, SSH and Kamal
        uses: ./.github/actions/kamal-deploy-setup
        with:
          tailscale-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Deploy backend to prod
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Production has been on Elasticsearch 9.4.1 since v2.3.0, migrated
          # blue-green with the site serving throughout -- see
          # backend/docs/elasticsearch-9-blue-green.md. So this is a plain
          # deploy, and `scripts/migrate-elasticsearch-production.sh` is gone.
          #
          # That script was never able to run: every one of its 44 remote
          # commands used `sudo -n`, and Kamal connects as the `docker` user,
          # which is in the `docker` group and NOT in `sudo`. Only a `v*` tag
          # invoked it, so nothing exercised it until v2.3.0 -- which died on its
          # first remote command. Keeping a rewritten version around would mean
          # keeping an 8-to-9 migration path for a migration that has happened.

          cd backend
          VERSION="$GITHUB_SHA" kamal deploy -d prod --skip-push

  release-frontend:
    needs: release-backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: nadeshiko-frontend-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-nadeshiko-prod
          aws-region: eu-north-1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          # Root context: every image installs from the workspace lockfile, so the
          # build needs the root package.json/package-lock.json and the sibling
          # workspace manifests. See .dockerignore.
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/brigadasos/nadeshiko-frontend-prod:${{ github.sha }}
            ghcr.io/brigadasos/nadeshiko-frontend-prod:latest
          labels: |
            service=nadeshiko-frontend-prod
          build-args: |
            NUXT_PUBLIC_ENVIRONMENT=production
            POSTHOG_CLI_API_KEY=${{ secrets.POSTHOG_CLI_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Tailscale, SSH and Kamal
        uses: ./.github/actions/kamal-deploy-setup
        with:
          tailscale-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Deploy frontend to prod
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd frontend
          kamal deploy -d prod --skip-push

      # Anonymous sentence and search HTML is edge-cached for an hour
      # (`cloudflare-cache.tf` in brigadasos-infra, `edge_ttl: respect_origin`,
      # against `CDN-Cache-Control: public, max-age=3600` from
      # `frontend/server/utils/sharedCdnTtl.ts`). That HTML is NOT fingerprinted
      # and it names the digests of the build that rendered it, so across a
      # deploy it points at `/_nuxt/*.js` the new container no longer has.
      #
      # The reader's browser then throws `Failed to fetch dynamically imported
      # module` -- and `app/plugins/chunkReload.client.ts` CANNOT recover it,
      # because the reload it triggers re-requests the page and the edge hands
      # back the same stale HTML. It burns its two attempts and gives up. So
      # this purge is what makes that recovery path work at all.
      #
      # Purge-everything rather than by URL: sentence and search URLs are
      # unbounded, and purge by prefix/hostname/tag is Enterprise-only. It also
      # drops `/v1/media/*` and the fingerprinted assets, which is harmless --
      # they are immutable and simply refill from origin.
      #
      # SAFE ONLY BECAUSE THIS WORKFLOW IS TAG-TRIGGERED. Prod and staging share
      # one zone, so the same call from `staging-release.yml` (which runs on
      # every push to main) would throw away production's edge cache. Do not
      # copy this step there.
      #
      # After the deploy on purpose: purging first would just let the edge refill
      # from the old container while kamal is still swapping.
      - name: Purge the Cloudflare edge cache
        env:
          CLOUDFLARE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_PURGE_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ZONE_ID:-}" ]; then
            echo "::error::CLOUDFLARE_PURGE_TOKEN and CLOUDFLARE_ZONE_ID must be set." \
                 "The token needs the Zone -> Cache Purge permission on nadeshiko.co."
            exit 1
          fi

          response=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_PURGE_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')

          # Cloudflare answers 200 with `"success": false` for a token that lacks
          # the purge permission, so the exit code alone proves nothing.
          if [ "$(echo "$response" | jq -r '.success')" != "true" ]; then
            echo "::error::Edge cache purge failed. Prod is deployed but the edge" \
                 "may serve stale HTML for up to an hour -- purge by hand."
            echo "$response" | jq -r '.errors // .' >&2
            exit 1
          fi

          echo "Edge cache purged."

  e2e:
    needs: release-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-nadeshiko-prod
          aws-region: eu-north-1

      - name: Fetch E2E secrets from AWS SSM
        run: |
          E2E_USER_PASSWORD=$(aws ssm get-parameter --name "/nadeshiko/prod/E2E_USER_PASSWORD" --with-decryption --query 'Parameter.Value' --output text)
          echo "::add-mask::${E2E_USER_PASSWORD}"
          echo "E2E_USER_PASSWORD=${E2E_USER_PASSWORD}" >> "$GITHUB_ENV"

          # Sent as X-Nadeshiko-CI so Cloudflare's `skip_ci_e2e` rule skips the
          # remaining custom rules for this run. Needed since 2026-08-13, when a
          # managed challenge went on /:locale/sentence/ to fight a corpus
          # scraper: Playwright cannot solve one, so sentence.spec.ts and the
          # uuid redirect tests started failing against prod for a reason that
          # had nothing to do with the application.
          #
          # This is NOT the same secret as RATE_LIMIT_BYPASS_SECRET on staging.
          # That one is the origin's per-IP limiter; this one is Cloudflare,
          # before the request reaches the origin at all.
          #
          # Optional on purpose, matching the staging step: if the parameter is
          # absent the suite still runs and is challenged, rather than the job
          # failing on a missing secret and hiding why.
          E2E_CI_BYPASS_SECRET=$(aws ssm get-parameter --name "/nadeshiko/prod/CI_BYPASS_SECRET" --with-decryption --query 'Parameter.Value' --output text 2>/dev/null || echo "")
          if [ -n "${E2E_CI_BYPASS_SECRET}" ]; then
            echo "::add-mask::${E2E_CI_BYPASS_SECRET}"
            echo "E2E_CI_BYPASS_SECRET=${E2E_CI_BYPASS_SECRET}" >> "$GITHUB_ENV"
          else
            echo "note: no CI_BYPASS_SECRET in SSM; sentence-page tests will be challenged"
          fi

      # ONE setup-node, not two -- see the note on the same block in
      # staging-release.yml. The second one pinned a literal '22' with no cache
      # and silently won over NODE_VERSION.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # Cached for the reason spelled out in staging-release.yml: Chromium is
      # ~130MB, pinned by the lockfile, and was downloaded fresh on every run.
      # Keyed on the version Playwright reports, so a bump invalidates it by
      # itself.
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | sed 's/Version //')" >> "$GITHUB_OUTPUT"
        working-directory: frontend

      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install the Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Install the Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: frontend

      # SMOKE SUBSET, not the whole suite, and the reason is production's HTML
      # rate limiter: 20 renders per minute per IP, with no bypass by design
      # (see frontend/config/deploy.staging.yml, where the staging-only bypass
      # secret says so). One CI runner is one IP, so 152 tests cannot fit --
      # measured against prod, request 23 in a minute returns 429.
      #
      # It did not fail honestly either. The suite 429d at whatever assertion
      # came next, so every run blamed a different innocent test and prod E2E
      # had been red since 2026-08-10 without ever pointing at the cause.
      #
      # Staging runs all 152 against the same commit with the bypass, so this is
      # not lost coverage -- it is the same coverage, once. What runs here is
      # what can only break in production: real database, real Elasticsearch,
      # real R2/CDN media, real Cloudflare. See e2e/playwright.config.ts.
      - name: Run E2E smoke tests
        run: |
          cd frontend
          npx playwright test --config=e2e/playwright.config.ts
        env:
          E2E_BASE_URL: https://nadeshiko.co
          E2E_SMOKE: '1'

      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-prod
          path: frontend/playwright-report/
          retention-days: 14

  dispatch-sdk-ts:
    needs: release-backend
    runs-on: ubuntu-latest
    steps:
      # The TypeScript SDK is developed in this repo (packages/nadeshiko-sdk)
      # and consumed from there by the frontend and the bot. Publishing stays in
      # nadeshiko-sdk-ts: it regenerates from the spec at this release's commit
      # and publishes to npm, where its trusted publisher (OIDC, no token) is
      # bound to that repository. Nothing here needs to push to it.
      - name: Dispatch TypeScript SDK release
        env:
          GH_TOKEN: ${{ secrets.SDK_REPO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          gh api repos/BrigadaSOS/nadeshiko-sdk-ts/dispatches \
            -f event_type='backend_release' \
            -f 'client_payload[release_channel]=stable' \
            -f "client_payload[backend_sha]=${GITHUB_SHA}"

  dispatch-sdk-python:
    needs: release-backend
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Python SDK release
        env:
          GH_TOKEN: ${{ secrets.SDK_REPO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          gh api repos/BrigadaSOS/nadeshiko-sdk-python/dispatches \
            -f event_type='backend_release' \
            -f 'client_payload[release_channel]=stable' \
            -f "client_payload[backend_sha]=${GITHUB_SHA}"

  # A failed production release is the one thing nobody should have to notice by
  # checking the Actions tab. No-ops when DISCORD_DEPLOY_WEBHOOK is unset.
  notify-failure:
    needs:
      [
        checks,
        verify-purge-credentials,
        release-backend,
        release-frontend,
        e2e,
        dispatch-sdk-ts,
        dispatch-sdk-python,
      ]
    if: failure()
    uses: ./.github/workflows/notify-deploy-failure.yml
    secrets: inherit
    with:
      environment: prod
      failed-jobs: ${{ toJSON(needs) }}
