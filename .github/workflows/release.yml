name: "[Prod] Release"

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write

env:
  BUN_VERSION: '1.3.6'

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  release-backend:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Runs the Elasticsearch migration write freeze, so it must not overlap the
    # staging backend deploy or the staging Elasticsearch canary boot.
    concurrency:
      group: nadeshiko-host-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-nadeshiko-prod
          aws-region: eu-north-1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install backend dependencies
        run: cd backend && bun install --frozen-lockfile

      - name: Read triggering release tag
        id: get-tag
        run: |
          set -euo pipefail
          RELEASE_TAG=${GITHUB_REF_NAME:?tag ref is required}
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          VERSION="${RELEASE_TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ steps.get-tag.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semver tag: ${RELEASE_TAG}"
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          bun run release:check-version "${VERSION}"

      - name: Generate OpenAPI specs
        run: |
          cd backend
          bun run docs:bundle
          test -f docs/generated/openapi.yaml
          bun run docs:bundle:public
          test -f docs/generated/openapi-public.yaml

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get-tag.outputs.tag }}
          name: ${{ steps.get-tag.outputs.tag }}
          prerelease: false
          generate_release_notes: true
          files: backend/docs/generated/openapi-public.yaml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/brigadasos/nadeshiko-backend-prod:${{ github.sha }}
            ghcr.io/brigadasos/nadeshiko-backend-prod:latest
          labels: |
            service=nadeshiko-backend-prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Tailscale, SSH and Kamal
        uses: ./.github/actions/kamal-deploy-setup
        with:
          tailscale-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Migrate Elasticsearch and deploy backend to prod
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          component='ghcr.io/brigadasos/nadeshiko-elasticsearch:9.4.1-sudachi-3.6.0-dict-20260116'
          source_sha=$(git log --first-parent -1 --format=%H -- backend/docker/Dockerfile.elasticsearch)
          commit_tag="${component}-${source_sha}"
          docker pull "$component"
          docker pull "$commit_tag"
          component_digest=$(docker image inspect "$component" --format '{{index .RepoDigests 0}}')
          elasticsearch_image=$(docker image inspect "$commit_tag" --format '{{index .RepoDigests 0}}')
          test -n "$elasticsearch_image"
          test "$component_digest" = "$elasticsearch_image"

          backend_tag="ghcr.io/brigadasos/nadeshiko-backend-prod:${GITHUB_SHA}"
          docker pull "$backend_tag"
          backend_image=$(docker image inspect "$backend_tag" --format '{{index .RepoDigests 0}}')
          test -n "$backend_image"

          admin_user=$(aws ssm get-parameter --name "/nadeshiko/prod/ELASTICSEARCH_ADMIN_USER" --with-decryption --query 'Parameter.Value' --output text)
          admin_password=$(aws ssm get-parameter --name "/nadeshiko/prod/ELASTICSEARCH_ADMIN_PASSWORD" --with-decryption --query 'Parameter.Value' --output text)
          test -n "$admin_user"
          test -n "$admin_password"
          if [[ "$admin_user" == *$'\n'* || "$admin_user" == *$'\r'* || "$admin_password" == *$'\n'* || "$admin_password" == *$'\r'* ]]; then
            echo 'Elasticsearch administrative values must not contain CR/LF characters.' >&2
            exit 1
          fi
          echo "::add-mask::${admin_user}"
          echo "::add-mask::${admin_password}"
          admin_env=$(mktemp)
          trap 'rm -f "$admin_env"' EXIT
          umask 077
          printf 'ELASTICSEARCH_ADMIN_USER=%s\nELASTICSEARCH_ADMIN_PASSWORD=%s\n' \
            "$admin_user" "$admin_password" >"$admin_env"

          cd backend
          bash scripts/migrate-elasticsearch-production.sh "$elasticsearch_image" "$backend_image" "$GITHUB_SHA" "$admin_env"

  release-frontend:
    needs: release-backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: nadeshiko-frontend-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-nadeshiko-prod
          aws-region: eu-north-1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/brigadasos/nadeshiko-frontend-prod:${{ github.sha }}
            ghcr.io/brigadasos/nadeshiko-frontend-prod:latest
          labels: |
            service=nadeshiko-frontend-prod
          build-args: |
            NUXT_PUBLIC_ENVIRONMENT=production
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Tailscale, SSH and Kamal
        uses: ./.github/actions/kamal-deploy-setup
        with:
          tailscale-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Deploy frontend to prod
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd frontend
          kamal deploy -d prod --skip-push

  e2e:
    needs: release-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-nadeshiko-prod
          aws-region: eu-north-1

      - name: Fetch E2E secrets from AWS SSM
        run: |
          E2E_USER_PASSWORD=$(aws ssm get-parameter --name "/nadeshiko/prod/E2E_USER_PASSWORD" --with-decryption --query 'Parameter.Value' --output text)
          echo "::add-mask::${E2E_USER_PASSWORD}"
          echo "E2E_USER_PASSWORD=${E2E_USER_PASSWORD}" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies and Playwright
        run: |
          cd frontend
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: |
          cd frontend
          npx playwright test --config=e2e/playwright.config.ts
        env:
          E2E_BASE_URL: https://nadeshiko.co

      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-prod
          path: frontend/playwright-report/
          retention-days: 14

  dispatch-sdk-ts:
    needs: release-backend
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch TypeScript SDK release
        env:
          GH_TOKEN: ${{ secrets.SDK_REPO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          gh api repos/BrigadaSOS/nadeshiko-sdk-ts/dispatches \
            -f event_type='backend_release' \
            -f 'client_payload[release_channel]=stable' \
            -f "client_payload[backend_sha]=${GITHUB_SHA}"

  dispatch-sdk-python:
    needs: release-backend
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Python SDK release
        env:
          GH_TOKEN: ${{ secrets.SDK_REPO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          gh api repos/BrigadaSOS/nadeshiko-sdk-python/dispatches \
            -f event_type='backend_release' \
            -f 'client_payload[release_channel]=stable' \
            -f "client_payload[backend_sha]=${GITHUB_SHA}"

  # A failed production release is the one thing nobody should have to notice by
  # checking the Actions tab. No-ops when DISCORD_DEPLOY_WEBHOOK is unset.
  notify-failure:
    needs: [checks, release-backend, release-frontend, e2e, dispatch-sdk-ts, dispatch-sdk-python]
    if: failure()
    uses: ./.github/workflows/notify-deploy-failure.yml
    secrets: inherit
    with:
      environment: prod
      failed-jobs: ${{ toJSON(needs) }}
