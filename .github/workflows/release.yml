name: "[Prod] Release"

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write

env:
  NODE_VERSION: '24'

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  release-backend:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Runs the Elasticsearch migration write freeze, so it must not overlap the
    # staging backend deploy or the staging Elasticsearch canary boot.
    concurrency:
      group: nadeshiko-host-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-nadeshiko-prod
          aws-region: eu-north-1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Read triggering release tag
        id: get-tag
        run: |
          set -euo pipefail
          RELEASE_TAG=${GITHUB_REF_NAME:?tag ref is required}
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          VERSION="${RELEASE_TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ steps.get-tag.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semver tag: ${RELEASE_TAG}"
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          npm run release:check-version "${VERSION}"

      - name: Generate OpenAPI specs
        run: |
          cd backend
          npm run docs:bundle
          test -f docs/generated/openapi.yaml
          npm run docs:bundle:public
          test -f docs/generated/openapi-public.yaml

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get-tag.outputs.tag }}
          name: ${{ steps.get-tag.outputs.tag }}
          prerelease: false
          generate_release_notes: true
          files: backend/docs/generated/openapi-public.yaml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          # Root context: every image installs from the workspace lockfile, so the
          # build needs the root package.json/package-lock.json and the sibling
          # workspace manifests. See .dockerignore.
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/brigadasos/nadeshiko-backend-prod:${{ github.sha }}
            ghcr.io/brigadasos/nadeshiko-backend-prod:latest
          labels: |
            service=nadeshiko-backend-prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Tailscale, SSH and Kamal
        uses: ./.github/actions/kamal-deploy-setup
        with:
          tailscale-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Deploy backend to prod
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Production has been on Elasticsearch 9.4.1 since v2.3.0, migrated
          # blue-green with the site serving throughout -- see
          # backend/docs/elasticsearch-9-blue-green.md. So this is a plain
          # deploy, and `scripts/migrate-elasticsearch-production.sh` is gone.
          #
          # That script was never able to run: every one of its 44 remote
          # commands used `sudo -n`, and Kamal connects as the `docker` user,
          # which is in the `docker` group and NOT in `sudo`. Only a `v*` tag
          # invoked it, so nothing exercised it until v2.3.0 -- which died on its
          # first remote command. Keeping a rewritten version around would mean
          # keeping an 8-to-9 migration path for a migration that has happened.

          cd backend
          VERSION="$GITHUB_SHA" kamal deploy -d prod --skip-push

  release-frontend:
    needs: release-backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: nadeshiko-frontend-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-nadeshiko-prod
          aws-region: eu-north-1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          # Root context: every image installs from the workspace lockfile, so the
          # build needs the root package.json/package-lock.json and the sibling
          # workspace manifests. See .dockerignore.
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/brigadasos/nadeshiko-frontend-prod:${{ github.sha }}
            ghcr.io/brigadasos/nadeshiko-frontend-prod:latest
          labels: |
            service=nadeshiko-frontend-prod
          build-args: |
            NUXT_PUBLIC_ENVIRONMENT=production
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Tailscale, SSH and Kamal
        uses: ./.github/actions/kamal-deploy-setup
        with:
          tailscale-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Deploy frontend to prod
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd frontend
          kamal deploy -d prod --skip-push

  e2e:
    needs: release-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-nadeshiko-prod
          aws-region: eu-north-1

      - name: Fetch E2E secrets from AWS SSM
        run: |
          E2E_USER_PASSWORD=$(aws ssm get-parameter --name "/nadeshiko/prod/E2E_USER_PASSWORD" --with-decryption --query 'Parameter.Value' --output text)
          echo "::add-mask::${E2E_USER_PASSWORD}"
          echo "E2E_USER_PASSWORD=${E2E_USER_PASSWORD}" >> "$GITHUB_ENV"

          # Sent as X-Nadeshiko-CI so Cloudflare's `skip_ci_e2e` rule skips the
          # remaining custom rules for this run. Needed since 2026-08-13, when a
          # managed challenge went on /:locale/sentence/ to fight a corpus
          # scraper: Playwright cannot solve one, so sentence.spec.ts and the
          # uuid redirect tests started failing against prod for a reason that
          # had nothing to do with the application.
          #
          # This is NOT the same secret as RATE_LIMIT_BYPASS_SECRET on staging.
          # That one is the origin's per-IP limiter; this one is Cloudflare,
          # before the request reaches the origin at all.
          #
          # Optional on purpose, matching the staging step: if the parameter is
          # absent the suite still runs and is challenged, rather than the job
          # failing on a missing secret and hiding why.
          E2E_CI_BYPASS_SECRET=$(aws ssm get-parameter --name "/nadeshiko/prod/CI_BYPASS_SECRET" --with-decryption --query 'Parameter.Value' --output text 2>/dev/null || echo "")
          if [ -n "${E2E_CI_BYPASS_SECRET}" ]; then
            echo "::add-mask::${E2E_CI_BYPASS_SECRET}"
            echo "E2E_CI_BYPASS_SECRET=${E2E_CI_BYPASS_SECRET}" >> "$GITHUB_ENV"
          else
            echo "note: no CI_BYPASS_SECRET in SSM; sentence-page tests will be challenged"
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies and Playwright
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: |
          cd frontend
          npx playwright test --config=e2e/playwright.config.ts
        env:
          E2E_BASE_URL: https://nadeshiko.co

      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-prod
          path: frontend/playwright-report/
          retention-days: 14

  dispatch-sdk-ts:
    needs: release-backend
    runs-on: ubuntu-latest
    steps:
      # The TypeScript SDK is developed in this repo (packages/nadeshiko-sdk)
      # and consumed from there by the frontend and the bot. Publishing stays in
      # nadeshiko-sdk-ts: it regenerates from the spec at this release's commit
      # and publishes to npm, where its trusted publisher (OIDC, no token) is
      # bound to that repository. Nothing here needs to push to it.
      - name: Dispatch TypeScript SDK release
        env:
          GH_TOKEN: ${{ secrets.SDK_REPO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          gh api repos/BrigadaSOS/nadeshiko-sdk-ts/dispatches \
            -f event_type='backend_release' \
            -f 'client_payload[release_channel]=stable' \
            -f "client_payload[backend_sha]=${GITHUB_SHA}"

  dispatch-sdk-python:
    needs: release-backend
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Python SDK release
        env:
          GH_TOKEN: ${{ secrets.SDK_REPO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          gh api repos/BrigadaSOS/nadeshiko-sdk-python/dispatches \
            -f event_type='backend_release' \
            -f 'client_payload[release_channel]=stable' \
            -f "client_payload[backend_sha]=${GITHUB_SHA}"

  # A failed production release is the one thing nobody should have to notice by
  # checking the Actions tab. No-ops when DISCORD_DEPLOY_WEBHOOK is unset.
  notify-failure:
    needs: [checks, release-backend, release-frontend, e2e, dispatch-sdk-ts, dispatch-sdk-python]
    if: failure()
    uses: ./.github/workflows/notify-deploy-failure.yml
    secrets: inherit
    with:
      environment: prod
      failed-jobs: ${{ toJSON(needs) }}
