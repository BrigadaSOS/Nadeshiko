SegmentRevision:
  type: object
  required:
    - id
    - revisionNumber
    - snapshot
    - actor
    - reportId
    - createdAt
  properties:
    id:
      type: integer
      description: Revision ID
    revisionNumber:
      type: integer
      description: Sequential revision number per segment
    snapshot:
      type: object
      additionalProperties: true
      description: |
        The segment's editable fields as they were *before* this revision's edit.
        Restoring a revision writes these values back.
    actor:
      type: string
      enum: [HUMAN, AGENT]
      description: |
        Whether a person or the moderation agent made the change. Derived from the
        credential at write time — a service API key is the agent.
    reportId:
      type: integer
      nullable: true
      description: The report this edit answered, when it answered one
    userName:
      type: string
      nullable: true
      description: Name of the account the change was made under
    createdAt:
      type: string
      format: date-time
      description: When the revision was created
