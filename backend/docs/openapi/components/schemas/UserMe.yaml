type: object
required:
  - user
  - quota
properties:
  user:
    type: object
    required:
      - username
      - createdAt
      - role
    properties:
      username:
        type: string
        minLength: 1
        description: The user's display name.
        example: tanaka_san
      createdAt:
        type: string
        format: date-time
        description: When the account was created.
        example: "2024-03-15T10:00:00.000Z"
      role:
        type: string
        minLength: 1
        description: The user's account tier or role.
        example: USER
  quota:
    type: object
    required:
      - used
      - limit
      - remaining
      - periodYyyymm
      - periodStart
      - periodEnd
      - tier
      - burst
    properties:
      used:
        type: integer
        minimum: 0
        description: Number of API requests used this month.
        example: 342
      limit:
        type: integer
        minimum: 0
        description: Maximum number of API requests allowed per month.
        example: 5000
      remaining:
        type: integer
        minimum: 0
        description: Number of API requests remaining this month.
        example: 4658
      periodYyyymm:
        type: integer
        minimum: 202001
        description: Current month in YYYYMM format.
        example: 202602
      periodStart:
        type: string
        format: date-time
        description: Start of the current month (UTC).
        example: "2026-02-01T00:00:00.000Z"
      periodEnd:
        type: string
        format: date-time
        description: End of the current month (UTC).
        example: "2026-02-28T23:59:59.999Z"
      tier:
        type: object
        nullable: true
        description: |
          The quota tier this account sits on. Null when the account is on none,
          or when an override is in force and the tier no longer describes the
          limit.
        required:
          - id
          - displayName
        properties:
          id:
            type: string
            example: plus
          displayName:
            type: string
            example: Plus
      burst:
        type: object
        description: |
          The OTHER limit. Separate from the monthly allowance and enforced per
          API key over a short window, so a caller can exhaust it with plenty of
          month left -- which is why both are surfaced together, and why the two
          429s carry an `X-RateLimit-Reason` telling them apart.
        required:
          - max
          - windowMs
        properties:
          max:
            type: integer
            description: Requests allowed per key within `windowMs`.
            example: 150
          windowMs:
            type: integer
            description: Length of the burst window, in milliseconds.
            example: 60000
