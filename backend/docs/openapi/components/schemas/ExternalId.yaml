type: object
description: External IDs for this media, keyed by source. Responses always carry every source as a key, with null for absent mappings. In requests `asin` may be omitted, so clients that predate it keep working.
required:
  - anilist
  - imdb
  - tvdb
  - tmdb
  - youtube
properties:
  anilist:
    type: string
    nullable: true
    minLength: 1
    description: AniList ID
    example: "21459"
  imdb:
    type: string
    nullable: true
    minLength: 1
    description: IMDB ID
    example: tt1234567
  tvdb:
    type: string
    nullable: true
    minLength: 1
    description: TVDB ID
    example: "12345"
  tmdb:
    type: string
    nullable: true
    minLength: 1
    description: TMDB ID
    example: "90955"
  youtube:
    type: string
    nullable: true
    minLength: 1
    description: YouTube channel ID
    example: UCauyM-A8JIJ9NQcw5_jF00Q
  asin:
    type: string
    nullable: true
    minLength: 1
    description: Audible ASIN (audiobooks)
    example: B07PPMBZHX
