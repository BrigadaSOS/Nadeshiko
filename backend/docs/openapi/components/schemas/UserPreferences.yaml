type: object
properties:
  mediaNameLanguage:
    type: string
    enum:
      - ENGLISH
      - JAPANESE
      - ROMAJI
    description: Preferred language for media names display
  contentRatingPreferences:
    type: object
    description: Per-category content rating display preferences
    properties:
      nsfw:
        type: string
        enum: [SHOW, BLUR, HIDE]
  translationVisibilityPreferences:
    type: object
    description: Per-language visibility mode for translations in search results, keyed by ISO 639-1 code (uppercase)
    properties:
      EN:
        type: string
        enum: [show, spoiler, hidden]
      ES:
        type: string
        enum: [show, spoiler, hidden]
  translationLanguages:
    type: array
    minItems: 1
    maxItems: 2
    uniqueItems: true
    description: >
      Translation languages the reader wants in dictionary content, in display
      order. This is the global preference; translationVisibilityPreferences is
      a search-surface override for showing, spoiling, or hiding a language.
    items:
      type: string
      enum: [EN, ES]
  wordPopup:
    type: object
    description: >
      How the word card behaves when a reader taps a word in a sentence. A group
      rather than a loose key so the settings that follow it have somewhere to
      live.
    properties:
      definitionSize:
        type: string
        enum: [SMALL, MEDIUM, LARGE]
        description: >
          How large the definitions themselves are printed. The card holds a
          reader's own monolingual dictionaries now, which is Japanese prose
          rather than a three-word English gloss, and a size that suited "to
          die; to pass away" is small for a paragraph of 大辞林. MEDIUM is the
          default; SMALL is what the card printed before this existed.
  searchHistory:
    type: object
    properties:
      enabled:
        type: boolean
        description: Whether activity tracking is enabled (default true)
  ankiProfiles:
    type: array
    items:
      type: object
      required: [id, name, serverAddress]
      properties:
        id:
          type: string
        name:
          type: string
        deck:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        fields:
          type: array
          items:
            type: object
            required: [key, value]
            properties:
              key:
                type: string
              value:
                type: string
        key:
          type: string
          nullable: true
        serverAddress:
          type: string
        openBrowserOnExport:
          type: boolean
          description: |
            Whether exporting a card brings Anki's card browser to the front.

            Absent means true, which is what it did before the setting existed.
            Undeclared until now: the settings page has offered the switch all
            along, but a profile saved with it off came back from the server
            without the field at all, so turning it off appeared to save and then
            did nothing.
  defaultSearchCategory:
    type: string
    enum: [ALL, ANIME, JDRAMA, YOUTUBE]
    description: |
      Category tab a search opens on when the URL names none. `ALL` -- the value
      assumed when unset -- searches every category the user still has visible.

      Spelled out as its own enum rather than a nullable `Category` so that
      "search everything" is a value the client can send, not a field it has to
      clear. It mirrors `Category` plus `ALL`.

      A value the user has since hidden (see `hiddenCategories`) is ignored and
      the search falls back to `ALL`. It is stored rather than rejected, so
      unhiding the category brings the choice back.
  hiddenCategories:
    type: array
    description: |
      Whole media categories hidden from search results by the user.

      An empty array means nothing is hidden. Hiding *every* category is rejected with
      `400`: `filters.category` reads an empty list as "no filter", so hiding the last
      one would silently show everything back instead of nothing.
    items:
      $ref: "./Category.yaml"
  hiddenMedia:
    type: array
    description: Media hidden from search results by the user
    items:
      type: object
      required: [mediaPublicId]
      properties:
        mediaPublicId:
          type: string
          description: Public ID of the hidden media
        nameEn:
          type: string
        nameJa:
          type: string
        nameRomaji:
          type: string
  favoriteMedia:
    type: array
    description: |
      Media the reader has starred. Starred titles sort to the top of the search
      media filter; they change the ORDER of that list, never its contents, so a
      starred title the current query does not match simply is not there.

      Capped at 100 entries, refused with `400` beyond that. The cap is not
      cosmetic: the whole preferences column is rewritten on every change (see
      `mutateUserPreferences`), so an unbounded list would make every unrelated
      preference write more expensive for the rest of the account's life.

      `favoritedAt` is declared here and written by the server, unlike
      `hiddenMedia`'s `hiddenAt` -- which the client invents and this schema has
      never described.
    items:
      type: object
      required: [mediaPublicId, favoritedAt]
      properties:
        mediaPublicId:
          type: string
          description: Public ID of the starred media
        nameEn:
          type: string
        nameJa:
          type: string
        nameRomaji:
          type: string
        favoritedAt:
          type: string
          format: date-time
          description: When the reader starred it, set by the server.
  familiarMedia:
    type: object
    description: |
      Whether to keep a monthly tally of which titles the reader studies, used to
      sort those titles up the search media filter.

      Deliberately NOT `searchHistory`: that preference governs the activity log
      (queries, timestamps, per-row deletion), this one governs an aggregate
      count per title per month. A reader can reasonably want the tally without
      the diary, so the two are stored apart, cleared apart, and expire apart.
      Existing readers who had `searchHistory` off were seeded to `false` here.
    properties:
      enabled:
        type: boolean
        description: Whether familiar-media tallying is enabled (default true)
