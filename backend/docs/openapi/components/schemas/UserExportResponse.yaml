type: object
description: User data export payload (identifier-oriented references)
required:
  - profile
  - preferences
  - activity
  - collections
  - reports
  - truncated
properties:
  truncated:
    type: object
    description: |
      Which sections were cut short. The export is assembled and returned as a single JSON
      body, so each section has a ceiling: 50000 activity entries, 5000 reports, 1000
      collections, and 50000 collection segment references in total. A `true` here means more
      data exists than the response carries.
    required:
      - activity
      - collections
      - collectionSegments
      - reports
    properties:
      activity:
        type: boolean
      collections:
        type: boolean
      collectionSegments:
        type: boolean
      reports:
        type: boolean
  profile:
    type: object
    required:
      - id
      - username
      - email
      - createdAt
    properties:
      id:
        type: integer
      username:
        type: string
      email:
        type: string
      createdAt:
        type: string
        format: date-time
  preferences:
    $ref: "./UserPreferences.yaml"
  activity:
    type: array
    items:
      $ref: "./UserActivity.yaml"
  collections:
    type: array
    items:
      $ref: "./UserExportCollection.yaml"
  reports:
    type: array
    items:
      $ref: "./Report.yaml"
