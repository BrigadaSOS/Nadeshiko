type: object
description: Site-wide announcement banner
required:
  - message
  - type
  - active
properties:
  message:
    type: string
    maxLength: 500
    description: >
      The banner text. Stored and returned verbatim; the web client renders a
      small inline markdown subset from it -- links, bold, italic, code spans and
      line breaks -- so `maxLength` counts the markup as well as the words.
      Anything outside that subset, raw HTML included, is shown as the characters
      it is made of rather than interpreted. Other clients are free to print it
      as plain text.
    example: "Scheduled maintenance tonight. See [the status page](/blog)."
  type:
    type: string
    enum: [INFO, WARNING, MAINTENANCE]
    example: "INFO"
  active:
    type: boolean
    example: true
