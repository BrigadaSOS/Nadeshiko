type: object
description: |
  A reader's linked Shirabe account, as the reader is shown it.

  Never carries the stored tokens: nothing here can be used to act on their
  Shirabe account.
required:
  - needsUpgrade
  - missingScopes
  - disconnected
  - linkedAt
  - scopes
  - dictionaries
  - stackIsPrivate
properties:
  needsUpgrade:
    type: boolean
    description: >-
      True when the link works but is missing a permission a newer feature needs
      -- granted before that feature existed. A re-consent, not a repair: what
      the account was linked for keeps working the whole time, and only the newer
      feature is unavailable.
    example: false
  missingScopes:
    type: array
    description: The permissions a re-consent would add. Empty unless `needsUpgrade`.
    items:
      type: string
    example: []
  disconnected:
    type: boolean
    description: >-
      True when Shirabe refused this key outright -- the reader revoked it from
      their Shirabe access list, or it was swept for being idle. The link is over
      until they make a new one, and their own dictionaries are not being used
      until they do. Distinct from `needsUpgrade`, which is a link that still
      works: this one is a repair.
    example: false
  linkedAt:
    type: string
    format: date-time
  shirabeName:
    type: string
    nullable: true
    description: Who they are on Shirabe, for the settings page to name the link.
    example: Lumi
  scopes:
    type: array
    description: What the reader granted. Today that is READ_ACCOUNT and nothing else.
    items:
      type: string
    example: [READ_ACCOUNT]
  dictionaries:
    type: array
    description: >-
      Their Shirabe dictionary stack: ordered `slug:lang` refs naming which
      dictionaries resolve, in which languages, in what order. This is what makes
      a word lookup here answer the way it does over there.
    items:
      type: string
    example: [sanseido:ja, jmdict:en]
  dictionaryNames:
    type: object
    additionalProperties: { type: string }
    description: >-
      What each dictionary above is CALLED, keyed by slug, as Shirabe names it.
      A reader's own uploads are filed under content hashes, so a client printing
      the stack without this prints a list of hashes. Empty for a link made
      before Shirabe published the names; fall back to the slug.
    example: { jmdict: JMdict, "yomitan-c89af12122021a8a": 三省堂国語辞典 }
  stackIsPrivate:
    type: boolean
    description: >-
      True when their stack names one of their own uploads, which makes its
      answers theirs alone and stops a lookup being cached for anyone else.
    example: false
  syncedAt:
    type: string
    format: date-time
    nullable: true
    description: When the stack was last re-read from Shirabe.
