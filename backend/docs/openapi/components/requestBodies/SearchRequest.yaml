type: object
description: |
  Search request. All fields are optional — omit `query` for queryless browse (segments matching filters only).
properties:
  query:
    $ref: "../schemas/SearchQuery.yaml"
  take:
    type: integer
    description: Max number of entries per response
    default: 10
    minimum: 1
    maximum: 50
  cursor:
    type: string
    description: Opaque cursor token returned from the previous search page
    maxLength: 500
    example: eyJraW...N119
  sort:
    $ref: "../schemas/SearchSort.yaml"
  preferMedia:
    type: array
    description: |
      Public IDs of titles the caller wants first.

      With a search word and the default `RELEVANCE` order, results come in
      rounds by title -- the best segment of every title, then the second best
      of every title, then everything else by relevance -- so one title cannot
      fill the top. These titles form a block of their own ahead of all others:
      their rounds, then the rest of their segments, then the same for every
      other title. Without a search word they get a small relevance boost
      instead. Keep the list the same while paging through one search.

      Sent by the web client for a signed-in reader, from the titles they have
      starred. Ignored unless `sort.mode` is `RELEVANCE`, since every other mode
      sorts on a key the caller asked for by name. Unknown IDs are ignored
      rather than rejected.
    items:
      type: string
      pattern: '^[A-Za-z0-9_-]{12}$'
    # Leave room for favorites plus activity-ranked titles in the web client.
    maxItems: 120
    example: ["V1StGXR8_Z5d"]
  filters:
    $ref: "../schemas/SearchFilters.yaml"
  include:
    type: array
    description: Optional resources to expand in the response `includes` block
    items:
      $ref: "../schemas/IncludeExpansion.yaml"
    default: []
