get:
  tags:
    - User
  x-internal: true
  # This is never browser-routable. The controller also requires the internal
  # proxy proof, so an unauthenticated public request cannot mint a bearer.
  x-server-only: true
  operationId: getShirabeServiceCredential
  summary: A short-lived Shirabe service bearer for the frontend server
  description: |
    Hands the Nadeshiko frontend server the cached OAuth client-credentials
    bearer used for shared-dictionary reads. It is not a user credential and
    cannot read a reader's personal dictionary stack.
  security: []
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - token
              - expiresAt
              - refreshAt
            properties:
              token:
                type: string
                description: Short-lived OAuth bearer with dictionary:read.
              expiresAt:
                type: number
                format: double
                description: Unix epoch milliseconds when the bearer actually expires.
              refreshAt:
                type: number
                format: double
                description: Unix epoch milliseconds when Nitro should request an updated bearer.
    "403":
      $ref: "../../components/responses/Forbidden.yaml"
    "500":
      $ref: "../../components/responses/InternalServerError.yaml"
