get:
  tags:
    - Admin
  x-internal: true
  operationId: getAdminUsersWithProviders
  summary: List users with linked auth providers
  description: |
    Returns active accounts together with the authentication providers linked to each one, for the admin dashboard.
    Uses offset pagination because the dashboard exposes page-back navigation.

  security:
    - SessionCookie: [ADMIN]
  parameters:
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Number of results per page
    - name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Number of results to skip
    - name: search
      in: query
      schema:
        type: string
      description: Case-insensitive substring match against email and username
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - users
              - total
            properties:
              users:
                type: array
                items:
                  $ref: "../../components/schemas/AdminUserWithProviders.yaml"
              total:
                type: integer
                description: Total number of active accounts matching the search
    "401":
      $ref: "../../components/responses/Unauthorized.yaml"
    "403":
      $ref: "../../components/responses/Forbidden.yaml"
    "429":
      $ref: "../../components/responses/TooManyRequests.yaml"
    "500":
      $ref: "../../components/responses/InternalServerError.yaml"
