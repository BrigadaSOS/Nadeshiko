get:
  tags:
    - Admin
  x-internal: true
  operationId: listTiers
  summary: List quota tiers
  description: |
    Returns every quota tier, in display order. The admin surface needs this to
    offer a picker; without it a tier change is a slug typed from memory.
  security:
    - SessionCookie: [ADMIN]
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - tiers
            properties:
              tiers:
                type: array
                items:
                  $ref: "../../components/schemas/Tier.yaml"
    "401":
      $ref: "../../components/responses/Unauthorized.yaml"
    "403":
      $ref: "../../components/responses/Forbidden.yaml"
    "429":
      $ref: "../../components/responses/TooManyRequests.yaml"
    "500":
      $ref: "../../components/responses/InternalServerError.yaml"
