  /v1/feedback/token:
    get:
      tags:
        - Feedback
      x-internal: true
      operationId: getFeedbackFormToken
      summary: Issue a feedback form token
      description: |
        Called when the feedback panel opens. The token it returns carries the moment
        it was issued, sealed so the client cannot edit it, and `POST /v1/feedback`
        requires one: a submission that arrives faster than a person could have typed
        it, or with no token at all, is treated as automated.

        Deliberately a separate call rather than something embedded in the page: the
        site's HTML is cached at the edge, so anything baked into it would be shared
        by every visitor who got that copy and would be stale by an unbounded amount.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackFormToken'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/email/unsubscribe:
    post:
      tags:
        - Email
      x-internal: true
      operationId: unsubscribeFromEmail
      summary: Turn off lifecycle email
      description: |
        Stops the day-7 note, the feedback ask and the monthly recap for the account
        the token names. Transactional mail — sign-in links, address verification —
        is unaffected, because a reader must not be able to lock themselves out of
        their own account by unsubscribing from a newsletter.

        Unauthenticated on purpose. The recipient is reading an email, not a signed-in
        page, and an opt-out that first demanded a password is the pattern that turns
        an unsubscribe into a spam complaint. The token carries the account, sealed,
        so no session is needed and none is trusted.

        THE TOKEN IS A QUERY PARAMETER BECAUSE RFC 8058 LEAVES NO CHOICE. This is the
        target of `List-Unsubscribe-Post`, and a one-click unsubscribe posts a fixed
        body — `List-Unsubscribe=One-Click` — to the URI verbatim. Nothing the sender
        puts in a request body survives that, so anything identifying the recipient
        has to travel in the URI. Any body sent is ignored rather than rejected, for
        the same reason.

        Idempotent: mailbox providers fire this with nobody present and may retry.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
            maxLength: 512
          description: |
            Opaque token from the unsubscribe link in the email. Carries the account
            it was issued for, sealed, so it cannot be edited into a token for
            somebody else. Does not expire — a recap is read when the reader gets
            round to it, and a link that answers "this expired, sign in instead" is
            how an opt-out becomes a spam complaint.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsubscribeReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/email/preferences:
    get:
      tags:
        - Email
      x-internal: true
      operationId: getEmailPreferencesByToken
      summary: Read email preferences from an unsubscribe token
      description: |
        What the account the token names currently receives, so the unsubscribe page
        can show the reader their real settings rather than a guess.

        Unauthenticated on purpose, for the same reason the unsubscribe endpoint is:
        the recipient is reading an email, not a signed-in page, and a preference
        screen that first demanded a password is the pattern that turns an opt-out
        into a spam complaint.

        SAFE TO PREFETCH. Mail scanners fetch every link in a message before the
        recipient ever sees it, so this reads and never writes — the change happens
        on the PATCH, which a scanner will not issue.

        Discloses only which categories the account is on, to a holder who already
        has the token from their own inbox.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
            maxLength: 512
          description: |
            Opaque token from the unsubscribe link in the email. Carries the account
            it was issued for, sealed, so it cannot be edited into a token for
            somebody else. Does not expire.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - enabled
                  - categories
                properties:
                  enabled:
                    type: boolean
                    description: The master switch. False means nothing below is sent.
                  categories:
                    type: object
                    description: |
                      Each category the reader can hold separately. Absent from
                      storage means "follow the master", which is resolved here so
                      the page never has to reason about it.
                    required:
                      - recap
                      - checkins
                      - updates
                    properties:
                      recap:
                        type: boolean
                      checkins:
                        type: boolean
                      updates:
                        type: boolean
                  category:
                    type: string
                    nullable: true
                    enum:
                      - recap
                      - checkins
                      - updates
                    description: |
                      Which category the email carrying this token belonged to, when
                      it named one. The page highlights it, because that is the one
                      the reader clicked about.
        '400':
          description: The token could not be read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
    patch:
      tags:
        - Email
      x-internal: true
      operationId: updateEmailPreferencesByToken
      summary: Change email preferences from an unsubscribe token
      description: |
        Writes the categories the reader chose on the unsubscribe page.

        Every field is optional and only what is sent is changed, so the page can
        submit one checkbox without having to know or restate the rest.

        Turning the master off stops everything, which is what the "stop all of it"
        control does; turning it on again restores whatever the categories say.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  maxLength: 512
                  description: |
                    The same token the link carries. In the BODY rather than the
                    query for this one, unlike the GET: a write does not need to be
                    reachable from a URL, and keeping it out of the path keeps it out
                    of proxy access logs and browser history.
                enabled:
                  type: boolean
                recap:
                  type: boolean
                checkins:
                  type: boolean
                updates:
                  type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - enabled
                  - categories
                properties:
                  enabled:
                    type: boolean
                  categories:
                    type: object
                    required:
                      - recap
                      - checkins
                      - updates
                    properties:
                      recap:
                        type: boolean
                      checkins:
                        type: boolean
                      updates:
                        type: boolean
        '400':
          description: The token could not be read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
