          type: array
          items:
            type: integer
          minItems: 1
          maxItems: 100
          description: Report IDs to update
          example:
            - 1
            - 2
            - 3
        status:
          $ref: '#/components/schemas/ReportStatus'
        adminNotes:
          type: string
          maxLength: 1000
