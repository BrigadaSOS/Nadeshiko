    UserPreferences:
      type: object
      properties:
        mediaNameLanguage:
          type: string
          enum:
            - ENGLISH
            - JAPANESE
            - ROMAJI
          description: Preferred language for media names display
        contentRatingPreferences:
          type: object
          description: Per-category content rating display preferences
          properties:
            nsfw:
              type: string
              enum:
                - SHOW
                - BLUR
                - HIDE
        translationVisibilityPreferences:
          type: object
          description: Per-language visibility mode for translations in search results, keyed by ISO 639-1 code (uppercase)
          properties:
            EN:
              type: string
              enum:
                - show
                - spoiler
                - hidden
            ES:
              type: string
              enum:
                - show
                - spoiler
                - hidden
        translationLanguages:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          description: |
            Translation languages the reader wants in dictionary content, in display order. This is the global preference; translationVisibilityPreferences is a search-surface override for showing, spoiling, or hiding a language.
          items:
            type: string
            enum:
              - EN
              - ES
        wordPopup:
          type: object
          description: |
            How the word card behaves when a reader taps a word in a sentence. A group rather than a loose key so the settings that follow it have somewhere to live.
          properties:
            definitionSize:
              type: string
              enum:
                - SMALL
                - MEDIUM
                - LARGE
              description: |
                How large the definitions themselves are printed. The card holds a reader's own monolingual dictionaries now, which is Japanese prose rather than a three-word English gloss, and a size that suited "to die; to pass away" is small for a paragraph of 大辞林. MEDIUM is the default; SMALL is what the card printed before this existed.
        searchHistory:
          type: object
          properties:
            enabled:
              type: boolean
              description: Whether activity tracking is enabled (default true)
        ankiProfiles:
          type: array
          items:
            type: object
            required:
              - id
              - name
              - serverAddress
            properties:
              id:
                type: string
              name:
                type: string
              deck:
                type: string
                nullable: true
              model:
                type: string
                nullable: true
              fields:
                type: array
                items:
                  type: object
                  required:
                    - key
                    - value
                  properties:
                    key:
                      type: string
                    value:
                      type: string
              key:
                type: string
                nullable: true
              serverAddress:
                type: string
              openBrowserOnExport:
                type: boolean
                description: |
                  Whether exporting a card brings Anki's card browser to the front.

                  Absent means true, which is what it did before the setting existed.
                  Undeclared until now: the settings page has offered the switch all
                  along, but a profile saved with it off came back from the server
                  without the field at all, so turning it off appeared to save and then
                  did nothing.
        defaultSearchCategory:
          type: string
          enum:
            - ALL
            - ANIME
            - JDRAMA
            - YOUTUBE
          description: |
            Category tab a search opens on when the URL names none. `ALL` -- the value
            assumed when unset -- searches every category the user still has visible.

            Spelled out as its own enum rather than a nullable `Category` so that
            "search everything" is a value the client can send, not a field it has to
            clear. It mirrors `Category` plus `ALL`.

            A value the user has since hidden (see `hiddenCategories`) is ignored and
            the search falls back to `ALL`. It is stored rather than rejected, so
            unhiding the category brings the choice back.
        mediaCardDefault:
          type: string
          enum:
            - OPEN
            - CLOSED
          description: |
            Whether the title card starts open or closed on a title's own page, and on
            a search narrowed to one title.

            The card is a disclosure: a single line -- thumbnail, title, sentence and
            episode counts -- with the alternate names, studio, season, airing status,
            genres and catalogue links folded underneath it. Anyone can open and close
            it from the card itself; this only decides which way it starts, and
            `OPEN` -- assumed when unset -- is that default.

            It exists because the card is context for a page whose subject is the
            sentence list underneath it. At its old fixed size on a phone it took
            roughly a third of the viewport, so every visit to a title a reader
            already knows began with the same scroll past the same card.
        hiddenCategories:
          type: array
          description: |
            Whole media categories hidden from search results by the user.

            An empty array means nothing is hidden. Hiding *every* category is rejected with
            `400`: `filters.category` reads an empty list as "no filter", so hiding the last
            one would silently show everything back instead of nothing.
          items:
            $ref: '#/components/schemas/Category'
        hiddenMedia:
          type: array
          description: |
            Media hidden from search results by the user, as IDs.

            Entries used to carry the title's names as well. Nothing read them back --
            `GET /v1/user/excluded-media` resolves names from the catalogue, where a
            rename actually lands, and the search filter needs only IDs -- while the
            whole preferences blob rides `get-session` into the hydration payload of
            every page the reader loads. At ~141 bytes an entry against the 34 an
            ID-only one costs, a reader who had hidden 200 titles carried ~21KB of
            duplicated catalogue on every render.

            Still an object wrapping the ID rather than a bare string. Dropping the
            optional name fields is a change every previously-valid reader already
            accepts; replacing the object with a string is not, and old clients
            reaching for `mediaPublicId` would read the list as empty and show the
            reader results they had hidden.
          items:
            type: object
            required:
              - mediaPublicId
            properties:
              mediaPublicId:
                type: string
                description: Public ID of the hidden media
        favoriteMedia:
          type: array
          description: |
            Media the reader has starred. Starred titles sort to the top of the search
            media filter; they change the ORDER of that list, never its contents, so a
            starred title the current query does not match simply is not there.

            Capped at 100 entries, refused with `400` beyond that. The cap is not
            cosmetic: the whole preferences column is rewritten on every change (see
            `mutateUserPreferences`), so an unbounded list would make every unrelated
            preference write more expensive for the rest of the account's life.

            `favoritedAt` is declared here and written by the server, unlike
            `hiddenMedia`'s `hiddenAt` -- which the client invents and this schema has
            never described. It is the one thing about a starred title that the
            catalogue cannot answer, which is why it stayed when the names went -- for
            the same reason they went from `hiddenMedia`.
          items:
            type: object
            required:
              - mediaPublicId
              - favoritedAt
            properties:
              mediaPublicId:
                type: string
                description: Public ID of the starred media
              favoritedAt:
                type: string
                format: date-time
                description: When the reader starred it, set by the server.
        familiarMedia:
          type: object
          description: |
            Whether to keep a monthly tally of which titles the reader studies, used to
            sort those titles up the search media filter.

            Deliberately NOT `searchHistory`: that preference governs the activity log
            (queries, timestamps, per-row deletion), this one governs an aggregate
            count per title per month. A reader can reasonably want the tally without
            the diary, so the two are stored apart, cleared apart, and expire apart.
            Existing readers who had `searchHistory` off were seeded to `false` here.
          properties:
            enabled:
              type: boolean
              description: Whether familiar-media tallying is enabled (default true)
        productEmails:
          type: object
          description: |
            Whether we may send this account the lifecycle mail — the day-7 note, the
            feedback ask, the monthly recap. Absent means yes: these are service
            messages about the functionality the reader uses, so the default is on and
            the reader turns it off, here or from the link in any of them.

            Does NOT govern transactional mail. Sign-in links and address verification
            are the account working rather than news about it, and honouring this flag
            for them would let somebody lock themselves out by unsubscribing.
          properties:
            enabled:
              type: boolean
              description: |
                The master switch, and the only thing a `List-Unsubscribe` header with
                no category sets. Off here stops every category below it.
            recap:
              type: boolean
              description: |
                The monthly digest of the reader's own activity. Absent means follow
                `enabled` — never a fresh yes, or a reader who left before this
                category existed would be re-subscribed by its arrival.
            checkins:
              type: boolean
              description: |
                The occasional one-off questions: the day-7 note and the win-back.
                Absent means follow `enabled`.
            updates:
              type: boolean
              description: |
                Releases and new features, including any request for support that
                rides in one. Sent through Zoho Campaigns rather than from here, so
                this governs the audience export. Absent means follow `enabled`.
    ActivityType:
      type: string
      enum:
        - SEARCH
        - ANKI_EXPORT
        - SEGMENT_PLAY
        - SHARE
      description: Type of user activity
    UserActivity:
      type: object
      required:
        - id
        - activityType
        - segmentPublicId
        - mediaPublicId
        - searchQuery
        - mediaName
        - japaneseText
        - createdAt
      properties:
        id:
          type: integer
          minimum: 1
        activityType:
          $ref: '#/components/schemas/ActivityType'
        segmentPublicId:
          type: string
          nullable: true
          minLength: 1
          pattern: ^[A-Za-z0-9_-]{12}$
        mediaPublicId:
          type: string
          nullable: true
          minLength: 1
          pattern: ^[A-Za-z0-9_-]{12}$
        searchQuery:
          type: string
          nullable: true
          minLength: 1
        mediaName:
          type: string
          nullable: true
          minLength: 1
        japaneseText:
          type: string
          nullable: true
          minLength: 1
        createdAt:
          type: string
          format: date-time
    UserActivityRequest:
      type: object
      description: Request body for tracking a user activity event
      required:
        - activityType
      properties:
        activityType:
          type: string
          enum:
            - SEARCH
            - SEGMENT_PLAY
            - SHARE
            - ANKI_EXPORT
        segmentPublicId:
          type: string
          pattern: ^[A-Za-z0-9_-]{12}$
        mediaPublicId:
          type: string
          pattern: ^[A-Za-z0-9_-]{12}$
        mediaName:
          type: string
        japaneseText:
          type: string
        searchQuery:
          type: string
        autoplay:
          type: boolean
          description: |
            Whether this `SEGMENT_PLAY` was started by autoplay rather than by the
            reader. Recorded as activity either way; excluded from the familiar-media
            tally, where a playlist running on its own is not evidence of studying.
    HeatmapDayCounts:
      type: object
      description: Activity counts for a single day, broken down by type. Only types with at least 1 event are present.
      properties:
        SEARCH:
          type: integer
          minimum: 0
        SEGMENT_PLAY:
          type: integer
          minimum: 0
        ANKI_EXPORT:
          type: integer
          minimum: 0
        SHARE:
          type: integer
          minimum: 0
    UserActivityStats:
      type: object
      description: Aggregate statistics about a user's activity
      required:
        - totalSearches
        - totalExports
        - totalPlays
        - totalListAdds
        - totalShares
        - topMedia
      properties:
        totalSearches:
          type: integer
          minimum: 0
          example: 1240
        totalExports:
          type: integer
          minimum: 0
          example: 82
        totalPlays:
          type: integer
          minimum: 0
          example: 3400
        totalListAdds:
          type: integer
          minimum: 0
          example: 58
        totalShares:
          type: integer
          minimum: 0
          example: 17
        topMedia:
          type: array
          items:
            type: object
            required:
              - mediaPublicId
              - mediaName
              - count
            properties:
              mediaPublicId:
                type: string
                minLength: 1
                example: V1StGXR8_Z5d
              mediaName:
                type: string
                minLength: 1
                example: Steins;Gate
              count:
                type: integer
                minimum: 1
                example: 240
    CollectionVisibility:
      type: string
      description: Visibility of a collection
      enum:
        - PUBLIC
        - PRIVATE
      example: PRIVATE
    Collection:
      type: object
      description: User segment collection
      required:
        - publicId
        - name
        - type
        - visibility
        - segmentCount
        - createdAt
        - updatedAt
      properties:
        publicId:
          type: string
          description: Public ID for the collection
          pattern: ^[A-Za-z0-9_-]{12}$
          example: V1StGXR8_Z5d
        name:
          type: string
          description: Name of the collection
          example: Study Favorites
        type:
          type: string
          enum:
            - USER
            - ANKI_EXPORT
          description: Type of the collection
          example: USER
        visibility:
          $ref: '#/components/schemas/CollectionVisibility'
        segmentCount:
          type: integer
          description: Number of segments in the collection
          example: 42
        createdAt:
          type: string
          format: date-time
          description: When the collection was created
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the collection was last updated
    UserExportCollection:
      allOf:
        - $ref: '#/components/schemas/Collection'
        - type: object
          required:
            - segmentIds
          properties:
            segmentIds:
              type: array
              description: Segment IDs in saved order
              items:
                type: integer
    UserExportResponse:
      type: object
      description: User data export payload (identifier-oriented references)
      required:
        - profile
        - preferences
        - activity
        - collections
        - reports
        - mediaAffinity
        - truncated
      properties:
        truncated:
          type: object
          description: |
            Which sections were cut short. The export is assembled and returned as a single JSON
            body, so each section has a ceiling: 50000 activity entries, 5000 reports, 1000
            collections, 50000 collection segment references in total, and 50000 media affinity
            rows. A `true` here means more data exists than the response carries.
          required:
            - activity
            - collections
            - collectionSegments
            - reports
            - mediaAffinity
          properties:
            activity:
              type: boolean
            collections:
              type: boolean
            collectionSegments:
              type: boolean
            reports:
              type: boolean
            mediaAffinity:
              type: boolean
        profile:
          type: object
          required:
            - id
            - username
            - email
            - createdAt
          properties:
            id:
              type: integer
            username:
              type: string
            email:
              type: string
            createdAt:
              type: string
              format: date-time
        preferences:
          $ref: '#/components/schemas/UserPreferences'
        activity:
          type: array
          items:
            $ref: '#/components/schemas/UserActivity'
        collections:
          type: array
          items:
            $ref: '#/components/schemas/UserExportCollection'
        reports:
          type: array
          items:
            $ref: '#/components/schemas/Report'
        mediaAffinity:
          type: array
          description: |
            The monthly per-title tally behind familiar-media sorting. Stored apart
            from `activity` and governed by its own preference, so it is exported as
            its own section rather than folded into the activity log.
          items:
            type: object
            required:
              - mediaPublicId
              - periodYyyymm
              - ankiCount
              - playCount
              - shareCount
            properties:
              mediaPublicId:
                type: string
              periodYyyymm:
                type: integer
                description: Year and month of the tally, as YYYYMM in UTC.
              ankiCount:
                type: integer
              playCount:
                type: integer
              shareCount:
                type: integer
    CreateFeedbackRequest:
      type: object
      required:
        - body
        - formToken
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 4000
          description: The message. Free text — no category, no target.
          example: The audio on the search page stops after the first segment on Firefox.
        email:
          type: string
          format: email
          maxLength: 320
          description: |
            Optional reply address for anonymous senders. Ignored when the request
            carries a session: the account's own address is used instead, so a signed-in
            sender cannot attribute a message to somebody else's inbox.
          example: you@example.com
        formToken:
          type: string
          maxLength: 512
          description: |
            Opaque token from `GET /v1/feedback/token`, issued when the panel opened.
            It carries the issue time, so a submission that arrives implausibly fast
            after the form appeared can be told from a person typing.
        nickname:
          type: string
          maxLength: 200
          description: |
            Honeypot. Not rendered to people; anything in it marks the submission as
            automated. Present in the contract because it has to be accepted to be
            ignored.
        pagePath:
          type: string
          maxLength: 2000
          description: |
            Same-origin path (and query) the sender was on, e.g. `/search?q=彼女`.
            Anything that is not a rooted path is dropped rather than rejected.
          example: /search?q=彼女
        locale:
          type: string
          maxLength: 16
          description: |
            The locale the page rendered in, which is not the same question as
            `Accept-Language`: the site's locale comes from the URL prefix and a stored
            preference, so a reader on `/es/search` with an English browser is reading
            Spanish. Falls back to the request header when absent.
          example: es
        appVersion:
          type: string
          maxLength: 32
          description: |
            The frontend build the sender was running. Client-supplied because it is the
            only side that knows: the browser can be holding a bundle several deploys
            old, and the API's own version says nothing about it.
          example: 2.4.0
        posthogSessionId:
          type: string
          maxLength: 64
          description: PostHog session id, so a report links to its session replay. Blank where posthog is not loaded.
        posthogDistinctId:
          type: string
          maxLength: 128
          description: PostHog person id.
    FeedbackReceipt:
      type: object
      required:
        - received
      properties:
        received:
          type: boolean
          description: |
            Always `true`. The response is deliberately uniform: a submission dropped
            as automated answers exactly like one that was stored, so a bot learns
            nothing from the reply about what tripped it.
          example: true
    FeedbackFormToken:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: Opaque, short-lived. Pass back as `formToken` when submitting.
    UnsubscribeReceipt:
      type: object
      required:
        - unsubscribed
      properties:
        unsubscribed:
          type: boolean
          description: |
            Always `true` when the token was readable. A token for an account that has
            since been deleted also answers `true`: the end state the caller asked for
            already holds, and there is nothing for them to act on.
          example: true
    CollectionListResponse:
      type: object
      description: Paginated collection list response
      required:
        - collections
        - pagination
      properties:
        collections:
          type: array
          items:
            $ref: '#/components/schemas/Collection'
        pagination:
          $ref: '#/components/schemas/CursorPagination'
    CollectionCreateRequest:
      type: object
      description: Request body for creating a new collection
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          description: Name of the collection
          example: My Study List
        visibility:
          $ref: '#/components/schemas/CollectionVisibility'
    CollectionUpdateRequest:
      type: object
      properties:
        name:
          type: string
          example: Updated Collection Name
        visibility:
          $ref: '#/components/schemas/CollectionVisibility'
    AddSegmentToCollectionRequest:
      type: object
      required:
        - segmentPublicId
      properties:
        segmentPublicId:
          type: string
          pattern: ^[A-Za-z0-9_-]{12}$
          description: Segment public ID
          example: V1StGXR8_Z5d
    UpdateCollectionSegmentRequest:
      type: object
      properties:
        position:
          type: integer
          description: New position in the collection
          example: 2
    ReportTargetType:
      type: string
      description: Kind of entity a report is about
      enum:
        - SEGMENT
        - EPISODE
        - MEDIA
      example: SEGMENT
    AdminReportGroupItem:
      type: object
      required:
        - id
        - reason
