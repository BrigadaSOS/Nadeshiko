      type: object
      description: Number of records affected by a bulk operation
      required:
        - count
      properties:
        count:
          type: integer
          description: Number of records affected
          example: 42
    UserMe:
      type: object
      required:
        - user
        - quota
      properties:
        user:
          type: object
          required:
            - username
            - createdAt
            - role
          properties:
            username:
              type: string
              minLength: 1
              description: The user's display name.
              example: tanaka_san
            createdAt:
              type: string
              format: date-time
              description: When the account was created.
              example: '2024-03-15T10:00:00.000Z'
            role:
              type: string
              minLength: 1
              description: The user's account tier or role.
              example: USER
        quota:
          type: object
          required:
            - used
            - limit
            - remaining
            - periodYyyymm
            - periodStart
            - periodEnd
            - tier
            - burst
          properties:
            used:
              type: integer
              minimum: 0
              description: Number of API requests used this month.
              example: 342
            limit:
              type: integer
              minimum: 0
              description: Maximum number of API requests allowed per month.
              example: 5000
            remaining:
              type: integer
              minimum: 0
              description: Number of API requests remaining this month.
              example: 4658
            periodYyyymm:
              type: integer
              minimum: 202001
              description: Current month in YYYYMM format.
              example: 202602
            periodStart:
              type: string
              format: date-time
              description: Start of the current month (UTC).
              example: '2026-02-01T00:00:00.000Z'
            periodEnd:
              type: string
              format: date-time
              description: End of the current month (UTC).
              example: '2026-02-28T23:59:59.999Z'
            tier:
              type: object
              nullable: true
              description: |
                The quota tier this account sits on. Null when the account is on none,
                or when an override is in force and the tier no longer describes the
                limit.
              required:
                - id
                - displayName
              properties:
                id:
                  type: string
                  example: plus
                displayName:
                  type: string
                  example: Plus
            burst:
              type: object
              description: |
                The OTHER limit. Separate from the monthly allowance and enforced per
                API key over a short window, so a caller can exhaust it with plenty of
                month left -- which is why both are surfaced together, and why the two
                429s carry an `X-RateLimit-Reason` telling them apart.
              required:
                - max
                - windowMs
              properties:
                max:
                  type: integer
                  description: Requests allowed per key within `windowMs`.
                  example: 150
                windowMs:
                  type: integer
                  description: Length of the burst window, in milliseconds.
                  example: 60000
    ApiKeyScope:
      type: string
      description: |
        A capability an API key may carry. A key-authenticated request is checked
        against this list and nothing else, so a key's scopes are the whole of what it
        can do — a reader's role is not consulted again at request time.

        The corpus-write scopes (`ADD_MEDIA`, `UPDATE_MEDIA`, `REMOVE_MEDIA`) may only
        be granted by an admin; asking for one without the role is refused with `403`.
      enum:
        - ADD_MEDIA
        - READ_MEDIA
        - UPDATE_MEDIA
        - REMOVE_MEDIA
        - READ_PROFILE
        - WRITE_PROFILE
        - READ_ACTIVITY
        - WRITE_ACTIVITY
        - READ_COLLECTIONS
        - CREATE_COLLECTIONS
        - UPDATE_COLLECTIONS
        - DELETE_COLLECTIONS
      example: READ_MEDIA
    ShirabeConnection:
      type: object
      description: |
        A reader's linked Shirabe account, as the reader is shown it.

        Never carries the stored tokens: nothing here can be used to act on their
        Shirabe account.
      required:
        - needsUpgrade
        - missingScopes
        - disconnected
        - linkedAt
        - scopes
        - dictionaries
        - stackIsPrivate
      properties:
        needsUpgrade:
          type: boolean
          description: 'True when the link works but is missing a permission a newer feature needs -- granted before that feature existed. A re-consent, not a repair: what the account was linked for keeps working the whole time, and only the newer feature is unavailable.'
          example: false
        missingScopes:
          type: array
          description: The permissions a re-consent would add. Empty unless `needsUpgrade`.
          items:
            type: string
          example: []
        disconnected:
          type: boolean
          description: 'True when Shirabe refused this key outright -- the reader revoked it from their Shirabe access list, or it was swept for being idle. The link is over until they make a new one, and their own dictionaries are not being used until they do. Distinct from `needsUpgrade`, which is a link that still works: this one is a repair.'
          example: false
        linkedAt:
          type: string
          format: date-time
        shirabeName:
          type: string
          nullable: true
          description: Who they are on Shirabe, for the settings page to name the link.
          example: Lumi
        scopes:
          type: array
          description: What the reader granted. Today that is READ_ACCOUNT and nothing else.
          items:
            type: string
          example:
            - READ_ACCOUNT
        dictionaries:
          type: array
          description: 'Their Shirabe dictionary stack: ordered `slug:lang` refs naming which dictionaries resolve, in which languages, in what order. This is what makes a word lookup here answer the way it does over there.'
          items:
            type: string
          example:
            - sanseido:ja
            - jmdict:en
        dictionaryNames:
          type: object
          additionalProperties:
            type: string
          description: What each dictionary above is CALLED, keyed by slug, as Shirabe names it. A reader's own uploads are filed under content hashes, so a client printing the stack without this prints a list of hashes. Empty for a link made before Shirabe published the names; fall back to the slug.
          example:
            jmdict: JMdict
            yomitan-c89af12122021a8a: 三省堂国語辞典
        stackIsPrivate:
          type: boolean
          description: True when their stack names one of their own uploads, which makes its answers theirs alone and stops a lookup being cached for anyone else.
          example: false
        syncedAt:
          type: string
          format: date-time
          nullable: true
          description: When the stack was last re-read from Shirabe.
