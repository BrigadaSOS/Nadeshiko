    SearchStatsRequest:
      type: object
      description: |
        Stats request. All fields are optional — omit `query` to get filter counts for the full corpus.
      properties:
        query:
          $ref: '#/components/schemas/SearchQuery'
        filters:
          $ref: '#/components/schemas/SearchFilters'
        include:
          type: array
          description: Optional resources to expand in the response `includes` block
          items:
            $ref: '#/components/schemas/IncludeExpansion'
          default: []
    MediaSearchStats:
      type: object
      description: Search hit statistics for a single media
      required:
        - mediaPublicId
        - matchCount
        - episodeHits
      properties:
        mediaPublicId:
          type: string
          description: Media public ID (look up full details in `includes.media` when `include[]=media` is requested)
          pattern: ^[A-Za-z0-9_-]{12}$
          example: V1StGXR8_Z5d
        matchCount:
          type: integer
          description: Number of matching segments found in this media
          minimum: 0
          example: 42
        episodeHits:
          type: array
          description: Episode-level hit counts
          items:
            type: object
            required:
              - episode
              - hitCount
            properties:
              episode:
                type: integer
                description: Episode number
                minimum: 0
                example: 1
              hitCount:
                type: integer
                description: Number of matching segments in this episode
                minimum: 0
                example: 5
          example:
            - episode: 1
              hitCount: 5
            - episode: 2
              hitCount: 8
            - episode: 3
              hitCount: 3
    CategoryCount:
      type: object
      description: Count of entries grouped by media category
      required:
        - category
        - count
        - realCount
      properties:
        category:
          $ref: '#/components/schemas/Category'
        count:
          type: integer
          description: Number of entries in this category under the current request filters (including any hidden-media exclusion).
          minimum: 0
          example: 1523
        realCount:
          type: integer
          description: Number of entries in this category when the hidden-media exclusion filter is ignored. Equal to `count` when no hidden-media exclusion is in effect.
          minimum: 0
          example: 1700
    SearchStatsResponse:
      type: object
      required:
        - media
        - categories
      properties:
        media:
          type: array
          items:
            $ref: '#/components/schemas/MediaSearchStats'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryCount'
        includes:
          type: object
          description: Optional related resources requested via `include[]`
          properties:
            media:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/Media'
              description: Media objects keyed by publicId. Present only when `include[]=media` is requested.
    SearchMultipleQuery:
      type: object
      description: What to search for (multiple words)
      required:
        - words
      properties:
        words:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
          description: List of words to search for
          minItems: 1
          maxItems: 100
          example:
            - 彼女
            - 私
        exactMatch:
          type: boolean
          default: false
          description: Require exact phrase matching (disables fuzzy and partial matches)
    SearchMultipleRequest:
      type: object
      required:
        - query
      properties:
        query:
          $ref: '#/components/schemas/SearchMultipleQuery'
        filters:
          $ref: '#/components/schemas/SearchFilters'
        include:
          type: array
          description: Optional resources to expand in the response `includes` block
          items:
            $ref: '#/components/schemas/IncludeExpansion'
          default: []
    WordMatchMedia:
      type: object
      description: Media match count entry
      required:
        - mediaPublicId
        - matchCount
      properties:
        mediaPublicId:
          type: string
          description: Media public ID (look up full details in `includes.media` when `include[]=media` is requested)
          pattern: ^[A-Za-z0-9_-]{12}$
          example: V1StGXR8_Z5d
        matchCount:
          type: integer
          description: Number of times the word appears in this media
          minimum: 0
          example: 234
    WordMatch:
      type: object
      description: Word matching result with occurrences across media
      required:
        - word
        - isMatch
        - matchCount
        - realMatchCount
        - media
      properties:
        word:
          type: string
          description: The word that was searched for
          minLength: 1
          example: 彼女
        isMatch:
          type: boolean
          description: Indicates whether the word was found in any segment
          example: true
        matchCount:
          type: integer
          description: Number of times this word appears across media matching the current request filters (including any hidden-media exclusion).
          minimum: 0
          example: 1523
        realMatchCount:
          type: integer
          description: Total occurrences across all media, ignoring the hidden-media exclusion filter. Equal to `matchCount` when no media exclusion is in effect.
          minimum: 0
          example: 5231
        media:
          type: array
          description: List of media containing this word
          items:
            $ref: '#/components/schemas/WordMatchMedia'
    SearchMultipleResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/WordMatch'
        includes:
          type: object
          description: Optional related resources requested via `include[]`
          properties:
            media:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/Media'
              description: Media objects keyed by publicId. Present only when `include[]=media` is requested.
    SearchMediaFilters:
      type: object
      description: Filters for narrowing media search results
      properties:
        category:
          type: array
          description: Media category filter
          items:
            $ref: '#/components/schemas/Category'
          default:
            - ANIME
            - JDRAMA
            - YOUTUBE
    SearchMediaRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          description: Search term to match against media names (English, Japanese, romaji)
          minLength: 1
          pattern: .*\S.*
          example: steins
        take:
          type: integer
          description: Maximum number of results to return
          default: 10
          minimum: 1
          maximum: 40
        filters:
          $ref: '#/components/schemas/SearchMediaFilters'
    MediaSummary:
      type: object
      description: Slim media item returned by autocomplete (names + cover only)
      required:
        - publicId
        - slug
        - nameJa
        - nameRomaji
        - nameEn
        - coverUrl
        - category
      properties:
        publicId:
          type: string
          description: Public ID for the media
          pattern: ^[A-Za-z0-9_-]{12}$
          example: V1StGXR8_Z5d
        slug:
          type: string
          minLength: 1
          description: URL-friendly slug for the media
          example: bakuman
        nameJa:
          type: string
          minLength: 1
          description: Original Japanese name of the media
          example: バクマン。
        nameRomaji:
          type: string
          minLength: 1
          description: Romaji transliteration of the media name
          example: Bakuman.
        nameEn:
          type: string
          minLength: 1
          description: English name of the media
          example: Bakuman.
        coverUrl:
          type: string
          format: uri
          minLength: 1
          description: Full URL to the cover image
          example: https://cdn.example.com/media/anime/bakuman/cover.webp
        category:
          $ref: '#/components/schemas/Category'
    MediaAutocompleteResponse:
      type: object
      required:
        - media
      properties:
        media:
          type: array
          items:
            $ref: '#/components/schemas/MediaSummary'
    WordCoverageTier:
      type: object
      description: Coverage statistics for a frequency tier
      required:
        - tier
        - covered
        - total
        - percentage
      properties:
        tier:
          type: integer
          minimum: 1
          description: The frequency tier (e.g. 1000 means top 1000 words)
          example: 5000
        covered:
          type: integer
          minimum: 0
          description: Number of words with at least one match in the corpus
          example: 4823
        total:
          type: integer
          minimum: 0
          description: Total number of words in this tier
          example: 5000
        percentage:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Coverage percentage
          example: 96.5
    StatsOverview:
      type: object
      description: Corpus statistics overview
      required:
        - totalSegments
        - totalEpisodes
        - totalMedia
        - totalFrequencyWords
        - dialogueHours
        - tiers
        - lastUpdated
        - translations
      properties:
        totalSegments:
          type: integer
          minimum: 0
          description: Total number of active segments in the corpus
          example: 1200000
        totalEpisodes:
          type: integer
          minimum: 0
          description: Total number of episodes
          example: 8500
        totalMedia:
          type: integer
          minimum: 0
          description: Total number of media entries
          example: 350
        totalFrequencyWords:
          type: integer
          minimum: 0
          description: Total number of words in the frequency list
          example: 215900
        dialogueHours:
          type: number
          format: float
          minimum: 0
          description: Total hours of Japanese dialogue (subtitle coverage time)
          example: 2450.5
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/WordCoverageTier'
        lastUpdated:
          type: string
          format: date-time
          nullable: true
          description: When the word coverage data was last updated
        translations:
          type: object
          required:
            - total
            - enHuman
            - enMachine
            - esHuman
            - esMachine
          properties:
            total:
              type: integer
              minimum: 0
              description: Total active segments
              example: 1200000
            enHuman:
              type: integer
              minimum: 0
              description: Segments with human English translations
              example: 800000
            enMachine:
              type: integer
              minimum: 0
              description: Segments with machine English translations
              example: 350000
            esHuman:
              type: integer
              minimum: 0
              description: Segments with human Spanish translations
              example: 200000
            esMachine:
              type: integer
              minimum: 0
              description: Segments with machine Spanish translations
              example: 400000
    CoveredWord:
      type: object
      description: A word from the frequency list with coverage information
      required:
        - rank
        - word
        - matchCount
      properties:
        rank:
          type: integer
          description: Frequency rank
          example: 32
        word:
          type: string
          description: The Japanese word
          example: 彼女
        matchCount:
          type: integer
          description: Number of matching sentences in the corpus
          example: 1542
    CursorPagination:
      type: object
      description: Opaque cursor pagination metadata
      required:
        - hasMore
        - cursor
      properties:
        hasMore:
          type: boolean
          description: Whether more results are available
          example: true
        cursor:
          type: string
          nullable: true
          minLength: 1
          description: Opaque token to pass on the next request to fetch the following page
          example: eyJraW...IxfQ
    CoveredWordsResponse:
      type: object
