        description:
          type: string
          nullable: true
          description: Optional description with additional details
        source:
          $ref: '#/components/schemas/ReportSource'
        reporterName:
          type: string
          description: Name of the reporter
        createdAt:
          type: string
          format: date-time
          description: When the report was created
        adminNotes:
          type: string
          nullable: true
          description: Notes from the admin who reviewed the report
    AdminReportGroup:
      type: object
      required:
        - target
        - mediaName
        - status
        - reportCount
        - reporterCount
        - firstReportedAt
        - lastStatusChange
        - reports
      properties:
        target:
          $ref: '#/components/schemas/ReportTarget'
        mediaName:
          type: string
          description: Display name of the target media (romaji)
          example: Bocchi the Rock!
        status:
          $ref: '#/components/schemas/ReportStatus'
        reportCount:
          type: integer
          description: Total number of individual reports in this group
          example: 3
        reporterCount:
          type: integer
          description: Number of distinct users who reported this target
          example: 2
        firstReportedAt:
          type: string
          format: date-time
          description: When the earliest report in this group was created
        lastStatusChange:
          type: string
          format: date-time
          nullable: true
          description: When the most recent status change occurred in this group
        reports:
          type: array
          items:
            $ref: '#/components/schemas/AdminReportGroupItem'
          description: Individual reports within this group
    AdminReportListResponse:
      type: object
      required:
        - groups
        - pagination
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/AdminReportGroup'
        pagination:
          $ref: '#/components/schemas/CursorPagination'
    BatchUpdateReportsRequest:
