      type: object
      required:
        - segments
      properties:
        segments:
          type: array
          items:
            $ref: '#/components/schemas/Segment'
        includes:
          type: object
          description: Optional related resources requested via `include[]`
          properties:
            media:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/Media'
              description: Media objects keyed by publicId. Present only when `include[]=media` is requested.
    SegmentRevision:
      type: object
      required:
        - id
        - revisionNumber
        - snapshot
        - actor
        - reportId
        - createdAt
      properties:
        id:
          type: integer
          description: Revision ID
        revisionNumber:
          type: integer
          description: Sequential revision number per segment
        snapshot:
          type: object
          additionalProperties: true
          description: |
            The segment's editable fields as they were *before* this revision's edit.
            Restoring a revision writes these values back.
        actor:
          type: string
          enum:
            - HUMAN
            - AGENT
