            targetType:
              $ref: '#/components/schemas/ReportTargetType'
            targetMediaId:
              type: integer
              description: Filter by target media ID
            targetEpisodeNumber:
              type: integer
              description: Filter by target episode number
            targetSegmentId:
              type: integer
              description: Filter by target segment ID
            orphaned:
              type: boolean
              description: Only delete reports whose target media no longer exists
    BulkUpdateReportsRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/ReportStatus'
        adminNotes:
          type: string
          maxLength: 1000
          description: Optional admin notes to set on all matching reports
        filters:
          type: object
          description: Filters to select which reports to update. If omitted, updates all reports.
          properties:
            status:
              type: string
              description: |
                Filter by current report status. Accepts a single value or comma-separated list (e.g. "OPEN,PROCESSING").
            source:
              $ref: '#/components/schemas/ReportSource'
            targetType:
              $ref: '#/components/schemas/ReportTargetType'
            targetMediaId:
              type: integer
              description: Filter by target media ID
            targetEpisodeNumber:
              type: integer
              description: Filter by target episode number
            targetSegmentId:
              type: integer
              description: Filter by target segment ID
            orphaned:
              type: boolean
              description: Only update reports whose target media no longer exists
    UpdateReportRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ReportStatus'
        adminNotes:
          type: string
          maxLength: 1000
          description: Admin notes about the report
          example: Confirmed wrong translation, will fix
    AgentActivityResponse:
      type: object
      required:
        - entries
      properties:
        entries:
          type: array
          items:
            type: object
            required:
              - revisionId
              - revisionNumber
              - segmentPublicId
              - mediaPublicId
              - episodeNumber
              - snapshot
              - current
              - reportId
              - actedBy
              - createdAt
            properties:
              revisionId:
                type: integer
                description: Revision ID
              revisionNumber:
                type: integer
                description: The revision number to pass to the restore endpoint to undo this edit
              segmentPublicId:
                type: string
                description: Public ID of the segment that was changed
              mediaPublicId:
                type: string
                description: Public ID of the media the segment belongs to
              episodeNumber:
                type: integer
                description: Episode the segment belongs to
              snapshot:
                type: object
                additionalProperties: true
                description: The segment's editable fields as they were before this edit
              current:
                type: object
                additionalProperties: true
                description: |
                  The same fields as they are now. Paired with `snapshot` this is the
                  diff, without the caller having to fetch the segment separately.
              reportId:
                type: integer
                nullable: true
                description: The report this edit answered, when it answered one
              actedBy:
                type: string
                nullable: true
                description: Account the service credential belongs to
              createdAt:
                type: string
                format: date-time
                description: When the edit was made
    Announcement:
      type: object
      description: Site-wide announcement banner
      required:
        - message
        - type
        - active
      properties:
        message:
          type: string
          maxLength: 500
          description: |
            The banner text. Stored and returned verbatim; the web client renders a small inline markdown subset from it -- links, bold, italic, code spans and line breaks -- so `maxLength` counts the markup as well as the words. Anything outside that subset, raw HTML included, is shown as the characters it is made of rather than interpreted. Other clients are free to print it as plain text.
          example: Scheduled maintenance tonight. See [the status page](/blog).
        type:
          type: string
          enum:
            - INFO
            - WARNING
            - MAINTENANCE
          example: INFO
        active:
          type: boolean
          example: true
    AdminUserWithProviders:
      type: object
      required:
        - id
        - name
        - email
        - role
        - emailVerified
        - banned
        - banReason
        - createdAt
        - updatedAt
        - providers
      properties:
        id:
          type: integer
          description: Internal user ID.
          example: 42
        name:
          type: string
          description: The user's display name.
          example: tanaka_san
        email:
          type: string
          format: email
          description: The user's email address.
          example: tanaka@example.com
        role:
          type: string
          enum:
            - ADMIN
            - MOD
            - USER
            - PATREON
          description: The user's account tier or role.
          example: USER
        emailVerified:
          type: boolean
          description: Whether the account's email address has been verified.
        banned:
          type: boolean
          description: Whether the account is currently banned.
        banReason:
          type: string
          nullable: true
          description: Reason recorded when the account was banned, if any.
        createdAt:
          type: string
          format: date-time
          description: When the account was created.
          example: '2024-03-15T10:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          description: When the account was last modified.
          example: '2024-03-15T10:00:00.000Z'
        providers:
          type: array
          description: Linked authentication providers (empty when the account has none).
          items:
            type: string
            example: google
    Tier:
      type: object
      required:
        - id
        - displayName
        - monthlyQuotaLimit
        - sortOrder
      properties:
        id:
          type: string
          description: Stable slug referenced by an account's `tierId`
          example: plus
        displayName:
          type: string
          example: Plus
        monthlyQuotaLimit:
          type: integer
          description: API calls allowed per calendar month on this tier
          example: 25000
        rateLimitMax:
          type: integer
          nullable: true
          description: |
            Per-key burst allowance stamped onto keys created while on this tier.
            Null inherits the deployment-wide default.
          example: null
        rateLimitWindowMs:
          type: integer
          nullable: true
          description: Window for `rateLimitMax`, in milliseconds. Null inherits the default.
          example: null
        sortOrder:
          type: integer
          description: Display order; the id is a slug, not a rank
          example: 10
    AccountQuotaState:
      type: object
      required:
        - userId
        - tierId
        - quotaOverride
        - monthlyQuotaLimit
        - quotaSource
        - quotaUsed
        - periodYyyymm
      properties:
        userId:
          type: integer
          example: 328
        tierId:
          type: string
          nullable: true
          description: The tier this account sits on, or null if it has none
          example: plus
        quotaOverride:
          type: integer
          nullable: true
          description: Per-account limit that wins over the tier when set
          example: null
        monthlyQuotaLimit:
          type: integer
          description: The limit actually in force, after applying the resolution order
          example: 25000
        quotaSource:
          type: string
          enum:
            - override
            - tier
            - legacy_column
            - default
          description: |
            Which step of the resolution order produced `monthlyQuotaLimit`.
            `legacy_column` and `default` mean the tier did not resolve, and are worth
            investigating rather than displaying.
          example: tier
        quotaUsed:
          type: integer
          description: Calls billed to this account in the current period
          example: 4927
        periodYyyymm:
          type: integer
          description: The billing period, as YYYYMM in UTC
          example: 202608
    UpdateAccountQuotaRequest:
      type: object
      description: |
        At least one property must be present. Send `quotaOverride: null` to clear an
        override and fall back to the tier.
      minProperties: 1
      properties:
        tierId:
          type: string
          description: Slug of an existing tier
          example: plus
        quotaOverride:
          type: integer
          nullable: true
          minimum: 0
          description: |
            Per-account monthly limit, taking precedence over the tier. Null clears it.
          example: 50000
        reason:
          type: string
          maxLength: 500
          description: |
            Why the change is being made. Recorded on the audit log line so the number
            is reviewable later; the old model's whole problem was that a raised limit
            carried no record of the decision behind it.
          example: 'Support ticket #412 - open-source dictionary integration'
  examples:
    ValidationFailed:
      summary: Validation Failed
      value:
        code: VALIDATION_FAILED
        title: Validation Failed
        detail: The request data did not pass validation rules. Please check the errors field for details.
        type: https://github.com/BrigadaSOS/Nadeshiko/issues/new?template=bug_report.yml
        instance: trace-id-placeholder
        status: 400
        errors:
          query: Required
          limit: Must be a positive integer
          email: Invalid email format
    InvalidJson:
      summary: Invalid JSON
      value:
        code: INVALID_JSON
        title: Invalid JSON
        detail: The request body contains invalid JSON that could not be parsed. Please check the syntax.
        type: https://github.com/BrigadaSOS/Nadeshiko/issues/new?template=bug_report.yml
        instance: trace-id-placeholder
        status: 400
    AuthCredentialsRequired:
      summary: Authentication Credentials Required
      value:
        code: AUTH_CREDENTIALS_REQUIRED
        title: Authentication Credentials Required
        detail: No API key or session credentials were provided. Please include an Authorization Bearer token or a valid session cookie.
        type: https://github.com/BrigadaSOS/Nadeshiko/issues/new?template=bug_report.yml
        instance: trace-id-placeholder
        status: 401
    AuthCredentialsInvalid:
      summary: Invalid Authentication Credentials
      value:
        code: AUTH_CREDENTIALS_INVALID
        title: Invalid Authentication Credentials
        detail: The provided API key or session credentials are invalid. Please check your credentials and try again.
        type: https://github.com/BrigadaSOS/Nadeshiko/issues/new?template=bug_report.yml
        instance: trace-id-placeholder
        status: 401
    AuthCredentialsExpired:
      summary: Expired Authentication Credentials
      value:
        status: 401
        code: AUTH_CREDENTIALS_EXPIRED
        title: Expired Authentication Credentials
        detail: Your credentials are not valid anymore. Please sign in again or create a new API key.
        type: https://github.com/BrigadaSOS/Nadeshiko/issues/new?template=bug_report.yml
        instance: trace-id-placeholder
    InsufficientPermissions:
      summary: Insufficient Permissions
      value:
        code: INSUFFICIENT_PERMISSIONS
        title: Insufficient Permissions
        detail: 'Your account lacks the required permissions to perform this action. Required permissions: {permissions}.'
        type: https://github.com/BrigadaSOS/Nadeshiko/issues/new?template=bug_report.yml
        instance: trace-id-placeholder
        status: 403
    RateLimitExceeded:
      summary: Rate Limit Exceeded
      value:
        code: RATE_LIMIT_EXCEEDED
        title: Rate Limit Exceeded
        detail: You have made too many requests. Please slow down and try again later.
        type: https://github.com/BrigadaSOS/Nadeshiko/issues/new?template=bug_report.yml
        instance: trace-id-placeholder
        status: 429
    QuotaExceeded:
      summary: Quota Exceeded
      value:
        code: QUOTA_EXCEEDED
        title: Quota Exceeded
        detail: You have exceeded your monthly API quota. Please upgrade your plan or wait until next month.
        type: https://github.com/BrigadaSOS/Nadeshiko/issues/new?template=bug_report.yml
        instance: trace-id-placeholder
        status: 429
    InternalServerError:
      summary: Internal Server Error
      value:
        code: INTERNAL_SERVER_EXCEPTION
        title: Internal Server Error
        detail: An unexpected error occurred on our end. Please try again later. If the problem persists, please report this issue.
        type: https://github.com/BrigadaSOS/Nadeshiko/issues/new?template=bug_report.yml
        instance: trace-id-placeholder
        status: 500
    AccountConflict:
      summary: Account Conflict
      value:
        code: ACCOUNT_CONFLICT
        title: Account Conflict
        detail: An account with this email already exists. Please log in or use a different email.
        type: https://github.com/BrigadaSOS/Nadeshiko/issues/new?template=bug_report.yml
        instance: trace-id-placeholder
        status: 409
    DuplicateKey:
      summary: Duplicate Key (Resource Already Exists)
      value:
        code: DUPLICATE_KEY
        title: Resource already exists
        detail: A resource with this identifier already exists
        type: https://github.com/BrigadaSOS/Nadeshiko/issues/new?template=bug_report.yml
        instance: trace-id-placeholder
        status: 409
    NotFound:
      summary: Not Found
      value:
        code: NOT_FOUND
        title: Not Found
        detail: The requested resource could not be found. Please check the URL and try again.
        type: https://github.com/BrigadaSOS/Nadeshiko/issues/new?template=bug_report.yml
        instance: trace-id-placeholder
        status: 404
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error400'
          examples:
            ValidationFailed:
              $ref: '#/components/examples/ValidationFailed'
            InvalidJson:
              $ref: '#/components/examples/InvalidJson'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error401'
          examples:
            AuthCredentialsRequired:
              $ref: '#/components/examples/AuthCredentialsRequired'
            AuthCredentialsInvalid:
              $ref: '#/components/examples/AuthCredentialsInvalid'
            AuthCredentialsExpired:
              $ref: '#/components/examples/AuthCredentialsExpired'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error403'
          examples:
            InsufficientPermissions:
              $ref: '#/components/examples/InsufficientPermissions'
    TooManyRequests:
      description: Too Many Requests. The response body indicates whether the request was rejected due to per-minute rate limiting or monthly quota exhaustion.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error429'
          examples:
            RateLimitExceeded:
              $ref: '#/components/examples/RateLimitExceeded'
            QuotaExceeded:
              $ref: '#/components/examples/QuotaExceeded'
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error500'
          examples:
            InternalServerError:
              $ref: '#/components/examples/InternalServerError'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error409'
          examples:
            AccountConflict:
              $ref: '#/components/examples/AccountConflict'
            DuplicateKey:
              $ref: '#/components/examples/DuplicateKey'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error404'
          examples:
            NotFound:
              $ref: '#/components/examples/NotFound'
    SegmentRevisionListResponse:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - revisions
            properties:
              revisions:
                type: array
                items:
                  $ref: '#/components/schemas/SegmentRevision'
    SegmentBatchCreateResponse:
      description: Created
      content:
        application/json:
          schema:
            type: object
            required:
              - created
              - skipped
            properties:
              created:
                type: integer
                description: Number of segments successfully created
                example: 700
              skipped:
                type: integer
                description: Number of segments skipped because they already exist
                example: 15
x-tagGroups:
  - name: Core
    tags:
