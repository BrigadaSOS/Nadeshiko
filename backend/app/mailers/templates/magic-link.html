<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="supported-color-schemes" content="dark" />
    <title>Your Nadeshiko Login Link</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        line-height: 1.5;
        color: #e8e8e8;
        margin: 0;
        padding: 32px 16px;
        background-color: #1d1d1d;
      }
      .wrapper {
        max-width: 640px;
        margin: 0 auto;
      }
      .card {
        background-color: #252526;
        border: 1px solid #3c3c3c;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.5);
      }
      .card-header {
        background-color: #ef5552;
        padding: 20px 32px;
      }
      .card-header table {
        border-collapse: collapse;
      }
      .card-header img {
        width: 32px;
        height: 32px;
        border-radius: 7px;
        display: block;
      }
      .card-header-title {
        font-size: 18px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: -0.01em;
        padding-left: 14px;
      }
      .card-body {
        padding: 28px 32px 24px;
        text-align: center;
      }
      .card-title {
        font-size: 20px;
        font-weight: 700;
        color: #e8e8e8;
        margin: 0 0 12px;
        letter-spacing: -0.02em;
        text-align: left;
      }
      .card-text {
        font-size: 15px;
        color: #a8a8a8;
        margin: 0 0 24px;
        text-align: left;
      }
      .expiry-note {
        margin-top: 20px;
        font-size: 13px;
        color: #8a8a8a;
        line-height: 1.5;
        text-align: left;
      }
      .card-footer {
        background-color: #1d1d1d;
        border-top: 1px solid #3c3c3c;
        padding: 14px 32px;
        font-size: 12px;
        color: #8a8a8a;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="card">
        <div class="card-header">
          <table role="presentation"><tr>
            <td style="vertical-align: middle;"><img src="{{logoUrl}}" alt="Nadeshiko" /></td>
            <td style="vertical-align: middle;" class="card-header-title">Nadeshiko</td>
          </tr></table>
        </div>

        <div class="card-body">
          {{{copy.body}}}

          <a href="{{url}}" style="display: inline-block; background-color: #ef5552; color: #ffffff; text-decoration: none !important; padding: 12px 32px; border-radius: 8px; font-size: 15px; font-weight: 600; letter-spacing: 0.01em;">
            <span style="color: #ffffff; text-decoration: none !important;">Sign in to Nadeshiko</span>
          </a>

          {{{copy.fallback}}}
{{#code}}
          {{{copy.code}}}
          <p style="margin: 0 auto; text-align: center; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 30px; font-weight: 700; letter-spacing: 0.22em; color: #e8e8e8; background-color: #2c2c2c; border-radius: 8px; padding: 14px 20px;">{{code}}</p>
{{/code}}
          {{{copy.expiry}}}
          {{{copy.ignore}}}
        </div>

        <div class="card-footer">
          &copy; {{year}} Nadeshiko
        </div>
      </div>
    </div>
  </body>
</html>
