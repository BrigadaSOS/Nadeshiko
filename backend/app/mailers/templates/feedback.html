<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="supported-color-schemes" content="dark" />
    <title>New feedback</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        line-height: 1.5;
        color: #e8e8e8;
        margin: 0;
        padding: 32px 16px;
        background-color: #1d1d1d;
      }
      .wrapper {
        max-width: 640px;
        margin: 0 auto;
      }
      .card {
        background-color: #252526;
        border: 1px solid #3c3c3c;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.5);
      }
      .card-header {
        background-color: #ef5552;
        padding: 20px 32px;
      }
      .card-header table {
        border-collapse: collapse;
      }
      .card-header img {
        width: 32px;
        height: 32px;
        border-radius: 7px;
        display: block;
      }
      .card-header-title {
        font-size: 18px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: -0.01em;
        padding-left: 14px;
      }
      .card-body {
        padding: 28px 32px 24px;
      }
      .card-title {
        font-size: 20px;
        font-weight: 700;
        color: #e8e8e8;
        margin: 0 0 4px;
        letter-spacing: -0.02em;
      }
      .from {
        font-size: 14px;
        color: #a8a8a8;
        margin: 0 0 20px;
      }
      /* The message is what someone typed, so it keeps its own line breaks
         instead of being reflowed into one paragraph. `pre-wrap` also means a
         pasted stack trace stays readable without any markup in the value --
         which matters, because renderTemplate escapes it. */
      .message {
        font-family: inherit;
        font-size: 15px;
        color: #e8e8e8;
        background-color: #2c2c2c;
        border-radius: 6px;
        padding: 16px 20px;
        margin: 0 0 20px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .context {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        color: #a8a8a8;
        background-color: #1d1d1d;
        border: 1px solid #3c3c3c;
        border-radius: 6px;
        padding: 12px 16px;
        margin: 0;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .card-footer {
        background-color: #1d1d1d;
        border-top: 1px solid #3c3c3c;
        padding: 14px 32px;
        font-size: 12px;
        color: #8a8a8a;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="card">
        <div class="card-header">
          <table role="presentation"><tr>
            <td style="vertical-align: middle;"><img src="{{logoUrl}}" alt="Nadeshiko" /></td>
            <td style="vertical-align: middle;" class="card-header-title">Nadeshiko</td>
          </tr></table>
        </div>

        <div class="card-body">
          {{{copy.title}}}
          <p class="from">From {{from}}</p>

          <pre class="message">{{message}}</pre>

          <pre class="context">{{context}}</pre>
        </div>

        <div class="card-footer">
          &copy; {{year}} Nadeshiko
        </div>
      </div>
    </div>
  </body>
</html>
