image: brigadasos/nadeshiko-backend-prod
service: nadeshiko-backend-prod

servers:
  web:
    options:
      # Memory limit: 1.5GB RAM + 512MB swap
      # Current ~310MB, peaks ~1.2GB under load = 1.25x headroom
      memory: 1.5g
      memory-swap: 2g

proxy:
  ssl: true
  host: api.nadeshiko.co
  forward_headers: true
  # /up verifies Postgres before reporting healthy, so a container that boots
  # but cannot reach the database never takes traffic. Elasticsearch is reported
  # as a field and never fails the check -- see DEPLOYMENT.md.
  healthcheck:
    path: /up
    interval: 2
    timeout: 5

env:
  secret:
    - ALLOWED_WEBSITE_URLS
    - API_KEY_MASTER
    - BETTER_AUTH_SECRET
    - INTERNAL_PROXY_SECRET
    - LOG_USER_SALT

    # Parsing. `parseSegments` is the only caller and it throws without a key, so
    # an unset one does not break boot -- it breaks the next episode ingest, and
    # the corpus backfill that has to run before the pos_analysis drop lands.
    - SHIRABE_API_KEY

    # Account linking. Encrypts the per-reader Shirabe keys at rest and seals the
    # OAuth state. Unset means readers simply cannot link an account (the routes
    # answer that it is not configured); it never breaks boot, and it must never
    # be rotated without re-encrypting what is stored, or every linked account
    # stops working at once.
    - SHIRABE_CONNECTION_SECRET
    # Our client secret at Shirabe (a confidential OAuth client): presented on
    # every token exchange, renewal and revocation. Unset, Shirabe refuses us as
    # a client and linking is off.
    - SHIRABE_OAUTH_CLIENT_SECRET

    - EMAIL_API_NADEDB
    - USERNAME_API_NADEDB
    - UUID_NAMESPACE

    - POSTGRES_USER
    - POSTGRES_PASSWORD
    - POSTGRES_DB

    - ELASTICSEARCH_USER
    - ELASTICSEARCH_PASSWORD

    - DISCORD_CLIENT_ID
    - DISCORD_CLIENT_SECRET

    - ID_OAUTH_GOOGLE
    - SECRET_OAUTH_GOOGLE

    - SES_AWS_REGION
    - SES_AWS_ACCESS_KEY_ID
    - SES_AWS_SECRET_ACCESS_KEY
    - SES_FROM_EMAIL
    - SES_FROM_NAME
    - SMTP_PASSWORD

    - E2E_USER_PASSWORD

  clear:
    ENVIRONMENT: production
    PORT: 80
    RUN_MIGRATIONS_ON_BOOT: "true"
    BASE_URL: https://nadeshiko.co

    # Prod sends via smtp.zeptomail.jp. Flip back to ses to roll back;
    # SES DKIM and mail.nadeshiko.co stay in DNS either way.
    MAIL_TRANSPORT: zepto
    SMTP_ADDRESS: smtp.zeptomail.jp
    SMTP_PORT: "587"
    SMTP_USER_NAME: emailapikey

    # Where the feedback widget's notification lands. UNSET IS SILENT: the row is
    # still stored, but `sendFeedbackEmail` logs "FEEDBACK_NOTIFICATION_TO unset"
    # and returns, which is how feedback #1 was submitted on 2026-08-19 and read
    # by nobody until someone queried the table.
    #
    # This is not a mailbox. `nadeshiko.co` inbound goes to the Cloudflare Email
    # Routing catch-all, whose worker (brigadasos-infra/email-worker) forwards to
    # the addresses in its FORWARD_TO and posts a copy to Discord -- so delivery
    # depends on those staying verified destinations over there, not on anything
    # in this repo. The reader's own address rides on Reply-To, so replying from
    # a forwarded copy reaches them rather than this alias.
    FEEDBACK_NOTIFICATION_TO: support@nadeshiko.co

    # What Shirabe has us registered as. The redirect is exact-matched over
    # there, so this string and the one in their `oauth_clients` row have to be
    # character-for-character the same or the consent screen refuses the request.
    SHIRABE_OAUTH_CLIENT_ID: nadeshiko
    SHIRABE_OAUTH_REDIRECT_URI: https://nadeshiko.co/link/shirabe/callback

    POSTGRES_HOST: "nadeshiko-backend-prod-postgres"
    POSTGRES_PORT: 5432

    ELASTICSEARCH_HOST: "http://nadeshiko-backend-prod-elasticsearch:9200"
    ELASTICSEARCH_INDEX: nadedb_prod

    R2_BASE_URL: https://cdn.nadeshiko.co

    # Counts accounts server-side, so a reader whose content blocker eats the
    # browser's signup event is still counted. `clear` rather than `secret`
    # deliberately: this is the PostHog project write key, it can only submit
    # events, and the frontend already ships the same string in its bundle --
    # putting it behind a secret would imply a confidentiality it does not have.
    #
    # Production only, for the same reason the frontend leaves the PostHog module
    # out of every other environment: staging traffic must not land in the project
    # that answers questions about real readers. Unset disables capture entirely.
    POSTHOG_API_KEY: phc_vLnds6vZY3nKs6ZenhLnxSHTbYYH4EdS8zJ8mrBvHtjD
    POSTHOG_HOST: https://us.i.posthog.com

    OTEL_EXPORTER_OTLP_ENDPOINT: "http://host.docker.internal:4328"
    OTEL_SERVICE_NAME: nadeshiko-backend-prod
    OTEL_SEMCONV_STABILITY_OPT_IN: http
    # `service.version` read 0.0.0 on every deployed build, because
    # instrumentation.ts took it from npm_package_version and the container's
    # CMD is a bare `node`, which npm never sets it for. Read package.json here
    # instead -- kamal runs from `backend/`, so this is the same file the image
    # was built from. String scan rather than JSON.parse: the ERB binding is
    # Kamal's, and a missing constant here would abort the deploy at config
    # load. Kamal renders this at deploy time, so it cannot drift from the tag.
    OTEL_SERVICE_VERSION: <%= File.read("package.json")[/"version":\s*"([^"]+)"/, 1] %>

accessories:
  postgres:
    image: postgres:17
    host: nadeshiko
    # Tailnet address of the `nadeshiko` host. This is a moving target: it was
    # 100.95.40.11 when written and the host now answers on 100.114.126.96, with
    # dockerd left holding a socket bound to an address the box no longer had.
    # Nothing here broke only because of the loopback publish below, which is
    # what the Alloy exporter actually dials. Keep both.
    port: "100.114.126.96:5432:5432"
    options:
      # Memory limit: 1.5GB. Postgres persists to disk, so it is safe to
      # OOM-kill and restart -- but a restart drops every pooled connection, so
      # cheap is not the same as free.
      #
      # RAISED FROM 1g 2026-08-14, on the shape of the usage rather than its
      # average. Steady state is ~200MB and the old comment's "3x headroom" was
      # true of that number; what it missed is that this container is spiky.
      # Measured over 24h: baseline ~200MB, an hourly-averaged excursion to
      # 703MB, and a 1-minute peak of 975MB -- 95% of the old 1g cap. It spent
      # 2 minutes above 90%, which is why NadeshikoContainerMemoryNearLimit
      # (90%, for 15m) never said a word about it.
      #
      # Nothing was killed, and most of that peak is reclaimable page cache over
      # the data files rather than anonymous memory. The cap goes up anyway: a
      # transient that reaches 95% only has to be slightly larger to be a kill,
      # and the checkpoint/backup shape that produces it is not something we
      # control from here.
      memory: 1.5g
      publish:
        # Loopback as well as the tailnet address above. This is the only reason
        # the Alloy Postgres exporter kept working through the IP change, and it
        # is why Elasticsearch — which had no equivalent — did not.
        - "127.0.0.1:5432:5432"
      # Accessories get no logging defaults from Kamal, so auto_explain output
      # would grow unbounded on the host disk.
      log-driver: json-file
      log-opt:
        - max-size=20m
        - max-file=5
    cmd: >
      -c shared_preload_libraries='pg_stat_statements,auto_explain'
      -c pg_stat_statements.track=all
      -c auto_explain.log_min_duration=1000
    env:
      secret:
        - POSTGRES_USER:POSTGRES_ADMIN_USER
        - POSTGRES_PASSWORD:POSTGRES_ADMIN_PASSWORD
        - POSTGRES_DB
    volumes:
      - nadeshiko-postgres-data:/var/lib/postgresql/data

  elasticsearch:
    image: <%= ENV.fetch("ELASTICSEARCH_IMAGE", "ghcr.io/brigadasos/nadeshiko-elasticsearch:9.4.1-sudachi-3.6.0-dict-20260116") %>
    host: nadeshiko
    # See the note on postgres above: this pinned 100.95.40.11, the host's old
    # tailnet address, and unlike postgres there was no second publish to fall
    # back on. The Alloy Elasticsearch exporter timed out against it for weeks —
    # every scrape failing, no elasticsearch_* series, and nothing alerting
    # because a target that never reports looks the same as one that does not
    # exist. ES itself was fine the whole time; only the door was.
    port: "100.114.126.96:9200:9200"
    env:
      secret:
        - ELASTICSEARCH_ADMIN_PASSWORD
      clear:
        discovery.type: single-node
        ES_JAVA_OPTS: "-Xms1g -Xmx1g"
        xpack.security.enabled: "true"
        xpack.security.http.ssl.enabled: "false"
        http.host: "0.0.0.0"
    volumes:
      # Overridable so a specific image digest can be pinned for a boot -- which
      # is how the blue-green migration attached the rebuilt v9 image. The
      # default is the volume production runs on.
      - <%= ENV.fetch("ELASTICSEARCH_VOLUME", "nadeshiko-elasticsearch-v9-data") %>:/usr/share/elasticsearch/data
    cmd: >
      bash -c '
        export ELASTIC_PASSWORD="$ELASTICSEARCH_ADMIN_PASSWORD";
        ./bin/elasticsearch
      '
    options:
      # Memory limit: 3.5GB (current ~2.7GB, 800MB headroom for growth)
      # JVM heap fixed at 1GB via ES_JAVA_OPTS; rest is Lucene off-heap
      memory: 3.5g
      publish:
        # The loopback publish Postgres always had and this never did, which is
        # the whole difference between an exporter that survived the tailnet IP
        # change and one that did not. The Alloy Elasticsearch exporter dials
        # http://127.0.0.1:9200 deliberately, so that it stops depending on an
        # address that moves.
        #
        # That exporter lives in brigadasos-infra at
        # ansible/roles/host_alloy/files/config-nadeshiko.alloy. Alloy runs there
        # as a host service rather than a container -- a containerised collector
        # cannot report on Docker failing -- so it dials this loopback directly
        # from the host, which is exactly what publishing it here provides.
        - "127.0.0.1:9200:9200"
      ulimit:
        - nofile=65536:65536
        - memlock=-1:-1
      log-driver: json-file
      log-opt:
        - max-size=20m
        - max-file=5

  pg-backup:
    image: kartoza/pg-backup:17-3.5
    host: nadeshiko
    options:
      log-driver: json-file
      log-opt:
        - max-size=20m
        - max-file=5
    env:
      clear:
        CRON_SCHEDULE: "0 2 * * *"
        REMOVE_BEFORE: "30"
        # Prod only. Staging shares this Postgres server, and with DBLIST unset
        # kartoza dumps every database on it -- so the bucket was also collecting
        # a nightly ~1.2GB dump of nadeshiko-dev, which is disposable data we
        # would never restore.
        DBLIST: "nadeshiko-prod"
        STORAGE_BACKEND: "S3"
        CONSOLE_LOGGING: "True"
        SSL_SECURE: "True"
        POSTGRES_MAJOR_VERSION: "17"
        POSTGRES_HOST: "nadeshiko-backend-prod-postgres"
        POSTGRES_PORT: "5432"
        DEFAULT_REGION: "auto"
      secret:
        - POSTGRES_USER:POSTGRES_ADMIN_USER
        - POSTGRES_PASS:POSTGRES_ADMIN_PASSWORD
        - ACCESS_KEY_ID:R2_BACKUP_ACCESS_KEY_ID
        - SECRET_ACCESS_KEY:R2_BACKUP_SECRET_ACCESS_KEY
        - BUCKET:R2_BACKUP_BUCKET
        - HOST_BASE:R2_BACKUP_HOST_BASE
        - HOST_BUCKET:R2_BACKUP_HOST_BUCKET
