image: nadeshiko-devs/nadeshiko-backend-prod
service: nadeshiko-backend-prod

servers:
  web:
    options:
      # Memory limit: 1.5GB RAM + 512MB swap
      # Current ~310MB, peaks ~1.2GB under load = 1.25x headroom
      memory: 1.5g
      memory-swap: 2g
      # Repeated from deploy.yml, which this block replaces -- see the note there.
      init: true

proxy:
  # Leave the Tailscale address available for the private Caddy proxy.
  run:
    bind_ips: [127.0.0.1, 172.17.0.1]
  ssl: true
  host: api.nadeshiko.co
  forward_headers: true
  # /up requires Postgres before declaring health; Elasticsearch is reported but does not gate readiness.
  healthcheck:
    path: /up
    interval: 2
    timeout: 5

env:
  secret:
    - ALLOWED_WEBSITE_URLS
    - API_KEY_MASTER
    - BETTER_AUTH_SECRET
    - INTERNAL_PROXY_SECRET
    - LOG_USER_SALT

    # Ingest and backfill need this parsing key to populate token morphology.
    - SHIRABE_API_KEY

    # Account linking encrypts reader tokens and OAuth state; unset disables linking. Retain the previous key until
    # stored tokens are re-encrypted.
    - SHIRABE_CONNECTION_SECRET
    # Confidential Shirabe client secret used for token exchange, renewal, and revocation; unset disables linking.
    - SHIRABE_OAUTH_CLIENT_SECRET
    # Patreon linking is intentionally disabled until the feature is launched.
    # Its configuration defaults to empty, which keeps the routes unavailable.

    - EMAIL_API_NADEDB
    - USERNAME_API_NADEDB
    - UUID_NAMESPACE

    - POSTGRES_USER
    - POSTGRES_PASSWORD
    - POSTGRES_DB

    - ELASTICSEARCH_USER
    - ELASTICSEARCH_PASSWORD

    - DISCORD_CLIENT_ID
    - DISCORD_CLIENT_SECRET

    - ID_OAUTH_GOOGLE
    - SECRET_OAUTH_GOOGLE

    - MAIL_FROM_EMAIL
    - MAIL_FROM_NAME
    - SMTP_PASSWORD
    # ZeptoMail webhook secret: invalid/missing signatures return 503 instead of accepting forged bounces that could
    # suppress an address and block magic-link sign-in.
    - ZEPTOMAIL_WEBHOOK_SECRET
    # Lifting a suppression has two halves: our row and ZeptoMail's own list.
    # These are the second half, scoped to delete-only.
    - ZOHO_CLIENT_ID
    - ZOHO_CLIENT_SECRET
    - ZOHO_REFRESH_TOKEN

    - E2E_USER_PASSWORD

  clear:
    ENVIRONMENT: production
    RELEASE_SHA: <%= ENV.fetch("VERSION", "unknown") %>
    PORT: 80
    RUN_MIGRATIONS_ON_BOOT: "true"
    BASE_URL: https://nadeshiko.co
    PATREON_CAMPAIGN_URL: https://www.patreon.com/c/BrigadaSOS

    # ZeptoMail is the only transport; the retired SES branch and its static AWS credentials are gone.
    SMTP_ADDRESS: smtp.zeptomail.jp
    SMTP_PORT: "587"
    SMTP_USER_NAME: emailapikey

    # Feedback notifications are optional: the row is stored even when the destination is unset. The configured alias is
    # forwarded by the external Cloudflare worker; Reply-To preserves the reader address.
    FEEDBACK_NOTIFICATION_TO: support@nadeshiko.co

    # Keep ONLY_TO unset in production; preview with email:test before enabling real sends. Disabling stops future sends
    # without consuming claims; candidate timing still governs later eligibility.
    LIFECYCLE_EMAILS_ENABLED: "true"

    # Shirabe exact-matches this redirect URI against the registered client. Both values must match
    # character-for-character.
    SHIRABE_OAUTH_CLIENT_ID: nadeshiko
    SHIRABE_OAUTH_REDIRECT_URI: https://nadeshiko.co/link/shirabe/callback

    POSTGRES_HOST: "nadeshiko-backend-prod-postgres"
    POSTGRES_PORT: 5432

    ELASTICSEARCH_HOST: "http://nadeshiko-backend-prod-elasticsearch:9200"
    ELASTICSEARCH_INDEX: nadedb_prod

    R2_BASE_URL: https://cdn.nadeshiko.co

    # PostHog counts signups server-side; this public project write key is clear because the frontend ships it too.
    # Production only prevents staging traffic entering real-reader analytics; unset disables capture.
    POSTHOG_API_KEY: phc_vLnds6vZY3nKs6ZenhLnxSHTbYYH4EdS8zJ8mrBvHtjD
    POSTHOG_HOST: https://us.i.posthog.com

    OTEL_EXPORTER_OTLP_ENDPOINT: "http://host.docker.internal:4328"
    OTEL_SERVICE_NAME: nadeshiko-backend-prod
    OTEL_SEMCONV_STABILITY_OPT_IN: http
    # Read the package version here because bare node does not set npm_package_version; Kamal renders this from
    # backend/package.json at deploy time, keeping service.version aligned with the tag.
    OTEL_SERVICE_VERSION: <%= File.read("package.json")[/"version":\s*"([^"]+)"/, 1] %>

accessories:
  postgres:
    image: postgres:17
    host: nadeshiko
    # Shared by production and staging: coordinate maintenance because rebooting it interrupts both. The host address
    # can move; keep the loopback publish because Alloy dials that stable local endpoint.
    port: "100.117.43.6:5432:5432"
    options:
      # OOM restarts Postgres and drops pooled connections; leave headroom for query bursts, not just idle use.
      memory: 1.5g
      # Docker defaults /dev/shm to 64MB; parallel Postgres workers can exhaust it. This bounded increase leaves worker
      # headroom, while the query/index fix remains the primary remedy.
      shm-size: 256m
      publish:
        # Publish loopback as well as the tailnet address so the Alloy Postgres exporter survives host-IP changes.
        - "127.0.0.1:5432:5432"
      # Accessories get no logging defaults from Kamal, so auto_explain output
      # would grow unbounded on the host disk.
      log-driver: json-file
      log-opt:
        - max-size=20m
        - max-file=5
    cmd: >
      -c shared_preload_libraries='pg_stat_statements,auto_explain'
      -c pg_stat_statements.track=all
      -c auto_explain.log_min_duration=1000
    # Use POSTGRES_PASSWORD_FILE, not env: inspect/proc expose values, and the image rejects both password forms. This
    # is exposure hygiene, not a host-root boundary; rotate passwords already exposed. Accessory changes require a
    # production Postgres reboot, not an app deploy. The file initializes empty volumes only.
    files:
      - config/postgres/admin-password.erb:/run/secrets/postgres-admin-password
    env:
      clear:
        POSTGRES_PASSWORD_FILE: /run/secrets/postgres-admin-password
      secret:
        - POSTGRES_USER:POSTGRES_ADMIN_USER
        - POSTGRES_DB
    volumes:
      - nadeshiko-postgres-data:/var/lib/postgresql/data

  elasticsearch:
    image: <%= ENV.fetch("ELASTICSEARCH_IMAGE", "ghcr.io/nadeshiko-devs/nadeshiko-elasticsearch:9.4.1-sudachi-3.6.0-dict-20260116") %>
    host: nadeshiko
     # Publish a loopback endpoint so exporters do not depend on a changing tailnet address.
    port: "100.117.43.6:9200:9200"
    env:
      secret:
        - ELASTICSEARCH_ADMIN_PASSWORD
      clear:
        discovery.type: single-node
        ES_JAVA_OPTS: "-Xms1g -Xmx1g"
         # Lock heap pages to avoid swap stalls; accessory changes take effect only after reboot.
        bootstrap.memory_lock: "true"
        xpack.security.enabled: "true"
        xpack.security.http.ssl.enabled: "false"
        http.host: "0.0.0.0"
    volumes:
       # Override the volume for a pinned image during a migration; otherwise use the production data volume.
      - <%= ENV.fetch("ELASTICSEARCH_VOLUME", "nadeshiko-elasticsearch-v9-data") %>:/usr/share/elasticsearch/data
    cmd: >
      bash -c '
        export ELASTIC_PASSWORD="$ELASTICSEARCH_ADMIN_PASSWORD";
        ./bin/elasticsearch
      '
    options:
      # Memory limit: 3.5GB (current ~2.7GB, 800MB headroom for growth)
      # JVM heap fixed at 1GB via ES_JAVA_OPTS; rest is Lucene off-heap
      memory: 3.5g
      publish:
         # Publish loopback for the host Alloy exporter; its host-service configuration dials 127.0.0.1 rather than the
         # moving tailnet address.
        - "127.0.0.1:9200:9200"
      ulimit:
        - nofile=65536:65536
        - memlock=-1:-1
      log-driver: json-file
      log-opt:
        - max-size=20m
        - max-file=5

  pg-backup:
    image: kartoza/pg-backup:17-3.5
    host: nadeshiko
    options:
      log-driver: json-file
      log-opt:
        - max-size=20m
        - max-file=5
    env:
      clear:
        CRON_SCHEDULE: "0 2 * * *"
        REMOVE_BEFORE: "30"
         # Production only: without DBLIST, this shared backup service also dumps staging databases.
        DBLIST: "nadeshiko-prod"
        STORAGE_BACKEND: "S3"
        CONSOLE_LOGGING: "True"
        SSL_SECURE: "True"
        POSTGRES_MAJOR_VERSION: "17"
        POSTGRES_HOST: "nadeshiko-backend-prod-postgres"
        POSTGRES_PORT: "5432"
        DEFAULT_REGION: "auto"
      secret:
        - POSTGRES_USER:POSTGRES_ADMIN_USER
        - POSTGRES_PASS:POSTGRES_ADMIN_PASSWORD
        - ACCESS_KEY_ID:R2_BACKUP_ACCESS_KEY_ID
        - SECRET_ACCESS_KEY:R2_BACKUP_SECRET_ACCESS_KEY
        - BUCKET:R2_BACKUP_BUCKET
        - HOST_BASE:R2_BACKUP_HOST_BASE
        - HOST_BUCKET:R2_BACKUP_HOST_BUCKET
