servers:
  web:
    hosts:
      - nadeshiko
    options:
      add-host: host.docker.internal:host-gateway

registry:
  server: ghcr.io
  username: kamal
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

ssh:
  user: docker

# Kamal defaults to a single 10m json-file with no rotation history, which
# truncates away the context around an incident. Accessories get no log options
# at all by default, so each one sets these explicitly under `options`.
logging:
  driver: json-file
  options:
    max-size: 20m
    max-file: 5

aliases:
  console: app exec -i bash
  logs: app logs -f
