servers:
  web:
    hosts:
      - nadeshiko
    options:
      add-host: host.docker.internal:host-gateway
      # An init as PID 1, so orphans get reaped. Node is PID 1 without it and
      # Node does not reap: the container's own healthcheck leaves its child
      # re-parented to Node whenever a check times out under load, and it stays
      # a zombie until the container dies (49 counted across the frontend and
      # backend containers on 2026-08-31, all from overloaded minutes). Kamal
      # REPLACES this block from the per-destination file rather than merging
      # it, so `init` is repeated there.
      init: true

registry:
  server: ghcr.io
  username: kamal
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  # The image installs from the workspace lockfile, so the build context is the
  # repository root rather than this app's directory. CI builds separately and
  # deploys with --skip-push, so without this a plain `kamal deploy` fails on a
  # missing /package-lock.json while CI stays green.
  context: ..
  dockerfile: Dockerfile

ssh:
  user: docker

# Kamal defaults to a single 10m json-file with no rotation history, which
# truncates away the context around an incident. Accessories get no log options
# at all by default, so each one sets these explicitly under `options`.
logging:
  driver: json-file
  options:
    max-size: 20m
    max-file: 5

aliases:
  console: app exec -i bash
  logs: app logs -f
