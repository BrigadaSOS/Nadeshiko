servers:
  web:
    hosts:
      - nadeshiko
    options:
      add-host: host.docker.internal:host-gateway
      # init=true lets PID 1 reap healthcheck orphans. Kamal replaces, rather than merges, this block in per-destination
      # files, so keep the setting there too.
      init: true

registry:
  server: ghcr.io
  username: kamal
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  # Build context is the repository root for the workspace lockfile; CI deploys with --skip-push, so Kamal needs it too.
  context: ..
  dockerfile: Dockerfile

ssh:
  user: docker

# Set log rotation explicitly: Kamal has limited defaults for the app and none for accessories.
logging:
  driver: json-file
  options:
    max-size: 20m
    max-file: 5

aliases:
  console: app exec -i bash
  logs: app logs -f
