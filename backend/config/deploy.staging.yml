service: nadeshiko-backend-stg
image: brigadasos/nadeshiko-backend-stg

servers:
  web:
    options:
      # Memory limit: 1.5GB RAM + 256MB swap for stg
      memory: 1.5g
      memory-swap: 1.75g

proxy:
  ssl: true
  host: api-stg.nadeshiko.co
  forward_headers: true

env:
  secret:
    - ALLOWED_WEBSITE_URLS
    - API_KEY_MASTER
    - BETTER_AUTH_SECRET
    - INTERNAL_PROXY_SECRET

    - EMAIL_API_NADEDB
    - USERNAME_API_NADEDB
    - UUID_NAMESPACE

    - POSTGRES_USER
    - POSTGRES_PASSWORD
    - POSTGRES_DB

    - ELASTICSEARCH_USER
    - ELASTICSEARCH_PASSWORD

    - DISCORD_CLIENT_ID
    - DISCORD_CLIENT_SECRET

    - ID_OAUTH_GOOGLE
    - SECRET_OAUTH_GOOGLE

    - SES_AWS_REGION
    - SES_AWS_ACCESS_KEY_ID
    - SES_AWS_SECRET_ACCESS_KEY
    - SES_FROM_EMAIL
    - SES_FROM_NAME

    - E2E_USER_PASSWORD

  clear:
    ENVIRONMENT: development
    PORT: 80
    RUN_MIGRATIONS_ON_BOOT: "true"
    BASE_URL: https://stg.nadeshiko.co

    POSTGRES_HOST: "nadeshiko-backend-prod-postgres"
    POSTGRES_PORT: 5432

    ELASTICSEARCH_HOST: "http://nadeshiko-backend-stg-elasticsearch:9200"
    ELASTICSEARCH_INDEX: nadedb_dev

    R2_BASE_URL: https://cdn.nadeshiko.co

    OTEL_EXPORTER_OTLP_ENDPOINT: "http://host.docker.internal:4328"
    OTEL_SERVICE_NAME: nadeshiko-backend-stg
    OTEL_SEMCONV_STABILITY_OPT_IN: http

accessories:
  elasticsearch:
    image: <%= ENV.fetch("ELASTICSEARCH_IMAGE", "ghcr.io/brigadasos/nadeshiko-elasticsearch:9.4.1-sudachi-3.6.0-dict-20260116") %>
    host: nadeshiko
    env:
      secret:
        - ELASTICSEARCH_ADMIN_PASSWORD
        - ELASTIC_PASSWORD
      clear:
        discovery.type: single-node
        ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        xpack.security.enabled: "true"
        xpack.security.http.ssl.enabled: "false"
        http.host: "0.0.0.0"
    volumes:
      - nadeshiko-elasticsearch-stg-v9-data:/usr/share/elasticsearch/data
    options:
      # Isolated staging canary; sized for functional validation, not production load.
      memory: 2g
      memory-swap: 2.5g
      ulimit:
        - nofile=65536:65536
        - memlock=-1:-1

