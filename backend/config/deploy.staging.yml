service: nadeshiko-backend-stg
image: brigadasos/nadeshiko-backend-stg

servers:
  web:
    options:
       # Bound staging memory on the shared host to reduce OOM risk for production database and search services.
      memory: 768m
      memory-swap: 1g
       # Bound deploy and E2E load: staging shares the host and production database/search accessories.
      cpus: "0.5"

proxy:
  # Leave the Tailscale address available for the private Caddy proxy.
  run:
    bind_ips: [127.0.0.1, 172.17.0.1]
  ssl: true
  host: api-stg.nadeshiko.co
  forward_headers: true
  # /up requires Postgres before declaring health; Elasticsearch is reported but does not gate readiness.
  healthcheck:
    path: /up
    interval: 2
    timeout: 5

env:
  secret:
    - ALLOWED_WEBSITE_URLS
    - API_KEY_MASTER
    - BETTER_AUTH_SECRET
    - INTERNAL_PROXY_SECRET
    - LOG_USER_SALT

    - EMAIL_API_NADEDB
    - USERNAME_API_NADEDB
    - UUID_NAMESPACE

    - POSTGRES_USER
    - POSTGRES_PASSWORD
    - POSTGRES_DB

    - ELASTICSEARCH_USER
    - ELASTICSEARCH_PASSWORD

    - DISCORD_CLIENT_ID
    - DISCORD_CLIENT_SECRET

    - ID_OAUTH_GOOGLE
    - SECRET_OAUTH_GOOGLE

    - MAIL_FROM_EMAIL
    - MAIL_FROM_NAME
    - SES_AWS_ACCESS_KEY_ID
    - SES_AWS_SECRET_ACCESS_KEY
    # SNS authenticates to /v1/webhooks/ses with this as its basic-auth password; unset refuses every delivery rather
    # than accept forged bounces that could suppress an address and block magic-link sign-in.
    - SES_WEBHOOK_SECRET

    - E2E_USER_PASSWORD

    - SHIRABE_API_KEY

     # Staging needs its own Shirabe registration and secret: the redirect is hostname-specific and separates decryption
     # between environments.
    - SHIRABE_CONNECTION_SECRET
     # Confidential Shirabe client secret used for token exchange, renewal, and revocation; unset disables linking.
    - SHIRABE_OAUTH_CLIENT_SECRET
    # Patreon linking is intentionally disabled until the feature is launched.
    # Its configuration defaults to empty, which keeps the routes unavailable.

  clear:
    ENVIRONMENT: development
    RELEASE_SHA: <%= ENV.fetch("VERSION", "unknown") %>
    PORT: 80
    RUN_MIGRATIONS_ON_BOOT: "true"
    BASE_URL: https://stg.nadeshiko.co
    PATREON_CAMPAIGN_URL: https://www.patreon.com/c/BrigadaSOS

    # Amazon SES is the only transport. Staging has its own configuration set and topic, so its bounces land in the
    # staging database, not production's (nadeshiko-infra/terraform/aws-ses.tf).
    SES_CONFIGURATION_SET: nadeshiko-staging
    SES_SNS_TOPIC_ARN: arn:aws:sns:eu-north-1:853812853385:nadeshiko-ses-events-staging

     # Lifecycle mail stays off: staging may contain real addresses and shares production sending infrastructure. If
     # testing it, require ONLY_TO and preview with email:test.
    LIFECYCLE_EMAILS_ENABLED: "false"

    # Its own client on Shirabe, not production's: the redirect is exact-matched,
    # so one registration cannot cover two hostnames.
    SHIRABE_OAUTH_CLIENT_ID: nadeshiko-staging
    SHIRABE_OAUTH_REDIRECT_URI: https://stg.nadeshiko.co/link/shirabe/callback

    POSTGRES_HOST: "nadeshiko-backend-prod-postgres"
    POSTGRES_PORT: 5432

     # Staging shares production Elasticsearch to save memory, but its destructive commands can reach that server.
     # Separate indices/aliases reduce the blast radius; the machine-level isolation is intentionally absent.
    ELASTICSEARCH_HOST: "http://nadeshiko-backend-prod-elasticsearch:9200"
    ELASTICSEARCH_INDEX: nadedb_dev

    R2_BASE_URL: https://cdn.nadeshiko.co

    OTEL_EXPORTER_OTLP_ENDPOINT: "http://host.docker.internal:4328"
    OTEL_SERVICE_NAME: nadeshiko-backend-stg
    OTEL_SEMCONV_STABILITY_OPT_IN: http
     # Read package.json at deploy time so staging service.version is identifiable instead of 0.0.0.
    OTEL_SERVICE_VERSION: <%= File.read("package.json")[/"version":\s*"([^"]+)"/, 1] %>
