service: nadeshiko-backend-stg
image: brigadasos/nadeshiko-backend-stg

servers:
  web:
    options:
      # Memory limit: 1.5GB RAM + 256MB swap for stg
      memory: 1.5g
      memory-swap: 1.75g

proxy:
  ssl: true
  host: api-stg.nadeshiko.co
  forward_headers: true
  # /up verifies Postgres before reporting healthy, so a container that boots
  # but cannot reach the database never takes traffic. Elasticsearch is reported
  # as a field and never fails the check -- see DEPLOYMENT.md.
  healthcheck:
    path: /up
    interval: 2
    timeout: 5

env:
  secret:
    - ALLOWED_WEBSITE_URLS
    - API_KEY_MASTER
    - BETTER_AUTH_SECRET
    - INTERNAL_PROXY_SECRET

    - EMAIL_API_NADEDB
    - USERNAME_API_NADEDB
    - UUID_NAMESPACE

    - POSTGRES_USER
    - POSTGRES_PASSWORD
    - POSTGRES_DB

    - ELASTICSEARCH_USER
    - ELASTICSEARCH_PASSWORD

    - DISCORD_CLIENT_ID
    - DISCORD_CLIENT_SECRET

    - ID_OAUTH_GOOGLE
    - SECRET_OAUTH_GOOGLE

    - SES_AWS_REGION
    - SES_AWS_ACCESS_KEY_ID
    - SES_AWS_SECRET_ACCESS_KEY
    - SES_FROM_EMAIL
    - SES_FROM_NAME

    - E2E_USER_PASSWORD

    - SHIRABE_API_KEY

  clear:
    ENVIRONMENT: development
    PORT: 80
    RUN_MIGRATIONS_ON_BOOT: "true"
    BASE_URL: https://stg.nadeshiko.co

    POSTGRES_HOST: "nadeshiko-backend-prod-postgres"
    POSTGRES_PORT: 5432

    # Staging shares PRODUCTION's Elasticsearch server, keeping its own index
    # (`nadedb_dev`). Two servers on one 7.7 GB host cost ~1 GB of RAM to serve
    # two indices, on a box that was already ~2 GB into swap.
    #
    # The trade, stated plainly: a destructive command typed against staging now
    # reaches the production Elasticsearch. Index names keep the data apart and
    # `bin/es.ts` scopes itself to its own alias, but the isolation is real and
    # it is gone. Accepted for the memory.
    ELASTICSEARCH_HOST: "http://nadeshiko-backend-prod-elasticsearch:9200"
    ELASTICSEARCH_INDEX: nadedb_dev

    R2_BASE_URL: https://cdn.nadeshiko.co

    OTEL_EXPORTER_OTLP_ENDPOINT: "http://host.docker.internal:4328"
    OTEL_SERVICE_NAME: nadeshiko-backend-stg
    OTEL_SEMCONV_STABILITY_OPT_IN: http
    # See the note in deploy.prod.yml -- staging reported 0.0.0 for the same
    # reason, and a staging build you cannot identify is the one you are most
    # likely to be comparing against.
    OTEL_SERVICE_VERSION: <%= File.read("package.json")[/"version":\s*"([^"]+)"/, 1] %>

