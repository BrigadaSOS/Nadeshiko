# Alerts on host-side facts that nothing currently exports: Elasticsearch
# cluster health, Postgres backup freshness, and container restart churn. The
# `nadeshiko` host runs no node_exporter, no cAdvisor and no Elasticsearch or
# Postgres exporter — the node_*/container_* series in this VictoriaMetrics
# belong to a different host.
#
# Rather than install three exporters for six numbers, one cron script on the
# host publishes them: infra/monitoring/scripts/publish-host-metrics.sh. Until
# it is installed (see infra/monitoring/README.md) every rule in this group
# evaluates against nothing and vmalert reports the group as `noMatch`. That is
# expected, and NadeshikoHostMetricsMissing below is what makes it visible
# instead of looking like health.

groups:
  - name: nadeshiko-host
    interval: 1m
    rules:
      # The publisher is the single point of failure for this whole group, so it
      # gets a heartbeat. absent() covers "never installed" and "stopped
      # reporting long enough for the series to age out"; the timestamp
      # comparison covers "still there but stalled".
      - alert: NadeshikoHostMetricsMissing
        expr: absent(nadeshiko_host_metrics_last_success_timestamp_seconds)
        for: 30m
        labels:
          severity: warning
          service: nadeshiko-host
        annotations:
          summary: "No host metrics from the nadeshiko host"
          description: >-
            publish-host-metrics.sh has never reported, or stopped long enough for its
            series to expire. Every other alert in the nadeshiko-host group is blind
            until it is back. See infra/monitoring/README.md.

      - alert: NadeshikoHostMetricsStale
        expr: time() - nadeshiko_host_metrics_last_success_timestamp_seconds > 1800
        for: 10m
        labels:
          severity: warning
          service: nadeshiko-host
        annotations:
          summary: "Host metrics from the nadeshiko host are stale"
          description: >-
            The last successful publish was {{ $value | humanizeDuration }} ago; the
            cron runs every 5 minutes.

      - alert: NadeshikoElasticsearchDown
        expr: nadeshiko_elasticsearch_up{environment="prod"} == 0
        for: 10m
        labels:
          severity: critical
          service: nadeshiko-elasticsearch
        annotations:
          summary: "Production Elasticsearch is not answering"
          description: >-
            The cluster health endpoint has been unreachable or failing for 10 minutes.
            Search is degraded but the API stays up by design — `/up` reports
            `"elasticsearch":"down"` and still returns 200, so this alert is the only
            thing that will tell you.
          runbook: DEPLOYMENT.md#recovering-elasticsearch

      - alert: NadeshikoElasticsearchClusterRed
        expr: nadeshiko_elasticsearch_cluster_status{environment="prod"} == 2
        for: 10m
        labels:
          severity: critical
          service: nadeshiko-elasticsearch
        annotations:
          summary: "Production Elasticsearch cluster is red"
          description: >-
            At least one primary shard is unassigned. On a single-node cluster this
            usually means a corrupt or unopenable index rather than a lost replica.
            The index is derived data: recovery is a reindex from Postgres.
          runbook: DEPLOYMENT.md#recovering-elasticsearch

      # Yellow is the steady state on a single-node cluster (replicas can never
      # be assigned), so it is deliberately not an alert.

      - alert: NadeshikoPostgresBackupStale
        expr: time() - nadeshiko_postgres_backup_last_success_timestamp_seconds > 129600
        for: 1h
        labels:
          severity: critical
          service: nadeshiko-postgres
        annotations:
          summary: "No fresh Postgres backup in over 36 hours"
          description: >-
            The newest dump in the R2 backup bucket is {{ $value | humanizeDuration }}
            old. The pg-backup accessory runs at 02:00 daily, so 36 hours means it has
            missed at least one run. A silent backup failure is only discovered when a
            restore is needed, which is the worst possible time.
          runbook: DEPLOYMENT.md#postgres-backups-and-restore

      # Kamal restarts containers on deploy, which bumps neither counter: a deploy
      # creates a new container starting at 0. So any increase here is Docker's
      # restart policy reacting to a crash, not a deployment.
      - alert: NadeshikoContainerRestartChurn
        expr: increase(nadeshiko_container_restart_count[1h]) > 3
        for: 5m
        labels:
          severity: warning
          service: nadeshiko-host
        annotations:
          summary: "Container {{ $labels.container }} is restart-looping"
          description: >-
            {{ $labels.container }} restarted {{ $value | humanize }} times in the last
            hour. Check `docker logs` on the host for the crash.
