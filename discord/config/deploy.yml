servers:
  web:
    hosts:
      - nadeshiko
    options:
      add-host: host.docker.internal:host-gateway
      # See the frontend's deploy.yml: Node as PID 1 does not reap orphans.
      init: true
    proxy: false

registry:
  server: ghcr.io
  username: kamal
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  # The Dockerfile copies the workspace lockfile, SDK, shared package and
  # discord app, so the build context must be the monorepo root. This also
  # makes manual deploys include the working tree being deployed instead of
  # cloning the app subdirectory as an incomplete build context.
  context: ..
  dockerfile: Dockerfile

ssh:
  user: docker

# Kamal defaults to a single 10m json-file with no rotation history, which
# truncates away the context around an incident.
logging:
  driver: json-file
  options:
    max-size: 20m
    max-file: 5

aliases:
  console: app exec -i bash
  logs: app logs -f
  register: app exec npm run register
